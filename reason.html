<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<!-- __TITLE__ -->
<title>Think Like a Biologist · Biology Entelloq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   BIOLOGY ENTELLOQ — shared product shell. IDENTICAL across every pillar page
   (Home · Learn · Solve · Explore · Me) so the product reads as one thing.
   DO NOT edit tokens, nav, or component classes when building a pillar — only
   fill <main id="page"> and add scoped rules in <style id="page-css">.
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
img,svg,canvas{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--em);outline-offset:3px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--em) 45%,transparent);color:var(--ink)}

:root{
  --em:#34d399; --em-2:#10b981; --cy:#38e0d8; --cy-2:#22d3ee;
  --indigo:#7c8cf8; --violet:#8b5cf6; --amber:#f6c667; --rose:#fb7185; --sky:#7dd3fc;
  --grad-life:linear-gradient(120deg,var(--em),var(--cy));
  --grad-mind:linear-gradient(120deg,var(--cy),var(--indigo));
  --bg:#04070a; --bg-2:#070b10; --panel:#0b1117; --raise:#0e151c;
  --ink:#eaf2f5; --dim:#9fb2bc; --faint:#7d8b93;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.05);
  --glass:rgba(10,15,20,.62); --glass-strong:rgba(8,12,17,.82); --hair:rgba(255,255,255,.10);
  --shadow-2:0 12px 40px -12px rgba(0,0,0,.7);
  --shadow-glow:0 0 0 1px rgba(52,211,153,.18),0 20px 60px -18px rgba(16,185,129,.35);
  --spot:rgba(52,211,153,.16);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1);
  --r-sm:10px; --r:16px; --r-lg:24px; --r-xl:34px;
  --edge:clamp(20px,5vw,72px); --maxw:1200px;
}
:root[data-theme="light"]{
  --bg:#f6f8f9; --bg-2:#eef2f4; --panel:#ffffff; --raise:#ffffff;
  --ink:#0c1418; --dim:#4a5a63; --faint:#5c6b74;
  --line:rgba(6,20,26,.10); --line-2:rgba(6,20,26,.06);
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.86); --hair:rgba(6,20,26,.12);
  --em:#0a7d57; --em-2:#0a7d57; --cy:#0891b2; --indigo:#5b63e6;
  --shadow-2:0 14px 44px -16px rgba(20,40,50,.28);
  --shadow-glow:0 0 0 1px rgba(14,163,113,.18),0 22px 60px -20px rgba(14,163,113,.28);
  --spot:rgba(14,163,113,.12);
  /* Accents the light theme previously inherited from dark, where they measured
     1.49:1 (amber), 2.53:1 (rose) and 3.97:1 (violet) against this background.
     Same hues, taken dark enough to read: 5.0, 5.7 and 6.7:1. */
  --violet:#6d28d9; --amber:#8a6410; --rose:#be1e46;
  /* Predict-lens sky, same treatment: #7dd3fc measures 1.67:1 on white. */
  --sky:#0369a1;
}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;
  letter-spacing:-.011em;-webkit-font-smoothing:antialiased;min-height:100%;overflow-x:hidden}

/* type scale */
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
  color:var(--em);display:inline-flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:16px;height:1px;background:currentColor;opacity:.6}
.display{font-weight:800;letter-spacing:-.03em;line-height:1.02;font-size:clamp(2.6rem,7vw,5rem)}
.h1{font-weight:800;letter-spacing:-.028em;line-height:1.05;font-size:clamp(2rem,5vw,3.4rem)}
.h2{font-weight:700;letter-spacing:-.024em;line-height:1.1;font-size:clamp(1.6rem,3.6vw,2.5rem)}
.h3{font-weight:600;letter-spacing:-.02em;line-height:1.2;font-size:clamp(1.1rem,2vw,1.35rem)}
.lead{font-size:clamp(1.02rem,1.6vw,1.3rem);color:var(--dim);line-height:1.6}
.serif{font-family:var(--serif);font-weight:400}
.grad{background:var(--grad-life);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-mind{background:var(--grad-mind);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--dim)} .faint{color:var(--faint)}

.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--edge);width:100%}
.band{padding-block:clamp(56px,9vw,110px);position:relative}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.sec-head{max-width:720px;margin-bottom:clamp(30px,5vw,54px)}
.sec-head .eyebrow{margin-bottom:16px} .sec-head h2{margin-bottom:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:9px;padding:11px 20px;border-radius:12px;font-weight:600;
  font-size:14.5px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .14s var(--ease-out),box-shadow .3s var(--ease-out),background .3s,border-color .3s}
.btn:active{transform:scale(.97)}
.btn.primary{color:#03110c;background:var(--grad-life);box-shadow:var(--shadow-glow)}
.btn.primary:hover{box-shadow:0 0 0 1px rgba(52,211,153,.3),0 26px 70px -18px rgba(16,185,129,.55)}
.btn.ghost{color:var(--ink);border:1px solid var(--hair);background:color-mix(in srgb,var(--ink) 4%,transparent)}
.btn.ghost:hover{border-color:color-mix(in srgb,var(--em) 40%,var(--hair))}
.btn .arr{transition:transform .2s var(--ease-out)} .btn:hover .arr{transform:translateX(3px)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:clamp(20px,3vw,30px);position:relative;overflow:hidden;
  transition:transform .4s var(--ease-out),border-color .4s,box-shadow .4s var(--ease-out)}
.card .glow{position:absolute;inset:-1px;border-radius:inherit;opacity:0;pointer-events:none;
  background:radial-gradient(50% 60% at var(--mx,50%) 0%,var(--spot),transparent 70%);transition:opacity .4s}
@media (hover:hover) and (pointer:fine){
  .card.lift:hover{transform:translateY(-6px);border-color:var(--hair);box-shadow:var(--shadow-2)}
  .card.lift:hover .glow{opacity:1}}
.card .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:18px;
  background:color-mix(in srgb,var(--em) 12%,transparent);color:var(--em);
  border:1px solid color-mix(in srgb,var(--em) 22%,transparent)}
.card .ico svg{width:22px;height:22px}
.card h3{margin-bottom:8px} .card p{color:var(--dim);font-size:15px;line-height:1.6}
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.chip.live{color:var(--em);border-color:color-mix(in srgb,var(--em) 30%,transparent);background:color-mix(in srgb,var(--em) 10%,transparent)}
.chip.soon{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 26%,transparent)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}

/* reveal-on-scroll (opacity+transform only) */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.06s}.reveal.d2{transition-delay:.12s}.reveal.d3{transition-delay:.18s}.reveal.d4{transition-delay:.24s}

/* ambient veil */
.bg-veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(60% 45% at 78% -5%,color-mix(in srgb,var(--cy) 10%,transparent),transparent 60%),
  radial-gradient(55% 45% at 8% 8%,color-mix(in srgb,var(--em) 10%,transparent),transparent 55%)}

/* ===== persistent product nav ===== */
header.nav{position:fixed;top:0;left:0;right:0;z-index:60;transition:background .3s,border-color .3s,backdrop-filter .3s}
header.nav.scrolled{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--maxw);margin-inline:auto;padding:12px var(--edge);display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.brand .logo{width:28px;height:28px} .brand b{font-weight:800}
.nav-links{display:flex;align-items:center;gap:2px;margin-left:6px}
.nav-links a{padding:8px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--dim);
  transition:color .2s,background .2s;position:relative}
.nav-links a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nav-links a.active{color:var(--ink)}
.nav-links a.active::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:2px;background:var(--grad-life)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;
  color:var(--dim);cursor:pointer;background:var(--panel);transition:color .2s,border-color .2s,transform .12s var(--ease-out)}
.iconbtn:hover{color:var(--ink);border-color:var(--hair)} .iconbtn:active{transform:scale(.94)} .iconbtn svg{width:17px;height:17px}
.navtoggle{display:none}
main{position:relative;z-index:1;padding-top:64px;min-height:100vh}
.mobile-menu{display:none;position:fixed;inset:64px 0 0;z-index:55;background:var(--glass-strong);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:max(24px,env(safe-area-inset-bottom));
  backdrop-filter:blur(20px);padding:24px var(--edge)}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;padding:16px 0;font-size:20px;font-weight:600;border-bottom:1px solid var(--line)}

/* footer */
footer{position:relative;z-index:1;border-top:1px solid var(--line);background:var(--bg-2);margin-top:40px}
.foot-in{max-width:var(--maxw);margin-inline:auto;padding:40px var(--edge);display:flex;flex-wrap:wrap;gap:18px;
  align-items:center;justify-content:space-between;color:var(--faint);font-size:13px}
.foot-in a{color:var(--dim)} .foot-in a:hover{color:var(--ink)}

@media (max-width:900px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:1024px){.nav-links{display:none}.navtoggle{display:grid}}
@media (max-width:680px){.g4,.g3,.g2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.12s!important}
  .reveal{opacity:1!important;transform:none!important}}

/* The primary CTA hard-codes near-black text over --grad-life, which works on the
   dark theme. Light theme darkens --em to #0a7d57, dropping that label to ~3.75:1
   over the green half of the gradient. Light mode therefore gets white text on a
   deliberately darker gradient instead. */
:root[data-theme="light"] .btn.primary{color:#fff;background:linear-gradient(120deg,var(--em),#0a6f8c)}
</style>
<style id="page-css">
/* Think Like a Biologist — reasoning engine (uses shared tokens only) */
.rz-dom{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.rz-go{transition:transform .2s var(--ease-out)}
.card:hover .rz-go{transform:translateX(3px)}
.rz{--lc:var(--em)}
.rz-back{display:inline-flex;font-size:13.5px;color:var(--dim);font-weight:600;margin-bottom:20px;transition:color .2s}
.rz-back:hover{color:var(--ink)}

/* progress rail */
.rz-rail{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 26px}
.rz-node{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);
  color:var(--faint);transition:color .3s,border-color .3s,background .3s}
.rz-node span{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);
  font-size:11px;font-weight:700;background:var(--line);color:var(--dim)}
.rz-node label{font-size:12px;font-weight:600}
.rz-node.on{color:var(--ink);border-color:color-mix(in srgb,var(--lc) 50%,transparent);background:color-mix(in srgb,var(--lc) 10%,transparent)}
.rz-node.on span{background:var(--lc);color:#04120c}
.rz-node.done{color:var(--dim)}
.rz-node.done span{background:color-mix(in srgb,var(--lc) 40%,transparent);color:var(--ink)}
@media (max-width:680px){.rz-node label{display:none}.rz-node{padding:6px}}

.rz-prompt{font-size:clamp(1.05rem,1.9vw,1.3rem);line-height:1.55;color:var(--ink);background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--lc);border-radius:var(--r);padding:22px 24px;max-width:820px}
.rz-steps{margin-top:22px;display:flex;flex-direction:column;gap:18px;max-width:820px}
.rz-step{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.rz-step.in{animation:rzIn .4s var(--ease-out)}
@keyframes rzIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rz-sthd{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--lc);margin-bottom:16px}
.rz-obs{color:var(--dim);margin-bottom:18px}
.rz-hint{color:var(--faint);font-size:14px;margin-bottom:16px}
.rz-q{font-size:17px;font-weight:600;line-height:1.4;margin-bottom:16px}

/* multi-select */
.rz-multi{display:grid;gap:10px;margin-bottom:16px}
.rz-mo{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:13px 15px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;font-size:14.5px;color:var(--dim);transition:border-color .2s,color .2s,background .2s}
.rz-mo:hover:not(:disabled){color:var(--ink);border-color:var(--hair)}
.rz-check{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--faint);flex:none;margin-top:1px;transition:all .2s;position:relative}
.rz-mo.sel .rz-check{background:var(--em);border-color:var(--em)}
.rz-mo.sel .rz-check::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#04120c}
.rz-mo.sel{color:var(--ink);border-color:color-mix(in srgb,var(--em) 40%,transparent)}
.rz-mo.ans-yes{border-color:var(--em);background:color-mix(in srgb,var(--em) 12%,transparent);color:var(--ink)}
.rz-mo.ans-no{opacity:.55}
.rz-mo.ans-no.miss{opacity:1;border-color:var(--rose);background:color-mix(in srgb,var(--rose) 10%,transparent)}

/* MCQ */
.rz-opts{display:grid;gap:10px;margin-bottom:6px}
.rz-opt{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;font-size:14.5px;color:var(--dim);transition:border-color .2s,color .2s,background .2s}
.rz-opt:hover:not(:disabled){color:var(--ink);border-color:var(--hair)}
.rz-opt.right{border-color:var(--em);background:color-mix(in srgb,var(--em) 14%,transparent);color:var(--ink)}
.rz-opt.wrong{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent);color:var(--ink)}
.rz-opt.muted{opacity:.5}

.rz-fb{margin-top:14px}
.rz-verdict{font-weight:700;font-size:15px;margin-bottom:8px}
.rz-verdict.ok{color:var(--em)} .rz-verdict.no{color:var(--rose)}
.rz-fb p{color:var(--dim);font-size:14.5px;line-height:1.65;margin-bottom:10px;max-width:680px}
.rz-fb .rz-next,.rz-step>.btn{margin-top:12px}

/* worked reasoning */
.rz-reason{margin:18px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:12px;counter-reset:r}
.rz-reason li{color:var(--dim);font-size:15px;line-height:1.6;position:relative;list-style:none}
.rz-reason li.in{animation:rzIn .4s var(--ease-out) both}
.rz-reason li::before{counter-increment:r;content:counter(r);position:absolute;left:-22px;top:1px;width:18px;height:18px;
  border-radius:50%;background:color-mix(in srgb,var(--lc) 18%,transparent);color:var(--lc);font-family:var(--mono);
  font-size:10px;font-weight:700;display:grid;place-items:center}

/* reflect */
.rz-reflect{display:grid;gap:12px}
.rz-rc{padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel);border-left:3px solid var(--faint)}
.rz-rc.mis{border-left-color:var(--rose)} .rz-rc.alt{border-left-color:var(--cy)} .rz-rc.pri{border-left-color:var(--amber)}
.rz-rtag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:8px}
.rz-rc.mis .rz-rtag{color:var(--rose)} .rz-rc.alt .rz-rtag{color:var(--cy)} .rz-rc.pri .rz-rtag{color:var(--amber)}
.rz-rc p{color:var(--dim);font-size:14.5px;line-height:1.6}
.rz-done{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}

</style>
</head>

      :'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>';}
  try{setTheme(localStorage.getItem("bioq_theme")||"dark");}catch(e){setTheme("dark");}
  $("#themeBtn").addEventListener("click",()=>setTheme(root.getAttribute("data-theme")==="light"?"dark":"light"));
  // nav scroll state
  const nav=$("#nav"); addEventListener("scroll",()=>nav.classList.toggle("scrolled",scrollY>16),{passive:true});
  nav.classList.toggle("scrolled",scrollY>16);
  // mobile menu
  const mm=$("#mobileMenu"),nt=$("#navToggle");
  nt.addEventListener("click",()=>{const o=mm.classList.toggle("open");nt.setAttribute("aria-expanded",o?"true":"false");});

  const page=document.body.dataset.page; if(page){const a=document.querySelector('.nav-links a[data-nav="'+page+'"]'); if(a)a.classList.add("active");}
  // scroll reveal
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12,rootMargin:"0px 0px -6% 0px"});
  function observe(){$$(".reveal:not(.in)").forEach(el=>io.observe(el));}
  observe(); window.__observeReveals=observe;
  // card glow
  addEventListener("pointermove",e=>{const c=e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect();
    c.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");},{passive:true});
})();

<script id="page-js">
/* ============================================================================
   Biology Entelloq — "THINK LIKE A BIOLOGIST" reasoning engine.
   Translated from Physics Entelloq's Reason scaffold. Not a quiz — a guided
   reasoning workout: for each scenario you name the principles in play, identify
   what the system REGULATES, find the structure-function link, choose a strategy
   (wrong choices surface the classic misconception), then reveal the worked
   reasoning and generalise. It teaches HOW a biologist thinks, not just answers.
   ========================================================================== */
(function () {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };

  const STEPS = ["Observe", "Principles", "What's regulated", "Form & function", "Strategy", "Reason", "Generalise"];

  const PROBLEMS = [
    {
      id: "altitude", domain: "Human Physiology", color: "#fb7185",
      title: "The mountaineer's blood",
      prompt: "A climber moves from sea level to a Himalayan base camp at 5,000 m and stays for three weeks. A blood test on arrival is normal; three weeks later her red-blood-cell count is markedly higher. She hasn't trained or taken any drug. Reason through why her body did this.",
      principles: { hint: "Which biological principles are genuinely in play?",
        options: [
          { t: "Homeostasis — the body defends a set point (here, oxygen delivery)", ok: true },
          { t: "Negative feedback — a sensed drop triggers a correcting response", ok: true },
          { t: "Natural selection acting within her lifetime", ok: false },
          { t: "Gas exchange & oxygen transport by haemoglobin", ok: true },
          { t: "The red cells sensed the altitude and decided to divide", ok: false },
        ] },
      regulated: { q: "What is her body actually regulating?", o: ["The number of red blood cells, as an end in itself", "Oxygen delivery to the tissues", "Her blood pressure", "The altitude"], a: 1,
        why: "The set point being defended is OXYGEN DELIVERY. Red-cell count is just one lever the body pulls to defend it. Naming the regulated variable — not the mechanism — is the first move of physiological reasoning." },
      form: { q: "Which structure-function link carries the signal?", o: ["The lungs make more haemoglobin directly", "Kidney cells sense low oxygen and release the hormone erythropoietin (EPO), which tells bone marrow to make more red cells", "The heart pumps harder, creating red cells", "Muscles convert to red cells under stress"], a: 1,
        why: "Specialised oxygen-sensing cells in the KIDNEY release EPO when oxygen falls. EPO travels to the BONE MARROW, whose job is making blood cells. Structure fits function at every step — sensor, messenger, factory." },
      strategy: { q: "What's the soundest way to reason this out?", o: [
        { t: "Start from the STIMULUS (low O₂), follow the feedback loop to the response", ok: true },
        { t: "Assume the body 'wants' more red cells and work backwards", ok: false, why: "Biology has no 'wants'. Teleology feels intuitive but hides the mechanism. Always trace the actual signal, sensor and effector." },
        { t: "Conclude it's a coincidence / measurement error", ok: false, why: "The effect is real and reproducible (it's why athletes altitude-train). Dismissing a consistent result skips the reasoning." },
      ] },
      reason: [
        "Thin air at altitude means each breath delivers less oxygen — arterial O₂ falls.",
        "Oxygen-sensing cells in the kidney detect the drop (the SENSOR).",
        "They secrete more erythropoietin (EPO) — the MESSENGER — into the blood.",
        "EPO reaches the bone marrow (the EFFECTOR) and ramps up red-cell production.",
        "More red cells → more haemoglobin → oxygen delivery is restored toward its set point.",
        "This is negative feedback: the response (more O₂ delivery) removes the original stimulus (low O₂).",
      ],
      reflect: {
        misconception: "The cells did NOT 'sense the altitude and choose to divide.' No single cell knows it's on a mountain — a hormonal loop between kidney and marrow does the work.",
        alternative: "The body also breathes faster and the heart beats harder immediately — fast responses buy time while the slow red-cell response builds over weeks. Real regulation layers fast and slow loops.",
        principle: "GENERAL PRINCIPLE: a homeostatic system defends a regulated variable through sensor → signal → effector negative feedback. Find those three parts and any regulation makes sense.",
      },
    },
    {
      id: "resistance", domain: "Evolution", color: "#f6c667",
      title: "The antibiotic that stopped working",
      prompt: "A patient's bacterial infection is wiped out by an antibiotic. Months later the same infection returns — but now the drug barely works. The bacteria seem to have 'learned' to resist it. Reason through what actually happened.",
      principles: { hint: "Which principles are truly at work?",
        options: [
          { t: "Variation — the bacterial population wasn't genetically identical", ok: true },
          { t: "Differential survival & reproduction (natural selection)", ok: true },
          { t: "Heredity — survivors pass resistance to offspring", ok: true },
          { t: "Individual bacteria adapted by trying harder", ok: false },
          { t: "The antibiotic taught the bacteria to resist", ok: false },
        ] },
      regulated: { q: "What did the antibiotic actually do to the population?", o: ["Made each bacterium tougher", "Acted as a selection pressure — killing the susceptible, sparing the few already resistant", "Created new resistance genes", "Slowed bacterial breathing"], a: 1,
        why: "The drug is a FILTER, not a teacher. Resistant variants existed by chance BEFORE the drug arrived (mutation is random). The antibiotic simply removed everyone else, so the survivors' descendants dominate." },
      form: { q: "Where does the resistance physically come from?", o: ["The bacteria will it into being", "A pre-existing mutation — e.g. a pump that ejects the drug, or an enzyme that breaks it", "The patient's immune system", "The antibiotic mutating"], a: 1,
        why: "Resistance is a molecular structure: an efflux pump, a drug-degrading enzyme, or an altered target the drug can't grip. These arise by random mutation and, once selected, spread — even hopping between bacteria on plasmids." },
      strategy: { q: "How should you reason about the population over time?", o: [
        { t: "Track how ALLELE FREQUENCIES shift under selection, generation by generation", ok: true },
        { t: "Think about what one bacterium does when it meets the drug", ok: false, why: "Evolution acts on POPULATIONS across generations, not on an individual in the moment. The single-bacterium view is the classic Lamarckian trap." },
        { t: "Assume the drug caused the mutations it selects for", ok: false, why: "Mutations are random and pre-exist selection (Luria–Delbrück, 1943). The drug selects; it does not create." },
      ] },
      reason: [
        "A huge bacterial population carries random genetic variation — including, by chance, a few cells with a resistance mutation.",
        "The antibiotic kills the susceptible majority but the resistant few survive (differential survival).",
        "Those survivors reproduce — bacteria divide every ~20 minutes — passing resistance on (heredity).",
        "Within the population, the frequency of the resistance allele climbs from rare to common.",
        "Months later the infection is dominated by descendants of the resistant survivors — the drug now barely works.",
        "No individual 'learned' anything; the population's composition changed. That is evolution by natural selection.",
      ],
      reflect: {
        misconception: "Bacteria don't 'learn' or 'try' to resist, and the antibiotic doesn't 'teach' them. Resistance is selected FROM pre-existing random variation, not induced by the drug.",
        alternative: "Resistance genes also spread horizontally via plasmids passed between bacteria — so selection AND gene transfer both matter. Real evolution is messier than one clean mechanism.",
        principle: "GENERAL PRINCIPLE: variation + heredity + differential reproduction = evolution by natural selection. Selection edits existing variation; it does not create it on demand.",
      },
    },
    {
      id: "glucose", domain: "Human Physiology", color: "#34d399",
      title: "The sugar that came back down",
      prompt: "You eat a large plate of rice. Your blood-glucose concentration spikes within the hour — then, over the next two hours, drifts back to exactly where it started, without you doing anything. Trace the regulation that pulled it back.",
      principles: { hint: "Which principles govern this?",
        options: [
          { t: "Homeostasis — blood glucose is held near a set point", ok: true },
          { t: "Negative feedback via hormones", ok: true },
          { t: "Antagonistic control (two opposing hormones)", ok: true },
          { t: "Diffusion alone brings glucose back to normal", ok: false },
          { t: "The pancreas predicts meals in advance", ok: false },
        ] },
      regulated: { q: "What variable is being defended?", o: ["The amount of insulin", "Blood-glucose concentration", "The size of the meal", "Stomach acidity"], a: 1,
        why: "The regulated variable is BLOOD-GLUCOSE CONCENTRATION (~5 mmol/L). Insulin is just the effector signal used to defend it — don't confuse the lever with the thing being held steady." },
      form: { q: "Which cells sense and respond?", o: ["Liver cells sense glucose and make insulin", "β-cells in the pancreas sense high glucose and secrete insulin, which tells liver & muscle to take glucose up and store it as glycogen", "Red blood cells absorb the excess", "The brain burns it off"], a: 1,
        why: "Pancreatic β-cells are the glucose SENSOR and insulin SOURCE. Insulin's targets have the structure to pull glucose out of the blood — muscle and fat push GLUT4 transporters into the membrane so uptake itself rises, while the liver (whose GLUT2 is open either way) responds by switching on glucokinase and glycogen synthase, trapping glucose as glycogen. Sensor, signal, effector again." },
      strategy: { q: "Best reasoning approach?", o: [
        { t: "Follow the negative-feedback loop: high glucose → insulin → uptake → glucose falls → insulin stops", ok: true },
        { t: "Assume glucose just gets 'used up' by activity", ok: false, why: "At rest, with no exercise, the fall is driven by regulated STORAGE (glycogenesis), not by burning it off. Consumption alone can't explain the precise return to set point." },
        { t: "Think of insulin as always-on", ok: false, why: "Insulin is released in PROPORTION to glucose and switches off as glucose normalises — that's what stops the correction from overshooting." },
      ] },
      reason: [
        "Rice is digested to glucose, which floods into the blood — glucose rises above the set point (the stimulus).",
        "Pancreatic β-cells sense the rise and secrete insulin in proportion (sensor + signal).",
        "Insulin tells liver and muscle to take glucose up and store it as glycogen (effector response).",
        "Blood glucose falls back toward the set point; as it does, insulin secretion winds down.",
        "This is negative feedback — the response removes the stimulus and then quiets itself.",
        "If glucose later drops too low, the antagonistic hormone glucagon does the reverse — releasing stored glucose. Two opposing loops hold the line.",
      ],
      reflect: {
        misconception: "Diffusion doesn't 'even out' blood glucose back to a set point — an active, hormone-driven feedback loop does. And the pancreas reacts to glucose; it doesn't predict your meal.",
        alternative: "Regulation is antagonistic: insulin lowers glucose, glucagon raises it. Many homeostatic variables (glucose, calcium, temperature) are held by such push-pull pairs, not a single hormone.",
        principle: "GENERAL PRINCIPLE: tight homeostasis usually comes from ANTAGONISTIC negative-feedback loops — one to correct each direction of drift. Find both, and the steadiness makes sense.",
      },
    },
  ];

  const app = document.getElementById("reasonApp");

  function route() {
    const id = location.hash.replace(/^#/, "");
    const p = PROBLEMS.find((x) => x.id === id);
    if (p) renderProblem(p); else renderList();
    scrollTo({ top: 0, behavior: "smooth" });
    if (window.__observeReveals) window.__observeReveals();
  }
  addEventListener("hashchange", route);

  function renderList() {
    app.innerHTML = "";
    const head = el("div", "wrap band reveal", `
      <div class="eyebrow">Think like a biologist</div>
      <h1 class="h1" style="margin:16px 0 16px">Don't memorise answers.<br><span class="grad">Build the reasoning.</span></h1>
      <p class="lead" style="max-width:640px">Each workout walks you through how a biologist actually thinks — name the principles, find what's regulated, follow the structure to the function, choose a strategy, then reason it out and generalise.</p>`);
    app.appendChild(head);
    const wrap = el("div", "wrap"); const g = el("div", "grid g3"); wrap.appendChild(g);
    PROBLEMS.forEach((p, i) => {
      const c = el("a", "card lift reveal d" + ((i % 3) + 1)); c.href = "#" + p.id; c.style.setProperty("--lc", p.color);
      c.innerHTML = `<div class="glow"></div><div class="rz-dom" style="color:${p.color}">${p.domain}</div>
        <h3 class="h3" style="margin:6px 0 10px">${p.title}</h3><p>${p.prompt.slice(0, 120)}…</p>
        <div class="rz-go" style="color:${p.color};margin-top:14px;font-size:13.5px;font-weight:600">Reason it through →</div>`;
      g.appendChild(c);
    });
    app.appendChild(wrap);
  }

  function renderProblem(p) {
    app.innerHTML = "";
    const root = el("div", "wrap band rz"); root.style.setProperty("--lc", p.color);
    root.innerHTML = `
      <a class="rz-back" href="#">← All workouts</a>
      <div class="rz-dom" style="color:${p.color}">${p.domain}</div>
      <h1 class="h1" style="margin:10px 0 18px">${p.title}</h1>
      <div class="rz-rail">${STEPS.map((s, i) => `<div class="rz-node" data-i="${i}"><span>${i + 1}</span><label>${s}</label></div>`).join("")}</div>
      <div class="rz-prompt reveal">${p.prompt}</div>
      <div class="rz-steps" id="rzSteps"></div>`;
    app.appendChild(root);
    const host = $("#rzSteps", root);
    const nodes = [...root.querySelectorAll(".rz-node")];
    let step = 0;
    function mark(i) { nodes.forEach((n, j) => { n.classList.toggle("on", j === i); n.classList.toggle("done", j < i); }); }
    function advance() { step++; mark(step); render(); }
    function render() {
      // Observe is step 0 = the prompt is already shown; begin at step 1.
      mark(step);
      if (step === 0) { host.innerHTML = ""; const b = el("div", "rz-step in"); b.innerHTML = `<p class="rz-obs">Read the scenario above, then start reasoning.</p><button class="btn primary rz-next">Begin reasoning →</button>`; b.querySelector(".rz-next").addEventListener("click", advance); host.appendChild(b); return; }
      if (step === 1) return stepMulti(p.principles);
      if (step === 2) return stepMcq("What's regulated", p.regulated);
      if (step === 3) return stepMcq("Form & function", p.form);
      if (step === 4) return stepStrategy(p.strategy);
      if (step === 5) return stepReason(p.reason);
      if (step === 6) return stepReflect(p.reflect);
    }
    function addStep(title, inner) { const s = el("div", "rz-step in"); s.innerHTML = `<div class="rz-sthd">${title}</div>` + inner; host.appendChild(s); return s; }

    function stepMulti(d) {
      const s = addStep("Which principles are in play?", `<p class="rz-hint">${d.hint} Select every one that applies.</p>
        <div class="rz-multi">${d.options.map((o, i) => `<button class="rz-mo" data-i="${i}"><span class="rz-check"></span>${o.t}</button>`).join("")}</div>
        <button class="btn ghost rz-check-btn">Check my selection</button><div class="rz-fb" id="fb" role="status"></div>`);
      const opts = [...s.querySelectorAll(".rz-mo")]; const sel = new Set();
      opts.forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.i; if (sel.has(i)) { sel.delete(i); b.classList.remove("sel"); } else { sel.add(i); b.classList.add("sel"); } }));
      s.querySelector(".rz-check-btn").addEventListener("click", () => {
        let right = 0, total = 0; d.options.forEach((o, i) => { if (o.ok) total++; opts[i].classList.add(o.ok ? "ans-yes" : "ans-no"); opts[i].disabled = true; if (o.ok && sel.has(i)) right++; if (!o.ok && sel.has(i)) opts[i].classList.add("miss"); });
        s.querySelector("#fb").innerHTML = `<div class="rz-verdict">You caught <b>${right}/${total}</b> principles. The genuine ones are highlighted — the distractors are the everyday traps (teleology, "cells decide", diffusion-does-everything).</div><button class="btn primary rz-next">Continue →</button>`;
        s.querySelector(".rz-next").addEventListener("click", advance);
      });
    }
    function stepMcq(title, d) {
      const s = addStep(title, `<div class="rz-q">${d.q}</div><div class="rz-opts">${d.o.map((o, i) => `<button class="rz-opt" data-i="${i}">${o}</button>`).join("")}</div><div class="rz-fb" id="fb" role="status"></div>`);
      const opts = [...s.querySelectorAll(".rz-opt")]; let done = false;
      opts.forEach((b) => b.addEventListener("click", () => { if (done) return; done = true; const i = +b.dataset.i; opts.forEach((o, j) => { o.disabled = true; o.classList.add(j === d.a ? "right" : j === i ? "wrong" : "muted"); }); s.querySelector("#fb").innerHTML = `<div class="rz-verdict ${i === d.a ? "ok" : "no"}">${i === d.a ? "✓ Right." : "✗ Look again."}</div><p>${d.why}</p><button class="btn primary rz-next">Continue →</button>`; s.querySelector(".rz-next").addEventListener("click", advance); }));
    }
    function stepStrategy(d) {
      const s = addStep("Choose your strategy", `<div class="rz-q">${d.q}</div><div class="rz-opts">${d.o.map((o, i) => `<button class="rz-opt" data-i="${i}">${o.t}</button>`).join("")}</div><div class="rz-fb" id="fb" role="status"></div>`);
      const opts = [...s.querySelectorAll(".rz-opt")]; let done = false;
      opts.forEach((b) => b.addEventListener("click", () => { if (done) return; const i = +b.dataset.i; const o = d.o[i]; if (o.ok) { done = true; opts.forEach((x, j) => { x.disabled = true; x.classList.add(d.o[j].ok ? "right" : "muted"); }); s.querySelector("#fb").innerHTML = `<div class="rz-verdict ok">✓ That's the biologist's move.</div><button class="btn primary rz-next">Reveal the reasoning →</button>`; s.querySelector(".rz-next").addEventListener("click", advance); } else { b.classList.add("wrong"); b.disabled = true; s.querySelector("#fb").innerHTML = `<div class="rz-verdict no">✗ A classic trap.</div><p>${o.why}</p><p class="rz-hint">Try another strategy.</p>`; } }));
    }
    function stepReason(steps) {
      const s = addStep("Reason it out", `<button class="btn ghost rz-reveal">Reveal the worked reasoning</button><ol class="rz-reason" id="ro" style="display:none"></ol><div id="fb" role="status"></div>`);
      s.querySelector(".rz-reveal").addEventListener("click", (e) => {
        e.target.style.display = "none"; const ol = s.querySelector("#ro"); ol.style.display = "";
        steps.forEach((t, i) => { const li = el("li", "in"); li.style.animationDelay = i * 0.08 + "s"; li.textContent = t; ol.appendChild(li); });
        s.querySelector("#fb").innerHTML = `<button class="btn primary rz-next" style="margin-top:18px">Generalise →</button>`;
        s.querySelector(".rz-next").addEventListener("click", advance);
      });
    }
    function stepReflect(d) {
      addStep("Generalise", `<div class="rz-reflect">
        <div class="rz-rc mis"><span class="rz-rtag">△ Misconception</span><p>${d.misconception}</p></div>
        <div class="rz-rc alt"><span class="rz-rtag">↻ Another angle</span><p>${d.alternative}</p></div>
        <div class="rz-rc pri"><span class="rz-rtag">★ Principle</span><p>${d.principle}</p></div>
      </div>
      <div class="rz-done"><a class="btn ghost" href="#">More workouts</a><a class="btn primary" href="./solve.html">Practise problems →</a></div>`);
      mark(7);
    }
    mark(0); render();
  }

  route();
})();

</script>

<script id="atmo-js">
/* ============================================================================
   BIOLOGY ENTELLOQ — THE LIVING FIELD.

   Physics Entelloq puts a sheet of spacetime behind the product and bends it
   around the cursor. This is the biological answer to that, and it is not the
   same idea in different colours: matter is passive and gets curved, whereas
   tissue is ALIVE and reaches toward what it wants. So the field here is a thick
   section of living tissue seen down a microscope, and the cursor is a nutrient
   source. Cells near it swell, their membranes brighten, and the capillary
   network grows toward it — chemotaxis, the oldest behaviour there is.

   Four things are happening at once in the shader:
     · a Worley cell field (membranes are the F2-F1 ridge — the real thing under
       phase contrast) in two parallax layers, so the section has thickness
     · a domain warp driven by slow fbm, because no real tissue is on a grid
     · ridged fbm capillaries that bias their flow toward the cursor
     · a breath — everything respires at about 7 cycles a minute, which is why
       it reads as alive rather than as a screensaver on a loop

   SELF-INSTALLING. Dropping this one <script> onto a page is the whole install:
   it makes its own canvas, injects its own CSS, picks its colour from
   <body data-page>, and follows the light/dark toggle. It never needs markup.
   ========================================================================== */
(function () {
  "use strict";
  if (window.BIOQ_ATMO) return;                       // idempotent: safe to double-inject

  // Inside the unified app shell each section loads in an iframe with ?embed=1.
  // The shell already has a field; a second one per iframe would mean two WebGL
  // contexts fighting for the GPU and a visible seam where the two tissues meet.
  // So the embedded page renders none of its own and goes transparent instead,
  // letting the shell's single continuous field show through — which is also why
  // navigating between sections never interrupts it.
  try {
    if (new URLSearchParams(location.search).get("embed")) {
      var t = document.createElement("style");
      t.id = "atmo-embed";
      t.textContent = "html,body{background:transparent!important}.bg-veil{display:none!important}";
      (document.head || document.documentElement).appendChild(t);
      window.BIOQ_ATMO = { theme: function () {}, setSection: function () {}, mouse: null, mode: "embedded" };
      return;
    }
  } catch (e) {}

  /* --- where the colour comes from -------------------------------------- */
  // Each pillar gets its own biology, and the hues deliberately match the `tc`
  // accent the app shell already assigns that view — so the field is the same
  // colour as the section you are standing in rather than a second, competing
  // palette. Intensity is how ALIVE the field looks: the Lab runs hot, Me runs quiet.
  var SECTIONS = {
    home:     ["#34d399", 0.44],   // em     — chlorophyll
    learn:    ["#34d399", 0.52],   // em
    lessons:  ["#38e0d8", 0.50],   // cy
    reason:   ["#8b5cf6", 0.48],   // violet — the colour of thinking
    labs:     ["#f6c667", 0.52],   // amber  — a bench lamp
    solve:    ["#7c8cf8", 0.48],   // indigo
    explore:  ["#38e0d8", 0.58],   // cy     — open water
    me:       ["#c9a86a", 0.34],   // quiet, warm, low
    about:    ["#34d399", 0.46],   // em
    lab:      ["#fb7185", 0.64],   // rose   — an opened body, and the field runs hot
    universe: ["#38e0d8", 0.60]    // cy
  };

  var reduced = false;
  try { reduced = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  var STILL = reduced || /[?&#](still|print)=?1?/.test(location.search + location.hash);

  /* --- install ----------------------------------------------------------- */
  var css = document.createElement("style");
  css.id = "atmo-css";
  css.textContent =
    // z-index:-1, NOT 0. A positioned element at z-index:0 paints ABOVE ordinary
    // in-flow block content, so the field would cover the page. Negative z puts it
    // between the root background and everything else, which means not one existing
    // element needs its position or stacking touched — and the product's fixed nav
    // (position:fixed;z-index:60) keeps working exactly as before.
    "#atmo{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;" +
      "opacity:0;transition:opacity 1.2s cubic-bezier(.22,1,.36,1);display:block}" +
    "#atmo.lit{opacity:.78}" +
    // In light mode the same field reads as a stained section on a white slide, so
    // it stays — but fainter, because ink on paper is a quieter medium.
    "html[data-theme=\"light\"] #atmo.lit{opacity:.42}" +
    // The pages paint --bg on BOTH html and body; body's copy would hide a
    // negative-z child, so hand the background to the root alone. --bg is a themed
    // custom property, so this keeps following the light/dark toggle for free.
    "html{background:var(--bg,#04070a)}body{background:transparent!important}";
  (document.head || document.documentElement).appendChild(css);

  var cv = document.createElement("canvas");
  cv.id = "atmo";
  cv.setAttribute("aria-hidden", "true");
  // NOTE: attach() is *declared* here but deliberately not *called* until the very
  // bottom of this module. It reaches into cur/tgt/M/FS/VS, all of which are `var`
  // bindings that are hoisted but still undefined at this point in the file —
  // calling it here would throw on the first property write and silently leave the
  // page with no field at all.
  function attach() {
    if (!document.body) return setTimeout(attach, 16);
    document.body.insertBefore(cv, document.body.firstChild);
    // The class is what fades the field in, and it must land on a LATER frame than
    // the insert or the CSS transition has nothing to transition from. rAF is the
    // usual way to get that, but rAF does not run at all in a background tab — so a
    // page that loads hidden would sit at opacity 0. The timer is the backstop;
    // adding the class twice costs nothing.
    function lit() { cv.classList.add("lit"); }
    requestAnimationFrame(lit);
    setTimeout(lit, 80);
    boot();
  }

  /* --- state ------------------------------------------------------------- */
  function hexRGB(h) {
    h = String(h).replace("#", "");
    return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
  }
  var cur = { r: 0.20, g: 0.83, b: 0.60, in: 0.44, lt: 0 };
  var tgt = { r: 0.20, g: 0.83, b: 0.60, in: 0.44, lt: 0 };
  var M = { x: innerWidth / 2, y: innerHeight / 2, tx: innerWidth / 2, ty: innerHeight / 2, live: 0, tlive: 0 };

  addEventListener("pointermove", function (e) {
    M.tx = e.clientX; M.ty = e.clientY; M.tlive = 1;
  }, { passive: true });
  // A pointer that has left should stop feeding the tissue, or the glow sits there
  // forever on a page nobody is touching. pointerleave does not bubble, so it has
  // to be bound to the root element rather than to window; mouseout with a null
  // relatedTarget is the belt-and-braces case for leaving through the chrome.
  document.documentElement.addEventListener("pointerleave", function () { M.tlive = 0; }, { passive: true });
  addEventListener("mouseout", function (e) { if (!e.relatedTarget) M.tlive = 0; }, { passive: true });
  addEventListener("blur", function () { M.tlive = 0; });
  // Touch has no hover: without this the glow would stay wherever the last tap
  // landed, permanently, on every phone.
  addEventListener("pointerup", function (e) {
    if (e.pointerType !== "mouse") M.tlive = 0;
  }, { passive: true });

  function theme(rgb, intensity) {
    tgt.r = rgb[0]; tgt.g = rgb[1]; tgt.b = rgb[2];
    if (typeof intensity === "number") tgt.in = intensity;
  }
  function setSection(key) {
    var s = SECTIONS[key] || SECTIONS.home;
    theme(hexRGB(s[0]), s[1]);
    nudge();                             // navigating must restain the field even in STILL mode
  }
  // repaint is filled in by whichever renderer boots. In STILL mode (reduced
  // motion, or ?still=1) exactly one frame is ever drawn, so without this a reader
  // who switches to light mode would be left looking at the dark field forever.
  var repaint = null;
  function nudge() {
    if (!STILL || !repaint) return;      // the animated path picks the change up on its own
    for (var i = 0; i < 60; i++) ease(); // settle the eased colour, then draw the one frame
    repaint(0);
  }
  function readTheme() {
    var next = (document.documentElement.getAttribute("data-theme") === "light") ? 1 : 0;
    if (next === tgt.lt) return;
    tgt.lt = next;
    nudge();
  }

  function ease() {
    cur.r += (tgt.r - cur.r) * 0.035; cur.g += (tgt.g - cur.g) * 0.035;
    cur.b += (tgt.b - cur.b) * 0.035; cur.in += (tgt.in - cur.in) * 0.035;
    cur.lt += (tgt.lt - cur.lt) * 0.08;
    M.x += (M.tx - M.x) * 0.075; M.y += (M.ty - M.y) * 0.075;
    M.live += (M.tlive - M.live) * 0.04;
  }

  /* --- the field --------------------------------------------------------- */
  var FS = [
    "precision mediump float;",
    "uniform vec2 uRes;uniform float uT;uniform vec2 uM;uniform vec3 uC;uniform float uIn;uniform float uLive;uniform float uLight;",

    "float h1(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}",
    "vec2 h2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}",
    "float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);",
    " float a=h1(i),b=h1(i+vec2(1,0)),c=h1(i+vec2(0,1)),d=h1(i+vec2(1,1));",
    " return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}",
    "float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*vn(p);p*=2.07;a*=.5;}return v;}",
    // Ridged noise gives threads instead of blobs — this is what makes a capillary
    // look like a vessel and not like a cloud.
    "float ridge(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*(1.-abs(vn(p)*2.-1.));p*=2.11;a*=.5;}return v;}",

    // Worley. Returns (F1, F2-F1, cell id). Every nucleus orbits its own cell on a
    // slow private path, so no two cells ever pulse together.
    "vec3 cells(vec2 p,float t){vec2 n=floor(p),f=fract(p);",
    " float f1=8.,f2=8.;vec2 id=vec2(0.);",
    " for(int j=-1;j<=1;j++){for(int i=-1;i<=1;i++){",
    "  vec2 g=vec2(float(i),float(j));vec2 o=h2(n+g);",
    "  o=.5+.40*sin(t*.32+6.2831*o);",
    "  float d=length(g+o-f);",
    "  if(d<f1){f2=f1;f1=d;id=n+g;}else if(d<f2){f2=d;}",
    " }}",
    " return vec3(f1,f2-f1,h1(id));}",

    "void main(){",
    " vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;",
    " vec2 m=(uM-.5*uRes)/uRes.y;m.y*=-1.;",
    " float t=uT;",
    // ~7 breaths a minute. Slow enough that you feel it rather than watch it.
    " float breath=.5+.5*sin(t*.72);",

    // Chemotaxis. Everything below is stronger the closer it is to the cursor,
    // and uLive fades the whole effect out when the pointer leaves.
    " float rm=length(uv-m);",
    // Tight. A wide gradient turns the whole page into a lamp; the point is a
    // local response in the tissue the pointer is actually over, so the falloff
    // is effectively gone by a third of the screen height.
    " float food=exp(-rm*rm*7.5)*uLive;",

    // Domain warp — the reason this reads as tissue and not as a tiling.
    " vec2 w=uv+vec2(fbm(uv*1.5+t*.05),fbm(uv*1.5-t*.04+11.3))*.34;",
    // Tissue swells toward the food source: cells near the cursor get physically
    // bigger by shrinking the sampling scale there.
    " float swell=1.-food*.30;",

    // Two layers at different depths. The far one drifts slower and sits dimmer,
    // which is what gives a flat quad the thickness of a real section.
    " vec3 c1=cells(w*3.4*swell+vec2(t*.020,-t*.014),t);",
    " vec3 c2=cells(w*6.9*swell+vec2(-t*.030,t*.023)+31.7,t*1.25);",

    // Membrane = the F2-F1 ridge. This is the single most biological line there is.
    " float mem1=1.-smoothstep(.0,.085,c1.y);",
    " float mem2=1.-smoothstep(.0,.060,c2.y);",
    // Cytoplasm: each cell tinted by its own id, so the field has variation
    // rather than one flat wash.
    " float cyto=(.35+.65*c1.z)*(1.-smoothstep(.15,.85,c1.x));",
    // Nuclei, breathing slightly out of phase per cell.
    " float nuc=smoothstep(.135+.02*sin(t*.6+c1.z*31.),.0,c1.x)*(.55+.45*c1.z);",

    // Capillaries, warped again so they wander, and pulled toward the cursor so
    // the network visibly grows in that direction.
    " vec2 vp=w*2.3+vec2(t*.035,-t*.028)-normalize(uv-m+1e-4)*food*.55;",
    " float vas=ridge(vp);",
    " vas=pow(max(vas-.62,0.)*2.6,2.0);",

    // Motes — organelles and spores adrift in the medium, the counterpart to the
    // stars in the physics field. They rise, because everything in a fluid does.
    " vec2 sp=w*17.0+vec2(0.,-t*.10);vec2 si=floor(sp);vec2 sf=fract(sp)-.5;",
    " float sv=h1(si);",
    " float mote=step(.972,sv)*smoothstep(.055,0.,length(sf-(h2(si)-.5)*.6))*(.55+.45*sin(t*2.1+sv*44.));",

    // --- compose ---
    " float lum=(.030+.055*breath)*(.55+uIn);",
    " vec3 col=vec3(.012,.026,.034)*(1.-uLight);",
    " col+=uC*cyto*lum*1.35;",

  /* --- go ---------------------------------------------------------------- */
  // Last line on purpose: everything above is now assigned, so boot() can read it.
  attach();

        '<input id="bq-cid" type="text" spellcheck="false" autocomplete="off" placeholder="…apps.googleusercontent.com" ' +
        'aria-label="Google OAuth client ID">' +
        '<button class="bq-act" data-act="setcid">Use this client ID</button>' +
        (noteMsg ? '<div class="bq-note">' + esc(noteMsg) + "</div>" : "");
    }
    return "<h4>Sign in with Google</h4><p>This puts your name and picture on your space. It does not move your " +
      "work anywhere — there is no server behind this product, and your progress stays in this browser.</p>" +
      '<div id="bq-gbtn"></div>' +
      (noteMsg ? '<div class="bq-note">' + esc(noteMsg) + "</div>" : "") +
      '<div class="bq-priv"><span aria-hidden="true">🔒</span><span>Google sees a sign-in. Biology Entelloq sees ' +
      "a name and a picture, and keeps them here.</span></div>";
  }

  function render() {
    var u = user();
    // innerHTML below replaces the very button that was just clicked, so whatever
    // had focus is destroyed mid-interaction and focus drops to <body>. Remember
    // where it was and put it back — but only if it was ours, or we would steal
    // focus from somewhere else on the page.
    var refocus = hosts.some(function (h) { return h.contains(document.activeElement); });
    hosts.forEach(function (h) {
      h.innerHTML =
        '<button type="button" aria-haspopup="dialog" aria-expanded="' + (open ? "true" : "false") + '">' +
          avatar(u) + '<span class="nm">' + (u ? esc(u.n) : "Sign in") + "</span></button>" +
        '<div class="bq-pop' + (open ? " on" : "") + '" role="dialog" aria-label="Account">' + popBody() + "</div>";
    });
    if (refocus) {
      // Prefer the panel's first control when it is open (that is where the user
      // was heading), otherwise the chip they clicked.
      var back = (open && hosts[0] && hosts[0].querySelector(".bq-pop button, .bq-pop input"))
              || (hosts[0] && hosts[0].querySelector("button"));
      if (back) try { back.focus(); } catch (e) {}
    }
    if (open && !user() && cid() && !FILE) {
      load(function () {
        var host = document.getElementById("bq-gbtn");
        if (!host) return;
        try {
          google.accounts.id.renderButton(host, {
            theme: (document.documentElement.getAttribute("data-theme") === "light") ? "outline" : "filled_black",
            size: "large", shape: "pill", text: "continue_with", logo_alignment: "left", width: 260,
          });
        } catch (e) { note("Google could not start. The client ID may not be authorised for this address."); }
      });
    }
  }

  document.addEventListener("click", function (e) {
    var act = e.target.closest && e.target.closest("[data-act]");
    if (act) {
      var a = act.getAttribute("data-act");
      if (a === "out") { signOut(); close(); }
      if (a === "setcid") {
        var v = (document.getElementById("bq-cid") || {}).value || "";
        v = v.trim();
        if (!v) { note("Paste the client ID first."); return; }
        if (!/\.apps\.googleusercontent\.com$/.test(v)) { note("That does not look like a client ID — they end in .apps.googleusercontent.com"); return; }
        ls(K_CID, v); ready = false; loading = false; noteMsg = ""; render();
      }
      e.preventDefault();
      return;
    }
    var btn = e.target.closest && e.target.closest(".bq-acct>button");
    if (btn) { open = !open; noteMsg = ""; render(); e.preventDefault(); return; }
    if (open && !(e.target.closest && e.target.closest(".bq-pop"))) close();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && open) close(); });

  function mount(el) {
    if (!el || hosts.indexOf(el) >= 0) return;
    el.classList.add("bq-acct");
    hosts.push(el);
    render();
  }
  function scan() {
    var found = document.querySelectorAll("[data-bioq-account]");
    for (var i = 0; i < found.length; i++) mount(found[i]);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", scan);
  else scan();
  // Sign in on one page, and every other tab of the product should agree.
  addEventListener("storage", function (e) { if (e.key === K_USER) emit(); });

  window.BIOQ_AUTH = {
    user: user, signOut: signOut, mount: mount,
    onChange: function (f) { subs.push(f); },
    configured: function () { return !!cid(); },
  };
})();
