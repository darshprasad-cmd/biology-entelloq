<title id="cell-svg-title">A generalized animal cell, opened for observation</title><desc id="cell-svg-desc">Illustrative cutaway showing a cell membrane around cytoplasm, a nucleus with nucleolus, folded endoplasmic reticulum, Golgi apparatus and mitochondria. Shapes and relative sizes are simplified; this is not microscopy.</desc>
