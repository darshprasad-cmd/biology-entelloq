<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Biology Entelloq — The definitive way to learn life</title>
<meta name="description" content="Biology Entelloq is a living, cinematic platform for learning biology — interactive labs, an AI tutor, a knowledge graph of all of life, and a real virtual dissection theatre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   BIOLOGY ENTELLOQ — platform site
   One self-contained document. Design system → launch → shell → pages.
   Motion follows Emil Kowalski's rules: transform/opacity only, custom easings,
   scale(0.95)+opacity entrances, ease-out for enters, stagger, reduced-motion.
   ========================================================================== */

/* ---- reset ---------------------------------------------------------------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-height:100%;overflow-x:hidden}
img,svg,canvas{display:block;max-width:100%}
button,input{font:inherit;color:inherit;background:none;border:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--em);outline-offset:3px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--em) 45%,transparent);color:var(--ink)}
.skiplink{position:fixed;top:10px;left:10px;z-index:200;background:var(--panel);color:var(--ink);
  border:1px solid var(--hair);border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;
  transform:translateY(-180%);transition:transform .2s var(--ease-out)}
.skiplink:focus-visible{transform:none;outline-offset:2px}

/* ---- design tokens -------------------------------------------------------- */
:root{
  /* palette — biology: emerald→cyan life, indigo for intelligence, amber spark */
  --em:#34d399; --em-2:#10b981; --cy:#38e0d8; --cy-2:#22d3ee;
  --indigo:#7c8cf8; --indigo-2:#8b5cf6; --amber:#f6c667; --rose:#fb7185;
  --grad-life:linear-gradient(120deg,var(--em),var(--cy));
  --grad-mind:linear-gradient(120deg,var(--cy),var(--indigo));
  --grad-spark:linear-gradient(120deg,var(--indigo-2),var(--em));

  /* dark (default) */
  --bg:#04070a; --bg-2:#070b10; --panel:#0b1117; --raise:#0e151c;
  --ink:#eaf2f5; --dim:#9fb2bc; --faint:#7d8b93;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.05);
  --glass:rgba(10,15,20,.62); --glass-strong:rgba(8,12,17,.82);
  --hair:rgba(255,255,255,.10);
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 12px 40px -12px rgba(0,0,0,.7);
  --shadow-glow:0 0 0 1px rgba(52,211,153,.18),0 20px 60px -18px rgba(16,185,129,.35);
  --spot:rgba(52,211,153,.16);

  /* type */
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;

  /* motion — Emil's strong curves */
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-in-out:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --ease-spring:cubic-bezier(.34,1.56,.64,1);

  /* geometry */
  --r-sm:10px; --r:16px; --r-lg:24px; --r-xl:34px;
  --edge:clamp(20px,5vw,72px);
  --maxw:1200px;
}
:root[data-theme="light"]{
  --bg:#f6f8f9; --bg-2:#eef2f4; --panel:#ffffff; --raise:#ffffff;
  --ink:#0c1418; --dim:#4a5a63; --faint:#5c6b74;
  --line:rgba(6,20,26,.10); --line-2:rgba(6,20,26,.06);
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.86);
  --hair:rgba(6,20,26,.12);
  --em:#0a7d57; --em-2:#0a7d57; --cy:#0891b2; --indigo:#5b63e6;
  --shadow-2:0 14px 44px -16px rgba(20,40,50,.28);
  --shadow-glow:0 0 0 1px rgba(14,163,113,.18),0 22px 60px -20px rgba(14,163,113,.28);
  --spot:rgba(14,163,113,.12);
  /* Accents the light theme previously inherited from dark, where they measured
     1.49:1 (amber), 2.53:1 (rose) and 3.97:1 (violet) against this background.
     Same hues, taken dark enough to read: 5.0, 5.7 and 6.7:1. */
  --violet:#6d28d9; --amber:#8a6410; --rose:#be1e46;
}

html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-feature-settings:"cv11","ss01";line-height:1.55;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ---- shared type scale ---------------------------------------------------- */
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.22em;
  text-transform:uppercase;color:var(--em);display:inline-flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:16px;height:1px;background:currentColor;opacity:.6}
.display{font-weight:800;letter-spacing:-.03em;line-height:1.02;
  font-size:clamp(2.6rem,7.5vw,5.6rem)}
.h1{font-weight:800;letter-spacing:-.028em;line-height:1.05;font-size:clamp(2.1rem,5vw,3.6rem)}
.h2{font-weight:700;letter-spacing:-.024em;line-height:1.1;font-size:clamp(1.7rem,3.6vw,2.6rem)}
.h3{font-weight:600;letter-spacing:-.02em;line-height:1.2;font-size:clamp(1.15rem,2vw,1.4rem)}
.lead{font-size:clamp(1.05rem,1.7vw,1.35rem);color:var(--dim);line-height:1.6;font-weight:400}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:0}
.grad{background:var(--grad-life);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-mind{background:var(--grad-mind);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--dim)} .faint{color:var(--faint)}

/* ---- layout --------------------------------------------------------------- */
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--edge);width:100%}
section.band{padding-block:clamp(72px,11vw,150px);position:relative}
.center{text-align:center}
.stack-sm{display:flex;flex-direction:column;gap:14px}
.grid{display:grid;gap:22px}

/* ---- global ambient background canvas ------------------------------------- */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;
  transition:opacity 1.2s var(--ease-out)}
#fx.on{opacity:1}
.bg-veil{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 45% at 78% -5%,color-mix(in srgb,var(--cy) 12%,transparent),transparent 60%),
    radial-gradient(55% 45% at 8% 8%,color-mix(in srgb,var(--em) 12%,transparent),transparent 55%),
    radial-gradient(50% 50% at 50% 108%,color-mix(in srgb,var(--indigo) 10%,transparent),transparent 60%);}

/* ============================================================================
   LAUNCH SEQUENCE
   ========================================================================== */
#launch{position:fixed;inset:0;z-index:100;background:#020406;display:grid;
  place-items:center;overflow:hidden;transition:opacity .9s var(--ease-out),
  filter .9s var(--ease-out),visibility .9s}
#launch.done{opacity:0;visibility:hidden;filter:blur(14px);pointer-events:none}
#launchCanvas{position:absolute;inset:0;width:100%;height:100%}
.launch-core{position:relative;z-index:2;display:grid;place-items:center;gap:26px;
  text-align:center;padding:24px}
.launch-mark{width:96px;height:96px;position:relative;opacity:0;transform:scale(.82);
  animation:markIn 1s var(--ease-out) .35s forwards}
.launch-mark svg{width:100%;height:100%;filter:drop-shadow(0 0 24px rgba(52,211,153,.55))}
@keyframes markIn{to{opacity:1;transform:scale(1)}}
.launch-word{display:flex;gap:.04em;font-weight:800;letter-spacing:-.03em;
  font-size:clamp(2rem,6vw,3.4rem);line-height:1}
.launch-word span{opacity:0;transform:translateY(18px) scale(.9);filter:blur(6px);
  display:inline-block;animation:letterIn .7s var(--ease-out) forwards}
@keyframes letterIn{to{opacity:1;transform:none;filter:blur(0)}}
.launch-sub{font-family:var(--mono);font-size:12.5px;letter-spacing:.34em;
  text-transform:uppercase;color:var(--cy);opacity:0;animation:fadeUp .8s var(--ease-out) 1.5s forwards}
.launch-bar{width:min(240px,60vw);height:2px;border-radius:2px;overflow:hidden;
  background:rgba(255,255,255,.08);opacity:0;animation:fadeUp .8s var(--ease-out) 1.7s forwards}
.launch-bar i{display:block;height:100%;width:0;background:var(--grad-life);
  box-shadow:0 0 12px var(--em)}
.launch-skip{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--faint);opacity:0;animation:fadeUp .8s var(--ease-out) 2.4s forwards;
  padding:8px 14px;border-radius:999px;border:1px solid var(--line);cursor:pointer;
  transition:color .2s,border-color .2s,transform .12s var(--ease-out)}
.launch-skip:hover{color:var(--ink);border-color:var(--hair)}
.launch-skip:active{transform:translateX(-50%) scale(.96)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============================================================================
   NAV
   ========================================================================== */
header.nav{position:fixed;top:0;left:0;right:0;z-index:60;
  transition:background .3s var(--ease-out),border-color .3s,backdrop-filter .3s}
.nav-in{max-width:var(--maxw);margin-inline:auto;padding:14px var(--edge);
  display:flex;align-items:center;gap:20px}
header.nav.scrolled{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:-.02em;
  font-size:16px;cursor:pointer;transition:opacity .2s}
.brand:hover{opacity:.85}
.brand .logo{width:30px;height:30px}
.brand b{font-weight:800}
.brand .tag{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:2px 6px;margin-left:2px}
.nav-links{display:flex;align-items:center;gap:4px;margin-left:8px}
.nav-links a{padding:8px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--dim);
  transition:color .2s,background .2s;position:relative}
.nav-links a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nav-links a.active{color:var(--ink)}
.nav-links a.active::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;
  border-radius:2px;background:var(--grad-life)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--dim);cursor:pointer;background:var(--panel);
  transition:color .2s,border-color .2s,transform .12s var(--ease-out),background .2s}
.iconbtn:hover{color:var(--ink);border-color:var(--hair)}
.iconbtn:active{transform:scale(.94)}
.iconbtn svg{width:17px;height:17px}
.search-pill{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:11px;
  border:1px solid var(--line);color:var(--faint);cursor:pointer;background:var(--panel);
  font-size:13px;transition:border-color .2s,color .2s;min-width:0}
.search-pill:hover{border-color:var(--hair);color:var(--dim)}
.search-pill kbd{margin-left:auto;font-family:var(--mono);font-size:10px;padding:2px 6px;
  border-radius:5px;background:color-mix(in srgb,var(--ink) 8%,transparent);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;gap:9px;padding:11px 20px;border-radius:12px;
  font-weight:600;font-size:14.5px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .14s var(--ease-out),box-shadow .3s var(--ease-out),background .3s}
.btn:active{transform:scale(.97)}
.btn.primary{color:#03110c;background:var(--grad-life);box-shadow:var(--shadow-glow)}
.btn.primary:hover{box-shadow:0 0 0 1px rgba(52,211,153,.3),0 26px 70px -18px rgba(16,185,129,.55)}
.btn.ghost{color:var(--ink);border:1px solid var(--hair);background:color-mix(in srgb,var(--ink) 4%,transparent)}
.btn.ghost:hover{border-color:color-mix(in srgb,var(--em) 40%,var(--hair))}
.btn .arr{transition:transform .2s var(--ease-out)}
.btn:hover .arr{transform:translateX(3px)}
.navtoggle{display:none}

/* ============================================================================
   PAGE ROUTING + reveal
   ========================================================================== */
.page{display:none}
.page.active{display:block;animation:pageIn .5s var(--ease-out)}
/* opacity + transform only — animating filter:blur re-rasterizes every frame */
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
main{position:relative;z-index:1;padding-top:70px}
.reveal{opacity:0;transform:translateY(20px);
  transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.06s}.reveal.d2{transition-delay:.12s}
.reveal.d3{transition-delay:.18s}.reveal.d4{transition-delay:.24s}.reveal.d5{transition-delay:.3s}

/* ============================================================================
   HERO
   ========================================================================== */
.hero{position:relative;min-height:calc(100svh - 70px);display:grid;align-items:center;
  padding-block:clamp(40px,8vw,90px);overflow:hidden}
.hero-glow{position:absolute;inset:0;pointer-events:none;z-index:0}
.hero-content{position:relative;z-index:2;max-width:900px}
.hero .badge{display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 8px;border-radius:999px;
  border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(10px);font-size:13px;
  color:var(--dim);margin-bottom:26px}
.hero .badge .dot{width:8px;height:8px;border-radius:50%;background:var(--em);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--em) 22%,transparent);animation:pulse 2.6s var(--ease-in-out) infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--em) 30%,transparent)}
  50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--em) 0%,transparent)}}
.hero h1{margin:0 0 22px;font-size:clamp(2.7rem,7.4vw,5.4rem);font-weight:800;letter-spacing:-.035em;line-height:1.0}
.hero h1 .line{display:block;overflow:hidden}
.hero h1 .line span{display:block}
.hero p.lead{max-width:620px;margin-bottom:34px}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.hero-meta{display:flex;flex-wrap:wrap;gap:26px;margin-top:46px;padding-top:26px;border-top:1px solid var(--line-2)}
.hero-meta .stat b{font-size:clamp(1.5rem,3vw,2rem);font-weight:800;letter-spacing:-.02em;display:block}
.hero-meta .stat span{font-size:12.5px;color:var(--faint);font-family:var(--mono);letter-spacing:.04em}
.hero-orb{position:absolute;right:-8%;top:50%;transform:translateY(-50%);width:min(52vw,640px);
  aspect-ratio:1;z-index:1;pointer-events:none;opacity:.9}

/* ============================================================================
   CARDS / SECTIONS
   ========================================================================== */
.sec-head{max-width:720px;margin-bottom:clamp(34px,5vw,62px)}
.sec-head.center{margin-inline:auto}
.sec-head .eyebrow{margin-bottom:18px}
.sec-head h2{margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:clamp(22px,3vw,32px);position:relative;overflow:hidden;
  transition:transform .4s var(--ease-out),border-color .4s,box-shadow .4s var(--ease-out)}
.card .glow{position:absolute;inset:-1px;border-radius:inherit;opacity:0;pointer-events:none;
  background:radial-gradient(50% 60% at var(--mx,50%) 0%,var(--spot),transparent 70%);
  transition:opacity .4s}
@media (hover:hover) and (pointer:fine){
  .card.lift:hover{transform:translateY(-6px);border-color:var(--hair);box-shadow:var(--shadow-2)}
  .card.lift:hover .glow{opacity:1}
}
.card .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:20px;
  background:color-mix(in srgb,var(--em) 12%,transparent);color:var(--em);
  border:1px solid color-mix(in srgb,var(--em) 22%,transparent)}
.card .ico svg{width:22px;height:22px}
.card h3{margin-bottom:9px}
.card p{color:var(--dim);font-size:15px;line-height:1.6}
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px;
  border:1px solid var(--line);color:var(--dim)}
.chip.live{color:var(--em);border-color:color-mix(in srgb,var(--em) 30%,transparent);
  background:color-mix(in srgb,var(--em) 10%,transparent)}
.chip.soon{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 26%,transparent)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}

/* grids */
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}

/* mission split */
.split{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(30px,5vw,72px);align-items:center}
.pullquote{font-family:var(--serif);font-size:clamp(1.8rem,3.4vw,2.9rem);line-height:1.24;
  letter-spacing:-.01em;font-weight:400}
.pullquote em{font-style:italic;background:var(--grad-mind);-webkit-background-clip:text;
  background-clip:text;color:transparent}

/* how it works steps */
.steps{counter-reset:step;display:grid;gap:2px;border:1px solid var(--line);border-radius:var(--r-lg);
  overflow:hidden;background:var(--panel)}
.step{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:clamp(20px,3vw,30px);
  align-items:start;position:relative;transition:background .3s}
.step+.step{border-top:1px solid var(--line)}
.step:hover{background:color-mix(in srgb,var(--ink) 3%,transparent)}
.step .n{counter-increment:step;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;
  font-family:var(--mono);font-weight:600;font-size:15px;color:var(--em);
  background:color-mix(in srgb,var(--em) 10%,transparent);border:1px solid color-mix(in srgb,var(--em) 20%,transparent)}
.step .n::before{content:"0" counter(step)}
.step h3{margin-bottom:6px}.step p{color:var(--dim);font-size:15px}

/* subject cards with progress ring (tasteful) */
.subject{cursor:default}
.ring{--p:0;width:52px;height:52px;flex:none}
.ring circle{fill:none;stroke-width:5}
.ring .track{stroke:var(--line)}
.ring .fill{stroke:var(--em);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;
  stroke-dasharray:132;stroke-dashoffset:132;transition:stroke-dashoffset 1.1s var(--ease-out)}

/* AI panel */
.ai-shell{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,54px);align-items:center}
.ai-window{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  box-shadow:var(--shadow-2)}
.ai-top{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--ink) 3%,transparent)}
.ai-top .dots{display:flex;gap:6px}.ai-top .dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.ai-top .t{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em}
.ai-body{padding:20px;min-height:230px;display:flex;flex-direction:column;gap:14px}
.ai-msg{display:flex;gap:12px;align-items:flex-start}
.ai-msg .av{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;font-size:13px}
.ai-msg.u .av{background:color-mix(in srgb,var(--ink) 10%,transparent);color:var(--dim)}
.ai-msg.a .av{background:var(--grad-mind);color:#04121a}
.ai-bub{font-size:14.5px;line-height:1.6;color:var(--ink)}
.ai-bub.think{color:var(--faint);font-family:var(--mono);font-size:12px;letter-spacing:.04em}
.ai-prompts{display:flex;flex-direction:column;gap:10px}
.ai-prompt{text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;font-size:14px;color:var(--dim);
  transition:border-color .2s,color .2s,transform .12s var(--ease-out),background .2s;display:flex;gap:12px;align-items:center}
.ai-prompt:hover{border-color:var(--hair);color:var(--ink);background:color-mix(in srgb,var(--ink) 3%,transparent)}
.ai-prompt:active{transform:scale(.985)}
.ai-prompt .pi{color:var(--indigo)}
.caret{display:inline-block;width:2px;height:1.05em;background:var(--em);margin-left:2px;
  vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* interactive cell */
.cell-lab{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,4vw,48px);align-items:center}
.cell-stage{aspect-ratio:1;position:relative;background:
  radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--em) 8%,transparent),transparent 70%);
  border-radius:var(--r-xl);border:1px solid var(--line);overflow:hidden}
.cell-stage svg{width:100%;height:100%}
.organelle{cursor:pointer;transition:opacity .25s}
.organelle:hover{opacity:.85}
.organelle.dim{opacity:.32}
.cell-info h3{margin-bottom:8px;transition:opacity .26s var(--ease-out)}
.cell-info p{color:var(--dim);font-size:15px;line-height:1.65;min-height:80px;transition:opacity .26s var(--ease-out)}
.cell-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.cell-tab{padding:8px 14px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:500;
  color:var(--dim);cursor:pointer;transition:border-color .2s,color .2s,background .2s,transform .12s var(--ease-out)}
.cell-tab:hover{color:var(--ink);border-color:var(--hair)}
.cell-tab:active{transform:scale(.96)}
.cell-tab.on{color:var(--em);border-color:color-mix(in srgb,var(--em) 35%,transparent);
  background:color-mix(in srgb,var(--em) 10%,transparent)}

/* knowledge graph */
.kg-stage{position:relative;aspect-ratio:16/10;border-radius:var(--r-xl);overflow:hidden;
  border:1px solid var(--line);background:radial-gradient(circle at 50% 50%,var(--bg-2),var(--bg))}
.kg-stage canvas{width:100%;height:100%}
.kg-tip{position:absolute;pointer-events:none;padding:10px 13px;border-radius:12px;background:var(--glass-strong);
  backdrop-filter:blur(12px);border:1px solid var(--hair);font-size:13px;max-width:230px;opacity:0;
  transform:translateY(6px);transition:opacity .2s,transform .2s;z-index:3;box-shadow:var(--shadow-2)}
.kg-tip.show{opacity:1;transform:none}
.kg-tip b{color:var(--em);display:block;margin-bottom:3px;font-size:13.5px}
.kg-tip span{color:var(--dim);font-size:12.5px;line-height:1.5}

/* labs */
.lab-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(24px,4vw,44px);align-items:stretch}
.lab-feature{position:relative;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--hair);
  background:linear-gradient(160deg,var(--raise),var(--bg-2));padding:clamp(26px,4vw,40px);
  display:flex;flex-direction:column;justify-content:flex-end;min-height:360px}
.lab-feature .scene{position:absolute;inset:0;z-index:0;opacity:.9}
.lab-feature .body{position:relative;z-index:2}
.lab-feature .body h3{font-size:clamp(1.5rem,2.6vw,2rem);margin-bottom:10px}
.lab-list{display:grid;gap:12px}
.lab-item{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;border:1px solid var(--line);
  background:var(--panel);transition:border-color .3s,transform .3s var(--ease-out)}
@media (hover:hover){.lab-item:hover{border-color:var(--hair);transform:translateX(4px)}}
.lab-item .li{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--cy) 12%,transparent);color:var(--cy)}
.lab-item b{font-size:14.5px;font-weight:600;display:block}
.lab-item span{font-size:12.5px;color:var(--faint)}

/* roadmap */
.timeline{position:relative;display:grid;gap:6px}
.timeline::before{content:"";position:absolute;left:18px;top:8px;bottom:8px;width:2px;
  background:linear-gradient(var(--em),var(--cy),var(--line));border-radius:2px}
.tl-item{display:grid;grid-template-columns:auto 1fr;gap:22px;padding:16px 0;align-items:start}
.tl-item .node{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;z-index:1;
  background:var(--panel);border:1px solid var(--hair);color:var(--em);font-family:var(--mono);font-size:12px}
.tl-item.done .node{background:var(--grad-life);color:#04120c;border-color:transparent}
.tl-item h3{font-size:1.05rem;margin-bottom:4px}.tl-item .when{font-family:var(--mono);font-size:11px;
  color:var(--faint);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.tl-item p{color:var(--dim);font-size:14.5px}

/* future vision */
.vision{position:relative;border-radius:var(--r-xl);overflow:hidden;border:1px solid var(--hair);
  padding:clamp(40px,7vw,90px);text-align:center;background:
  radial-gradient(60% 100% at 50% 0%,color-mix(in srgb,var(--indigo) 16%,transparent),transparent 65%),
  linear-gradient(180deg,var(--raise),var(--bg-2))}

/* ecosystem cards */
.eco{grid-template-columns:repeat(3,1fr)}
.eco-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:24px;position:relative;overflow:hidden;transition:transform .4s var(--ease-out),border-color .4s,box-shadow .4s}
.eco-card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.eco-card .mk{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.eco-card h3{margin-bottom:8px}.eco-card p{color:var(--dim);font-size:14px;line-height:1.6}
/* only the cards that actually go somewhere are anchors — a card with nowhere to
   go must not lift and shadow, or it reads as clickable and then does nothing */
@media(hover:hover){a.eco-card:hover{transform:translateY(-5px);border-color:var(--hair);box-shadow:var(--shadow-2)}}
.eco-card.wide{grid-column:span 3;display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center}

/* footer */
footer{position:relative;z-index:1;border-top:1px solid var(--line);margin-top:40px;
  background:var(--bg-2)}
.foot-in{max-width:var(--maxw);margin-inline:auto;padding:clamp(48px,7vw,84px) var(--edge) 40px;
  display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:40px}
.foot-brand p{color:var(--dim);font-size:14px;max-width:280px;margin-top:14px}
.foot-col h4{font-size:12px;font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);margin-bottom:14px}
.foot-col a{display:block;color:var(--dim);font-size:14px;padding:5px 0;transition:color .2s}
.foot-col a:hover{color:var(--ink)}
.foot-bottom{max-width:var(--maxw);margin-inline:auto;padding:22px var(--edge);border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;color:var(--faint);font-size:12.5px}

/* ============================================================================
   FOUNDER
   ========================================================================== */
.founder-hero{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(30px,5vw,64px);align-items:center}
.avatar{aspect-ratio:4/5;border-radius:var(--r-xl);overflow:hidden;position:relative;
  border:1px solid var(--hair);background:linear-gradient(160deg,color-mix(in srgb,var(--em) 20%,var(--panel)),
  color-mix(in srgb,var(--indigo) 22%,var(--bg-2)))}
.avatar .mono{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;
  font-size:clamp(4rem,12vw,8rem);letter-spacing:-.04em;color:rgba(255,255,255,.9);
  text-shadow:0 8px 40px rgba(0,0,0,.4)}
.avatar .tagph{position:absolute;left:16px;bottom:16px;font-family:var(--mono);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);
  border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:4px 8px}
.founder-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:22px}
.founder-facts .f{background:var(--panel);padding:16px 18px}
.founder-facts .f span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:block;margin-bottom:5px}
.founder-facts .f b{font-size:14.5px;font-weight:600}
.prose{max-width:720px}
.prose p{color:var(--dim);font-size:16px;line-height:1.75;margin-bottom:18px}
.prose p strong{color:var(--ink);font-weight:600}
.values{grid-template-columns:repeat(2,1fr)}
.value{padding:22px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.value h4{margin-bottom:7px;font-size:1.05rem}.value p{color:var(--dim);font-size:14.5px}

/* about */
.about-hero{text-align:center;max-width:820px;margin-inline:auto}
.marquee-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:30px}

/* ============================================================================
   COMMAND PALETTE (⌘K)
   ========================================================================== */
#cmdk{position:fixed;inset:0;z-index:90;display:none;align-items:flex-start;justify-content:center;
  padding-top:12vh;background:rgba(2,4,6,.5);backdrop-filter:blur(6px)}
#cmdk.open{display:flex;animation:fadeIn .18s var(--ease-out)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.cmdk-box{width:min(620px,92vw);background:var(--glass-strong);border:1px solid var(--hair);
  border-radius:var(--r-lg);overflow:hidden;box-shadow:0 40px 120px -30px rgba(0,0,0,.7);
  transform-origin:top center;animation:cmdkIn .22s var(--ease-out)}
@keyframes cmdkIn{from{opacity:0;transform:scale(.96) translateY(-8px)}to{opacity:1;transform:none}}
.cmdk-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.cmdk-in svg{width:18px;height:18px;color:var(--faint);flex:none}
.cmdk-in input{width:100%;font-size:16px;letter-spacing:-.01em}
.cmdk-in input::placeholder{color:var(--faint)}
.cmdk-in .esc{font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line);
  border-radius:5px;padding:3px 6px}
.cmdk-list{max-height:52vh;overflow:auto;padding:8px}
.cmdk-group{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--faint);padding:12px 12px 6px}
.cmdk-item{display:flex;align-items:center;gap:13px;padding:11px 12px;border-radius:11px;cursor:pointer;
  transition:background .12s}
.cmdk-item .ci{width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:color-mix(in srgb,var(--ink) 6%,transparent);color:var(--em)}
.cmdk-item .cm b{font-size:14px;font-weight:500;display:block}
.cmdk-item .cm span{font-size:12px;color:var(--faint)}
.cmdk-item .kind{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);
  border:1px solid var(--line);border-radius:5px;padding:2px 7px}
.cmdk-item.sel,.cmdk-item:hover{background:color-mix(in srgb,var(--em) 12%,transparent)}
.cmdk-empty{padding:30px;text-align:center;color:var(--faint);font-size:14px}

/* ============================================================================
   RESPONSIVE
   ========================================================================== */
/* The hero helix must never sit behind the headline — push it into the right
   margin and fade it as the viewport narrows, well before the mobile break. */
@media (max-width:1280px){ .hero-orb{opacity:.55;right:-16%} }
/* Collapse the inline nav to the hamburger BEFORE the right cluster can overflow
   and clip the menu button (the whole row is nowrap). The menu is openable across
   this entire range, not only on phones. */
@media (max-width:1024px){
  .nav-links{display:none}
  .navtoggle{display:grid}
  .mobile-menu.open{display:block}
  .hero-orb{opacity:.4;right:-26%}
}
@media (max-width:940px){
  .split,.ai-shell,.cell-lab,.lab-hero,.founder-hero{grid-template-columns:1fr}
  .g3,.g4,.eco{grid-template-columns:1fr 1fr}
  .foot-in{grid-template-columns:1fr 1fr}
  .eco-card.wide{grid-column:span 2;grid-template-columns:1fr}
}
/* On phones there is no room for the header search or CTA — both live in the
   menu — so drop them and let the hamburger + logo breathe. */
@media (max-width:560px){
  .search-pill{display:none}
  .nav-right .btn.primary{display:none}
}
@media (max-width:680px){
  .search-pill span{display:none}
  .g3,.g4,.g2,.eco,.values,.founder-facts{grid-template-columns:1fr}
  .foot-in{grid-template-columns:1fr}
  .hero-meta{gap:20px}
  .eco-card.wide{grid-column:span 1}
}
.mobile-menu{display:none;position:fixed;inset:70px 0 0;z-index:55;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:max(24px,env(safe-area-inset-bottom));background:var(--glass-strong);
  backdrop-filter:blur(20px);padding:24px var(--edge);animation:pageIn .3s var(--ease-out)}
.mobile-menu a{display:block;padding:16px 0;font-size:20px;font-weight:600;border-bottom:1px solid var(--line)}

/* reduced motion */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.12s!important}
  .reveal{opacity:1!important;transform:none!important;filter:none!important}
  #fx{display:none}
}

/* The primary CTA hard-codes near-black text over --grad-life, which works on the
   dark theme. Light theme darkens --em to #0a7d57, dropping that label to ~3.75:1
   over the green half of the gradient. Light mode therefore gets white text on a
   deliberately darker gradient instead. */
:root[data-theme="light"] .btn.primary{color:#fff;background:linear-gradient(120deg,var(--em),#0a6f8c)}

/* ============================================================================
   ROUTER
   ========================================================================== */
const app=$("#app");
app.innerHTML=homeHTML()+aboutHTML()+founderHTML();
const PAGES={home:$("#page-home"),about:$("#page-about"),founder:$("#page-founder")};
let current="home";
function go(page,{scroll=true,push=false}={}){
  if(!PAGES[page])page="home";
  Object.values(PAGES).forEach(p=>p.classList.remove("active"));
  PAGES[page].classList.add("active");
  current=page;
  $$(".nav-links a[data-nav]").forEach(a=>a.classList.toggle("active",a.dataset.nav===page));
  // pushState for user-initiated nav (so Back steps through pages); replaceState
  // when merely syncing the URL to the current view (init / popstate).
  const url=page==="home"?"#/home":"#/"+page;
  if(push&&history.pushState)history.pushState({page},"",url);
  else if(history.replaceState)history.replaceState({page},"",url);
  if(scroll)window.scrollTo({top:0,behavior:REDUCED?"auto":"smooth"});
  closeMenu();
  requestAnimationFrame(()=>{observeReveals();initRings();});
  if(page==="home"){startKG();startHeroOrb();startLabScene();} else {stopKG();}
}
function scrollTo(id){
  if(current!=="home"){go("home",{scroll:false});}
  requestAnimationFrame(()=>{const el=document.getElementById(id);
    if(el)el.scrollIntoView({behavior:REDUCED?"auto":"smooth",block:"start"});});
}
document.addEventListener("click",e=>{
  const nav=e.target.closest("[data-nav]"); const scr=e.target.closest("[data-scroll]");
  if(nav){e.preventDefault();go(nav.dataset.nav,{push:true});}
  else if(scr){e.preventDefault();scrollTo(scr.dataset.scroll);}
});
// Enter/Space on a focused router control that isn't a native <a> (the brand
// logo is a role="button" div). Anchors activate on Enter by themselves.
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"&&e.key!==" ")return;
  const t=e.target.closest("[data-nav],[data-scroll]");
  if(!t||t.tagName==="A")return;
  e.preventDefault();
  if(t.dataset.nav)go(t.dataset.nav,{push:true}); else scrollTo(t.dataset.scroll);
});
function routeFromHash(){const h=location.hash.replace(/^#\/?/,"").split(/[#?]/)[0];go(PAGES[h]?h:"home",{scroll:false});}
window.addEventListener("hashchange",routeFromHash);
// Back / Forward: popstate fires reliably on history navigation; re-sync the view.
window.addEventListener("popstate",()=>routeFromHash());

/* ============================================================================
   REVEAL ON SCROLL + progress rings
   ========================================================================== */
let revealObs;
function observeReveals(){
  if(REDUCED){$$(".reveal").forEach(el=>el.classList.add("in"));return;}
  if(!revealObs)revealObs=new IntersectionObserver((es)=>{
    es.forEach(en=>{if(en.isIntersecting){en.target.classList.add("in");revealObs.unobserve(en.target);}});
  },{threshold:.12,rootMargin:"0px 0px -8% 0px"});
  $$(".reveal:not(.in)").forEach(el=>revealObs.observe(el));
}
let ringObs;
function initRings(){
  const rings=$$(".ring .fill");
  if(!ringObs)ringObs=new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting){const svg=en.target.closest(".ring");const p=+svg.dataset.p||0;
      const c=2*Math.PI*21; en.target.style.strokeDasharray=c;
      en.target.style.strokeDashoffset=REDUCED?c*(1-p/100):c;
      if(!REDUCED)requestAnimationFrame(()=>{en.target.style.strokeDashoffset=c*(1-p/100);});
      ringObs.unobserve(en.target);}
  }),{threshold:.5});
  $$(".ring").forEach(svg=>{const f=svg.querySelector(".fill");if(f&&!f.dataset.done){f.dataset.done="1";ringObs.observe(f);}});
}

   COMMAND PALETTE
   ========================================================================== */
const cmdk=$("#cmdk"),cmdkInput=$("#cmdkInput"),cmdkList=$("#cmdkList");
let cmdkSel=0,cmdkFlat=[],cmdkTrigger=null;
function openCmdk(){
  cmdkTrigger=document.activeElement;           // remember what to return focus to
  cmdk.classList.add("open");
  document.documentElement.style.overflow="hidden";  // lock background scroll
  cmdkInput.setAttribute("aria-expanded","true");
  cmdkInput.value="";renderCmdk("");
  setTimeout(()=>cmdkInput.focus(),40);
}
function closeCmdk(){
  if(!cmdk.classList.contains("open"))return;
  cmdk.classList.remove("open");
  document.documentElement.style.overflow="";
  cmdkInput.setAttribute("aria-expanded","false");
  cmdkInput.removeAttribute("aria-activedescendant");

/* ============================================================================
   KNOWLEDGE GRAPH (canvas)
   ========================================================================== */
let kgRaf=null,kgReady=false;
function startKG(){
  // Idempotent: the graph's own IntersectionObserver handles pause/resume when it
  // scrolls in and out of view, so re-running this on every home navigation would
  // just stack duplicate rAF loops, resize listeners and observers. Init once.
  if(kgReady)return;
  const cv=$("#kgCanvas");if(!cv)return;const tip=$("#kgTip");
  const ctx=cv.getContext("2d");let W,H,dpr,t=0,hover=-1,mx=-1,my=-1,lastHover=-2;
  function size(){dpr=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();
    W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  size();
  // Degree decides size: Proteins and DNA really are the hubs of this web, so the
  // picture should say so before you read a single label.
  const deg={};KGE.forEach(([x,y])=>{deg[x]=(deg[x]||0)+1;deg[y]=(deg[y]||0)+1;});
  const dMax=Math.max(...Object.values(deg));
  const nodes=KG.map((n,i)=>({...n,ph:i*1.37,deg:deg[n.id]||1,
    r:8+5*Math.sqrt((deg[n.id]||1)/dMax)}));
  const byId={};nodes.forEach((n,i)=>{byId[n.id]=i;});
  // Precompute each edge's neighbour sets once — used to dim everything that is
  // not part of the thread you are tracing.
  const adj=nodes.map(()=>new Set());
  KGE.forEach(([x,y])=>{adj[byId[x]].add(byId[y]);adj[byId[y]].add(byId[x]);});
  function pos(n){return{x:n.x*W,y:n.y*H+(REDUCED?0:Math.sin(t/1400+n.ph)*5)};}
  const css=getComputedStyle(document.documentElement);
  function col(v){return css.getPropertyValue(v).trim()||v;}
  function withA(hex,a){const c=hex.replace("#","");
    return "rgba("+parseInt(c.slice(0,2),16)+","+parseInt(c.slice(2,4),16)+","+parseInt(c.slice(4,6),16)+","+a+")";}

  // Pointer, touch AND keyboard. The graph used to be hover-only, which meant its
  // definitions simply did not exist for anyone on a phone or a keyboard.
  let focusIdx=-1;

  function nearest(x,y){let best=-1,bd=1e9;
    nodes.forEach((n,i)=>{const p=pos(n),d=Math.hypot(x-p.x,y-p.y);if(d<bd&&d<34){bd=d;best=i;}});return best;}
  cv.onmousemove=e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top;};
  cv.onmouseleave=()=>{mx=my=-1;};
  cv.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse")return;               // mouse already tracks by hover
    const r=cv.getBoundingClientRect();
    const i=nearest(e.clientX-r.left,e.clientY-r.top);
    focusIdx=i;cv.focus();
  },{passive:true});
  cv.addEventListener("focus",()=>{if(focusIdx<0)focusIdx=byId.protein;});
  cv.addEventListener("blur",()=>{focusIdx=-1;});
  cv.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"||e.key==="ArrowDown"||(e.key==="Tab"&&!e.shiftKey&&focusIdx<nodes.length-1)){

    }else if(e.key==="ArrowLeft"||e.key==="ArrowUp"||(e.key==="Tab"&&e.shiftKey&&focusIdx>0)){

  function draw(){
    t+=16;ctx.clearRect(0,0,W,H);
    const cInk=col("--ink"),cLine=col("--line"),cPanel=col("--bg");
    hover=focusIdx;
    if(mx>=0){const i=nearest(mx,my);if(i>=0)hover=i;}
    const act=hover>=0;

    // Edges as gentle arcs bowing away from the centre. Straight lines read as a

      const dx=pb.x-pa.x,dy=pb.y-pa.y,len=Math.hypot(dx,dy)||1;

        }
      }
    });

    // Nodes
    nodes.forEach((n,i)=>{
      const p=pos(n);const on=i===hover;const near=act&&adj[hover]&&adj[hover].has(i);
      const dim=act&&!on&&!near;
      const r=n.r*(on?1.35:1);

      const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,halo);
      g.addColorStop(0,withA(n.c,on?0.42:dim?0.05:0.18));
      g.addColorStop(1,withA(n.c,0));
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,halo,0,6.28);ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,r,0,6.28);
      ctx.fillStyle=on?n.c:cPanel;ctx.fill();
      ctx.lineWidth=on?2.6:1.8;ctx.strokeStyle=withA(n.c,dim?0.25:1);ctx.stroke();
      ctx.globalAlpha=dim?0.3:1;
      ctx.fillStyle=cInk;ctx.font=(on?"700 13px ":"600 12px ")+"Inter,sans-serif";
      ctx.textAlign="center";ctx.textBaseline="middle";
      const tw=ctx.measureText(n.t).width, lx=Math.max(tw/2+4,Math.min(W-tw/2-4,p.x));
      ctx.fillText(n.t,lx,p.y+r+14);

        ctx.beginPath();ctx.arc(p.x,p.y,r+7,0,6.28);
        ctx.setLineDash([3,3]);ctx.lineWidth=1.5;ctx.strokeStyle=cInk;ctx.stroke();ctx.setLineDash([]);

    });

    if(hover>=0){const n=nodes[hover];const p=pos(n);

  })},{threshold:.05});
  io.observe(cv);kgReady=true;
}
function stopKG(){cancelAnimationFrame(kgRaf);kgRaf=null;}

function dnaCanvas(id,opts={}){
  const cv=document.getElementById(id);if(!cv)return;const ctx=cv.getContext("2d");
  let W,H,dpr,t=0,raf;const strands=opts.strands||1;
  function size(){dpr=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();
    W=r.width;H=r.height;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  size();

      for(let i=0;i<70;i++){const y=i*step;const ang=(i/70)*turns*6.28+t/700+s*Math.PI;
        const x1=cx+Math.sin(ang)*amp,x2=cx+Math.sin(ang+Math.PI)*amp;

        ctx.beginPath();ctx.arc(x1,y,2+d1*2.2,0,6.28);ctx.fillStyle=`rgba(52,211,153,${.25+d1*.6})`;ctx.fill();

      }
    }
    raf=requestAnimationFrame(draw);
  }
  window.addEventListener("resize",size);
  const io=new IntersectionObserver(es=>es.forEach(en=>{
    if(en.isIntersecting){if(!raf){size();draw();}}else{cancelAnimationFrame(raf);raf=null;}

function launchCanvas(){
  const cv=$("#launchCanvas");const ctx=cv.getContext("2d");
  let W,H,dpr,raf,t0=performance.now(),pts=[];
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
    pts=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-.5)*.4,vy:(Math.random()-.5)*.4,r:Math.random()*1.8+.5}));}
  size();window.addEventListener("resize",size);
  function draw(now){const el=now-t0;ctx.clearRect(0,0,W,H);
    const fade=Math.min(1,el/700);
    // neural particles + links
    for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fillStyle=`rgba(56,224,216,${.5*fade})`;ctx.fill();}
    for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
      if(d<130){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
        ctx.strokeStyle=`rgba(52,211,153,${.10*(1-d/130)*fade})`;ctx.stroke();}}
    // dividing cell (2 blobs easing apart) around center, phase ~1.1-2.2s
    const cx=W/2,cy=H/2;const div=Math.min(1,Math.max(0,(el-1000)/1100));
    if(div>0){const sep=div*46;
      for(const s of [-1,1]){ctx.beginPath();ctx.arc(cx+s*sep,cy,40-div*4,0,6.28);
        ctx.strokeStyle=`rgba(52,211,153,${.3*div})`;ctx.lineWidth=2;ctx.stroke();
        const g=ctx.createRadialGradient(cx+s*sep,cy,0,cx+s*sep,cy,44);
        g.addColorStop(0,`rgba(52,211,153,${.10*div})`);g.addColorStop(1,"rgba(52,211,153,0)");
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx+s*sep,cy,44,0,6.28);ctx.fill();}}

}
function runLaunch(){

  let done=false;
  const t0=performance.now();
  function tick(now){const p=Math.min(1,(now-t0)/DUR);if(bar)bar.style.width=(p*100)+"%";
    if(p<1&&!done)requestAnimationFrame(tick);}
  requestAnimationFrame(tick);
  // Enter OR Escape skips; a stray keypress must NOT consume the skip (so no
  // {once:true}) — the listener is removed explicitly once we're done.
  function onKey(e){if((e.key==="Enter"||e.key==="Escape")&&!done){clearTimeout(timer);finish();}}
  function finish(){if(done)return;done=true;try{localStorage.setItem("bioq_seen","1");}catch(e){}
    removeEventListener("keydown",onKey);
    overlay.classList.add("done");if(stop)setTimeout(stop,900);
    boot();}
  const timer=setTimeout(finish,DUR);
  skip.addEventListener("click",()=>{clearTimeout(timer);finish();});
  overlay.addEventListener("click",e=>{if(e.target===overlay){clearTimeout(timer);finish();}});
  addEventListener("keydown",onKey);
  try{skip.focus({preventScroll:true});}catch(e){}  // keyboard users land on Skip
}

/* ============================================================================
   BOOT
   ========================================================================== */
let booted=false;
function boot(){
  if(booted)return;booted=true;
  startFX();
  routeFromHash();          // sets initial page + starts KG/hero
  observeReveals();initRings();
  wireCell();wireAI();
  nav.classList.toggle("scrolled",scrollY>16);
}
// kick off
if(document.readyState!=="loading")runLaunch();
else addEventListener("DOMContentLoaded",runLaunch);
})();
</script>

<script id="atmo-js">
/* ============================================================================
   BIOLOGY ENTELLOQ — THE LIVING FIELD.

   Physics Entelloq puts a sheet of spacetime behind the product and bends it
   around the cursor. This is the biological answer to that, and it is not the
   same idea in different colours: matter is passive and gets curved, whereas
   tissue is ALIVE and reaches toward what it wants. So the field here is a thick
   section of living tissue seen down a microscope, and the cursor is a nutrient
   source. Cells near it swell, their membranes brighten, and the capillary
   network grows toward it — chemotaxis, the oldest behaviour there is.

   Four things are happening at once in the shader:
     · a Worley cell field (membranes are the F2-F1 ridge — the real thing under
       phase contrast) in two parallax layers, so the section has thickness
     · a domain warp driven by slow fbm, because no real tissue is on a grid
     · ridged fbm capillaries that bias their flow toward the cursor
     · a breath — everything respires at about 7 cycles a minute, which is why
       it reads as alive rather than as a screensaver on a loop

   SELF-INSTALLING. Dropping this one <script> onto a page is the whole install:
   it makes its own canvas, injects its own CSS, picks its colour from
   <body data-page>, and follows the light/dark toggle. It never needs markup.
   ========================================================================== */
(function () {
  "use strict";
  if (window.BIOQ_ATMO) return;                       // idempotent: safe to double-inject

  // Inside the unified app shell each section loads in an iframe with ?embed=1.
  // The shell already has a field; a second one per iframe would mean two WebGL
  // contexts fighting for the GPU and a visible seam where the two tissues meet.
  // So the embedded page renders none of its own and goes transparent instead,
  // letting the shell's single continuous field show through — which is also why
  // navigating between sections never interrupts it.
  try {
    if (new URLSearchParams(location.search).get("embed")) {
      var t = document.createElement("style");
      t.id = "atmo-embed";
      t.textContent = "html,body{background:transparent!important}.bg-veil{display:none!important}";
      (document.head || document.documentElement).appendChild(t);
      window.BIOQ_ATMO = { theme: function () {}, setSection: function () {}, mouse: null, mode: "embedded" };
      return;
    }
  } catch (e) {}

  /* --- where the colour comes from -------------------------------------- */
  // Each pillar gets its own biology, and the hues deliberately match the `tc`
  // accent the app shell already assigns that view — so the field is the same
  // colour as the section you are standing in rather than a second, competing
  // palette. Intensity is how ALIVE the field looks: the Lab runs hot, Me runs quiet.
  var SECTIONS = {
    home:     ["#34d399", 0.44],   // em     — chlorophyll
    learn:    ["#34d399", 0.52],   // em
    lessons:  ["#38e0d8", 0.50],   // cy
    reason:   ["#8b5cf6", 0.48],   // violet — the colour of thinking
    labs:     ["#f6c667", 0.52],   // amber  — a bench lamp
    solve:    ["#7c8cf8", 0.48],   // indigo
    explore:  ["#38e0d8", 0.58],   // cy     — open water
    me:       ["#c9a86a", 0.34],   // quiet, warm, low
    about:    ["#34d399", 0.46],   // em
    lab:      ["#fb7185", 0.64],   // rose   — an opened body, and the field runs hot
    universe: ["#38e0d8", 0.60]    // cy
  };

  var reduced = false;
  try { reduced = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  var STILL = reduced || /[?&#](still|print)=?1?/.test(location.search + location.hash);

  /* --- install ----------------------------------------------------------- */
  var css = document.createElement("style");
  css.id = "atmo-css";
  css.textContent =
    // z-index:-1, NOT 0. A positioned element at z-index:0 paints ABOVE ordinary
    // in-flow block content, so the field would cover the page. Negative z puts it
    // between the root background and everything else, which means not one existing
    // element needs its position or stacking touched — and the product's fixed nav
    // (position:fixed;z-index:60) keeps working exactly as before.
    "#atmo{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;" +
      "opacity:0;transition:opacity 1.2s cubic-bezier(.22,1,.36,1);display:block}" +
    "#atmo.lit{opacity:.78}" +
    // In light mode the same field reads as a stained section on a white slide, so
    // it stays — but fainter, because ink on paper is a quieter medium.
    "html[data-theme=\"light\"] #atmo.lit{opacity:.42}" +
    // The pages paint --bg on BOTH html and body; body's copy would hide a
    // negative-z child, so hand the background to the root alone. --bg is a themed
    // custom property, so this keeps following the light/dark toggle for free.
    "html{background:var(--bg,#04070a)}body{background:transparent!important}";
  (document.head || document.documentElement).appendChild(css);

  var cv = document.createElement("canvas");
  cv.id = "atmo";
  cv.setAttribute("aria-hidden", "true");
  // NOTE: attach() is *declared* here but deliberately not *called* until the very
  // bottom of this module. It reaches into cur/tgt/M/FS/VS, all of which are `var`
  // bindings that are hoisted but still undefined at this point in the file —
  // calling it here would throw on the first property write and silently leave the
  // page with no field at all.
  function attach() {
    if (!document.body) return setTimeout(attach, 16);
    document.body.insertBefore(cv, document.body.firstChild);
    // The class is what fades the field in, and it must land on a LATER frame than
    // the insert or the CSS transition has nothing to transition from. rAF is the
    // usual way to get that, but rAF does not run at all in a background tab — so a
    // page that loads hidden would sit at opacity 0. The timer is the backstop;
    // adding the class twice costs nothing.
    function lit() { cv.classList.add("lit"); }
    requestAnimationFrame(lit);
    setTimeout(lit, 80);
    boot();
  }

  /* --- state ------------------------------------------------------------- */
  function hexRGB(h) {
    h = String(h).replace("#", "");
    return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
  }
  var cur = { r: 0.20, g: 0.83, b: 0.60, in: 0.44, lt: 0 };
  var tgt = { r: 0.20, g: 0.83, b: 0.60, in: 0.44, lt: 0 };
  var M = { x: innerWidth / 2, y: innerHeight / 2, tx: innerWidth / 2, ty: innerHeight / 2, live: 0, tlive: 0 };

  addEventListener("pointermove", function (e) {
    M.tx = e.clientX; M.ty = e.clientY; M.tlive = 1;
  }, { passive: true });
  // A pointer that has left should stop feeding the tissue, or the glow sits there
  // forever on a page nobody is touching. pointerleave does not bubble, so it has
  // to be bound to the root element rather than to window; mouseout with a null
  // relatedTarget is the belt-and-braces case for leaving through the chrome.
  document.documentElement.addEventListener("pointerleave", function () { M.tlive = 0; }, { passive: true });
  addEventListener("mouseout", function (e) { if (!e.relatedTarget) M.tlive = 0; }, { passive: true });
  addEventListener("blur", function () { M.tlive = 0; });
  // Touch has no hover: without this the glow would stay wherever the last tap
  // landed, permanently, on every phone.
  addEventListener("pointerup", function (e) {
    if (e.pointerType !== "mouse") M.tlive = 0;
  }, { passive: true });

  function theme(rgb, intensity) {
    tgt.r = rgb[0]; tgt.g = rgb[1]; tgt.b = rgb[2];
    if (typeof intensity === "number") tgt.in = intensity;
  }
  function setSection(key) {
    var s = SECTIONS[key] || SECTIONS.home;
    theme(hexRGB(s[0]), s[1]);
    nudge();                             // navigating must restain the field even in STILL mode
  }
  // repaint is filled in by whichever renderer boots. In STILL mode (reduced
  // motion, or ?still=1) exactly one frame is ever drawn, so without this a reader
  // who switches to light mode would be left looking at the dark field forever.
  var repaint = null;
  function nudge() {
    if (!STILL || !repaint) return;      // the animated path picks the change up on its own
    for (var i = 0; i < 60; i++) ease(); // settle the eased colour, then draw the one frame
    repaint(0);
  }
  function readTheme() {
    var next = (document.documentElement.getAttribute("data-theme") === "light") ? 1 : 0;
    if (next === tgt.lt) return;
    tgt.lt = next;
    nudge();
  }

  function ease() {
    cur.r += (tgt.r - cur.r) * 0.035; cur.g += (tgt.g - cur.g) * 0.035;
    cur.b += (tgt.b - cur.b) * 0.035; cur.in += (tgt.in - cur.in) * 0.035;
    cur.lt += (tgt.lt - cur.lt) * 0.08;
    M.x += (M.tx - M.x) * 0.075; M.y += (M.ty - M.y) * 0.075;
    M.live += (M.tlive - M.live) * 0.04;
  }

  /* --- the field --------------------------------------------------------- */
  var FS = [
    "precision mediump float;",
    "uniform vec2 uRes;uniform float uT;uniform vec2 uM;uniform vec3 uC;uniform float uIn;uniform float uLive;uniform float uLight;",

    "float h1(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}",
    "vec2 h2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}",
    "float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);",
    " float a=h1(i),b=h1(i+vec2(1,0)),c=h1(i+vec2(0,1)),d=h1(i+vec2(1,1));",
    " return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}",
    "float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*vn(p);p*=2.07;a*=.5;}return v;}",
    // Ridged noise gives threads instead of blobs — this is what makes a capillary
    // look like a vessel and not like a cloud.
    "float ridge(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*(1.-abs(vn(p)*2.-1.));p*=2.11;a*=.5;}return v;}",

    // Worley. Returns (F1, F2-F1, cell id). Every nucleus orbits its own cell on a
    // slow private path, so no two cells ever pulse together.
    "vec3 cells(vec2 p,float t){vec2 n=floor(p),f=fract(p);",
    " float f1=8.,f2=8.;vec2 id=vec2(0.);",
    " for(int j=-1;j<=1;j++){for(int i=-1;i<=1;i++){",
    "  vec2 g=vec2(float(i),float(j));vec2 o=h2(n+g);",
    "  o=.5+.40*sin(t*.32+6.2831*o);",
    "  float d=length(g+o-f);",
    "  if(d<f1){f2=f1;f1=d;id=n+g;}else if(d<f2){f2=d;}",
    " }}",
    " return vec3(f1,f2-f1,h1(id));}",

    "void main(){",
    " vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;",
    " vec2 m=(uM-.5*uRes)/uRes.y;m.y*=-1.;",
    " float t=uT;",
    // ~7 breaths a minute. Slow enough that you feel it rather than watch it.
    " float breath=.5+.5*sin(t*.72);",

    // Chemotaxis. Everything below is stronger the closer it is to the cursor,
    // and uLive fades the whole effect out when the pointer leaves.
    " float rm=length(uv-m);",
    // Tight. A wide gradient turns the whole page into a lamp; the point is a
    // local response in the tissue the pointer is actually over, so the falloff
    // is effectively gone by a third of the screen height.
    " float food=exp(-rm*rm*7.5)*uLive;",

    // Domain warp — the reason this reads as tissue and not as a tiling.
    " vec2 w=uv+vec2(fbm(uv*1.5+t*.05),fbm(uv*1.5-t*.04+11.3))*.34;",
    // Tissue swells toward the food source: cells near the cursor get physically
    // bigger by shrinking the sampling scale there.
    " float swell=1.-food*.30;",

    // Two layers at different depths. The far one drifts slower and sits dimmer,
    // which is what gives a flat quad the thickness of a real section.
    " vec3 c1=cells(w*3.4*swell+vec2(t*.020,-t*.014),t);",
    " vec3 c2=cells(w*6.9*swell+vec2(-t*.030,t*.023)+31.7,t*1.25);",

    // Membrane = the F2-F1 ridge. This is the single most biological line there is.
    " float mem1=1.-smoothstep(.0,.085,c1.y);",
    " float mem2=1.-smoothstep(.0,.060,c2.y);",
    // Cytoplasm: each cell tinted by its own id, so the field has variation
    // rather than one flat wash.
    " float cyto=(.35+.65*c1.z)*(1.-smoothstep(.15,.85,c1.x));",
    // Nuclei, breathing slightly out of phase per cell.
    " float nuc=smoothstep(.135+.02*sin(t*.6+c1.z*31.),.0,c1.x)*(.55+.45*c1.z);",

    // Capillaries, warped again so they wander, and pulled toward the cursor so
    // the network visibly grows in that direction.
    " vec2 vp=w*2.3+vec2(t*.035,-t*.028)-normalize(uv-m+1e-4)*food*.55;",
    " float vas=ridge(vp);",
    " vas=pow(max(vas-.62,0.)*2.6,2.0);",

    // Motes — organelles and spores adrift in the medium, the counterpart to the
    // stars in the physics field. They rise, because everything in a fluid does.
    " vec2 sp=w*17.0+vec2(0.,-t*.10);vec2 si=floor(sp);vec2 sf=fract(sp)-.5;",
    " float sv=h1(si);",
    " float mote=step(.972,sv)*smoothstep(.055,0.,length(sf-(h2(si)-.5)*.6))*(.55+.45*sin(t*2.1+sv*44.));",

    // --- compose ---
    " float lum=(.030+.055*breath)*(.55+uIn);",
    " vec3 col=vec3(.012,.026,.034)*(1.-uLight);",
    " col+=uC*cyto*lum*1.35;",
    " col+=uC*mem1*(.055+uIn*.13)*(.75+.25*breath);",
    " col+=mix(uC,vec3(1.),.35)*mem2*(.022+uIn*.055);",
    " col+=mix(uC,vec3(1.),.55)*nuc*(.020+uIn*.048);",
    " col+=mix(uC,vec3(1.,.55,.52),.30)*vas*(.055+uIn*.14);",
    " col+=vec3(.85,.95,1.)*mote*.55;",
    // The food source itself: a soft bloom, plus a brightening of whatever tissue
    // is under it, so the cursor lights the section rather than floating over it.
    " col+=uC*food*(.085+uIn*.15);",
    " col*=1.+food*.34;",
    // Depth: the section is thickest and best-lit in the middle of the field.
    " col*=1.-.38*smoothstep(.55,1.35,length(uv));",

    // Light mode: invert the physics, not the palette. On a slide the stain
    // ABSORBS — so a green stain removes red and blue and leaves green, which
    // means the structures subtract (1-uC), not uC. Subtracting uC would print
    // the complement and give a magenta negative of the tissue.
    " float dens=cyto*.30+mem1*1.05+mem2*.42+nuc*.62+vas*.95;",
    " dens=min(dens*(.46+uIn*.60)*(1.+food*.45),1.25);",
    " vec3 ink=vec3(1.)-(vec3(1.)-uC)*dens*.80-vec3(.05)*dens;",
    // Illumination falls off toward the edge of the coverslip.
    " ink=mix(ink,vec3(1.),.22*smoothstep(.55,1.4,length(uv)));",
    " col=mix(col,ink,uLight);",

    " gl_FragColor=vec4(col,1.);}"
  ].join("\n");

  var VS = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";

  function boot() {
    readTheme();
    // Follow the product's own theme toggle without it having to know we exist.
    try {
      new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    } catch (e) {}
    // Pick the colour from the page the shell already declares.
    setSection((document.body && document.body.getAttribute("data-page")) || "home");
    for (var i = 0; i < 40; i++) ease();     // start already at the right colour, no fade-in from green

    var gl = null;
    try {
      gl = cv.getContext("webgl", { alpha: true, antialias: false, depth: false, stencil: false, powerPreference: "low-power" })
        || cv.getContext("experimental-webgl", { alpha: true, antialias: false, depth: false });
    } catch (e) {}
    if (!gl) return fallback();

    function sh(ty, src) {
      var o = gl.createShader(ty); gl.shaderSource(o, src); gl.compileShader(o);
      if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o) || "compile");
      return o;
    }
    var prog;
    try {
      prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || "link");
    } catch (e) { return fallback(); }

    gl.useProgram(prog);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var lp = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(lp);
    gl.vertexAttribPointer(lp, 2, gl.FLOAT, false, 0, 0);

    var uRes = gl.getUniformLocation(prog, "uRes"), uT = gl.getUniformLocation(prog, "uT"),
        uM = gl.getUniformLocation(prog, "uM"), uC = gl.getUniformLocation(prog, "uC"),
        uIn = gl.getUniformLocation(prog, "uIn"), uLive = gl.getUniformLocation(prog, "uLive"),
        uLight = gl.getUniformLocation(prog, "uLight");

    // A full-screen procedural field is fill-rate bound, so resolution is the one
    // dial that matters. 1.25x is enough for the membranes to stay crisp and cheap
    // enough that an integrated GPU never notices.
    var dpr = Math.min(devicePixelRatio || 1, 1.25);
    // A page can boot while its tab is hidden or its pane is not compositing, and
    // then innerWidth is 0 — sizing to that leaves a 1x1 canvas which never
    // recovers, because becoming visible does not fire a resize event. Fall back
    // through the layout box to a sane default so the field is always drawable.
    function vw() { return innerWidth || document.documentElement.clientWidth || cv.clientWidth || 1280; }
    function vh() { return innerHeight || document.documentElement.clientHeight || cv.clientHeight || 800; }
    function size() {
      var w = Math.max(1, Math.round(vw() * dpr)), h = Math.max(1, Math.round(vh() * dpr));
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); }
    }
    addEventListener("resize", size); size();

    var raf = null, t0 = 0;
    // draw() is the whole render and nothing else; frame() is draw() plus the
    // scheduling. Keeping them apart is what lets _tick() below render on demand
    // without quietly queueing a second rAF alongside the running loop.
    function draw(ms) {
      ease(); size();
      if (!t0) t0 = ms || 0;
      gl.uniform2f(uRes, cv.width, cv.height);
      gl.uniform1f(uT, ((ms || 0) - t0) * 0.001);
      var s = cv.width / vw();
      gl.uniform2f(uM, M.x * s, (vh() - M.y) * s);
      gl.uniform3f(uC, cur.r, cur.g, cur.b);
      gl.uniform1f(uIn, cur.in);
      gl.uniform1f(uLive, M.live);
      gl.uniform1f(uLight, cur.lt);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    function frame(ms) {
      raf = null;
      draw(ms);
      if (!STILL) raf = requestAnimationFrame(frame);
    }
    repaint = draw;
    if (STILL) draw(0); else raf = requestAnimationFrame(frame);

    // A field nobody can see must not cost a frame.
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = null; } }
      // Coming back from hidden also re-measures, because the viewport may have
      // been 0 the whole time the tab was in the background.
      else if (!raf && !STILL) { size(); raf = requestAnimationFrame(frame); }
    });

    // _tick renders exactly one frame on demand. rAF is throttled to nothing in a
    // hidden tab, so this is the only way to prove the field actually draws when
    // the page is not on screen — which is precisely when it needs proving.
    window.BIOQ_ATMO = { theme: theme, setSection: setSection, mouse: M, mode: "webgl", _tick: draw };
  }

  /* --- fallback ---------------------------------------------------------- */
  // No WebGL. Draw the same idea in 2D: drifting cells with membranes and nuclei,
  // and a nutrient glow at the cursor. Fewer cells, no capillaries, same product.
  function fallback() {
    var ctx = cv.getContext("2d");
    if (!ctx) { window.BIOQ_ATMO = { theme: theme, setSection: setSection, mouse: M, mode: "none" }; return; }
    var dpr = Math.min(devicePixelRatio || 1, 1.5), W = 0, H = 0, pop = [];
    function size() {
      W = innerWidth; H = innerHeight;
      cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.max(10, Math.min(30, Math.round(W * H / 46000)));
      pop = [];
      for (var i = 0; i < n; i++) pop.push({
        x: Math.random() * W, y: Math.random() * H, r: 42 + Math.random() * 78,
        vx: (Math.random() - 0.5) * 0.13, vy: (Math.random() - 0.5) * 0.13, ph: Math.random() * 6.283
      });
    }
    size(); addEventListener("resize", size);

    var raf = null, t = 0;
    function rgba(a) { return "rgba(" + (cur.r * 255 | 0) + "," + (cur.g * 255 | 0) + "," + (cur.b * 255 | 0) + "," + a + ")"; }
    function frame() {

   and isn't, is worse than no account at all.

   client ID can be swapped without a rebuild. With none set, the control still
   appears and explains what is missing rather than silently doing nothing.
