name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    name: Static site checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            qa/package-lock.json
            learning-tools-source/learning/package-lock.json
      - name: Learning workflow and original-lab boundary
        run: node scripts/check-learning.cjs
      - name: Verify learning-tool source slots and assets
        run: |
          python scripts/build-learning-tools.py --check
          python scripts/sync-learning-tools.py --check
          npm ci --prefix learning-tools-source/learning --no-audit --no-fund
          npm test --prefix learning-tools-source/learning
          node --test learning-tools-source/sketches/tests/core.test.mjs
      - name: Build the single-file application
        run: |
          python scripts/build-single-file.py
          python scripts/build-single-file.py --check
          node --check src/single-file/host.js
          node --check src/single-file/bridge.js
      - name: Verify isolated single-file browser behavior
        env:
          BIOLOGY_PLAYWRIGHT_MODULES: ${{ github.workspace }}/qa/node_modules
        run: |
          npm ci --prefix qa --no-audit --no-fund
          qa/node_modules/.bin/playwright install --with-deps chromium
          node scripts/check-single-file-browser.cjs
          node scripts/check-opening-browser.cjs
          node scripts/check-exam-answers-browser.cjs
          node tests/check-ai-answer-formatting.cjs
          node scripts/check-learning-tools-browser.cjs
          node scripts/check-learning-tools-browser.cjs --portable
          node scripts/check-visual-tools-browser.cjs
          node scripts/check-visual-tools-browser.cjs --portable
          node scripts/check-learning-host-quality.cjs
          node scripts/check-learning-host-quality.cjs --portable
          node scripts/check-protein-browser.cjs
      - name: Save single-file browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: single-file-browser-evidence
          path: |
            docs/single-file/
            docs/protein/
            docs/learning-tools/
            docs/visual-tools/
            docs/host-quality/
          if-no-files-found: ignore
      - name: Preserve deploy invariants
        run: |
          test -f index.html
          test -f CNAME
          grep -q "biology.entelloq.com" CNAME
          if grep -riE "coming soon|lorem ipsum" --include="*.html" .; then
            echo "::error::placeholder language found"
            exit 1
          fi
      - name: Reject committed secrets
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.local$)'; then
            echo "::error::committed environment file found"
            exit 1
          fi
