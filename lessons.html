<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<!-- __TITLE__ -->
<title>Lessons — Biology Entelloq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   BIOLOGY ENTELLOQ — shared product shell. IDENTICAL across every pillar page
   (Home · Learn · Solve · Explore · Me) so the product reads as one thing.
   DO NOT edit tokens, nav, or component classes when building a pillar — only
   fill <main id="page"> and add scoped rules in <style id="page-css">.
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
img,svg,canvas{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit;background:none;border:none}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--em);outline-offset:3px;border-radius:6px}
::selection{background:color-mix(in srgb,var(--em) 45%,transparent);color:var(--ink)}

:root{
  --em:#34d399; --em-2:#10b981; --cy:#38e0d8; --cy-2:#22d3ee;
  --indigo:#7c8cf8; --violet:#8b5cf6; --amber:#f6c667; --rose:#fb7185;
  --grad-life:linear-gradient(120deg,var(--em),var(--cy));
  --grad-mind:linear-gradient(120deg,var(--cy),var(--indigo));
  --bg:#04070a; --bg-2:#070b10; --panel:#0b1117; --raise:#0e151c;
  --ink:#eaf2f5; --dim:#9fb2bc; --faint:#7d8b93;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.05);
  --glass:rgba(10,15,20,.62); --glass-strong:rgba(8,12,17,.82); --hair:rgba(255,255,255,.10);
  --shadow-2:0 12px 40px -12px rgba(0,0,0,.7);
  --shadow-glow:0 0 0 1px rgba(52,211,153,.18),0 20px 60px -18px rgba(16,185,129,.35);
  --spot:rgba(52,211,153,.16);
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"Instrument Serif",Georgia,serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1);
  --r-sm:10px; --r:16px; --r-lg:24px; --r-xl:34px;
  --edge:clamp(20px,5vw,72px); --maxw:1200px;
}
:root[data-theme="light"]{
  --bg:#f6f8f9; --bg-2:#eef2f4; --panel:#ffffff; --raise:#ffffff;
  --ink:#0c1418; --dim:#4a5a63; --faint:#5c6b74;
  --line:rgba(6,20,26,.10); --line-2:rgba(6,20,26,.06);
  --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.86); --hair:rgba(6,20,26,.12);
  --em:#0a7d57; --em-2:#0a7d57; --cy:#0891b2; --indigo:#5b63e6;
  --shadow-2:0 14px 44px -16px rgba(20,40,50,.28);
  --shadow-glow:0 0 0 1px rgba(14,163,113,.18),0 22px 60px -20px rgba(14,163,113,.28);
  --spot:rgba(14,163,113,.12);
  /* Accents the light theme previously inherited from dark, where they measured
     1.49:1 (amber), 2.53:1 (rose) and 3.97:1 (violet) against this background.
     Same hues, taken dark enough to read: 5.0, 5.7 and 6.7:1. */
  --violet:#6d28d9; --amber:#8a6410; --rose:#be1e46;
}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;
  letter-spacing:-.011em;-webkit-font-smoothing:antialiased;min-height:100%;overflow-x:hidden}

/* type scale */
.eyebrow{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.22em;text-transform:uppercase;
  color:var(--em);display:inline-flex;align-items:center;gap:9px}
.eyebrow::before{content:"";width:16px;height:1px;background:currentColor;opacity:.6}
.display{font-weight:800;letter-spacing:-.03em;line-height:1.02;font-size:clamp(2.6rem,7vw,5rem)}
.h1{font-weight:800;letter-spacing:-.028em;line-height:1.05;font-size:clamp(2rem,5vw,3.4rem)}
.h2{font-weight:700;letter-spacing:-.024em;line-height:1.1;font-size:clamp(1.6rem,3.6vw,2.5rem)}
.h3{font-weight:600;letter-spacing:-.02em;line-height:1.2;font-size:clamp(1.1rem,2vw,1.35rem)}
.lead{font-size:clamp(1.02rem,1.6vw,1.3rem);color:var(--dim);line-height:1.6}
.serif{font-family:var(--serif);font-weight:400}
.grad{background:var(--grad-life);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad-mind{background:var(--grad-mind);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--dim)} .faint{color:var(--faint)}

.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--edge);width:100%}
.band{padding-block:clamp(56px,9vw,110px);position:relative}
.grid{display:grid;gap:22px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.sec-head{max-width:720px;margin-bottom:clamp(30px,5vw,54px)}
.sec-head .eyebrow{margin-bottom:16px} .sec-head h2{margin-bottom:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:9px;padding:11px 20px;border-radius:12px;font-weight:600;
  font-size:14.5px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .14s var(--ease-out),box-shadow .3s var(--ease-out),background .3s,border-color .3s}
.btn:active{transform:scale(.97)}
.btn.primary{color:#03110c;background:var(--grad-life);box-shadow:var(--shadow-glow)}
.btn.primary:hover{box-shadow:0 0 0 1px rgba(52,211,153,.3),0 26px 70px -18px rgba(16,185,129,.55)}
.btn.ghost{color:var(--ink);border:1px solid var(--hair);background:color-mix(in srgb,var(--ink) 4%,transparent)}
.btn.ghost:hover{border-color:color-mix(in srgb,var(--em) 40%,var(--hair))}
.btn .arr{transition:transform .2s var(--ease-out)} .btn:hover .arr{transform:translateX(3px)}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:clamp(20px,3vw,30px);position:relative;overflow:hidden;
  transition:transform .4s var(--ease-out),border-color .4s,box-shadow .4s var(--ease-out)}
.card .glow{position:absolute;inset:-1px;border-radius:inherit;opacity:0;pointer-events:none;
  background:radial-gradient(50% 60% at var(--mx,50%) 0%,var(--spot),transparent 70%);transition:opacity .4s}
@media (hover:hover) and (pointer:fine){
  .card.lift:hover{transform:translateY(-6px);border-color:var(--hair);box-shadow:var(--shadow-2)}
  .card.lift:hover .glow{opacity:1}}
.card .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:18px;
  background:color-mix(in srgb,var(--em) 12%,transparent);color:var(--em);
  border:1px solid color-mix(in srgb,var(--em) 22%,transparent)}
.card .ico svg{width:22px;height:22px}
.card h3{margin-bottom:8px} .card p{color:var(--dim);font-size:15px;line-height:1.6}
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.chip.live{color:var(--em);border-color:color-mix(in srgb,var(--em) 30%,transparent);background:color-mix(in srgb,var(--em) 10%,transparent)}
.chip.soon{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 26%,transparent)}
.chip .d{width:6px;height:6px;border-radius:50%;background:currentColor}

/* reveal-on-scroll (opacity+transform only) */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
.reveal.in{opacity:1;transform:none}
.reveal.d1{transition-delay:.06s}.reveal.d2{transition-delay:.12s}.reveal.d3{transition-delay:.18s}.reveal.d4{transition-delay:.24s}

/* ambient veil */
.bg-veil{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(60% 45% at 78% -5%,color-mix(in srgb,var(--cy) 10%,transparent),transparent 60%),
  radial-gradient(55% 45% at 8% 8%,color-mix(in srgb,var(--em) 10%,transparent),transparent 55%)}

/* ===== persistent product nav ===== */
header.nav{position:fixed;top:0;left:0;right:0;z-index:60;transition:background .3s,border-color .3s,backdrop-filter .3s}
header.nav.scrolled{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.nav-in{max-width:var(--maxw);margin-inline:auto;padding:12px var(--edge);display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.brand .logo{width:28px;height:28px} .brand b{font-weight:800}
.nav-links{display:flex;align-items:center;gap:2px;margin-left:6px}
.nav-links a{padding:8px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--dim);
  transition:color .2s,background .2s;position:relative}
.nav-links a:hover{color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,transparent)}
.nav-links a.active{color:var(--ink)}
.nav-links a.active::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:2px;background:var(--grad-life)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;
  color:var(--dim);cursor:pointer;background:var(--panel);transition:color .2s,border-color .2s,transform .12s var(--ease-out)}
.iconbtn:hover{color:var(--ink);border-color:var(--hair)} .iconbtn:active{transform:scale(.94)} .iconbtn svg{width:17px;height:17px}
.navtoggle{display:none}
main{position:relative;z-index:1;padding-top:64px;min-height:100vh}
.mobile-menu{display:none;position:fixed;inset:64px 0 0;z-index:55;background:var(--glass-strong);overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:max(24px,env(safe-area-inset-bottom));
  backdrop-filter:blur(20px);padding:24px var(--edge)}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;padding:16px 0;font-size:20px;font-weight:600;border-bottom:1px solid var(--line)}

/* footer */
footer{position:relative;z-index:1;border-top:1px solid var(--line);background:var(--bg-2);margin-top:40px}
.foot-in{max-width:var(--maxw);margin-inline:auto;padding:40px var(--edge);display:flex;flex-wrap:wrap;gap:18px;
  align-items:center;justify-content:space-between;color:var(--faint);font-size:13px}
.foot-in a{color:var(--dim)} .foot-in a:hover{color:var(--ink)}

@media (max-width:900px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:1024px){.nav-links{display:none}.navtoggle{display:grid}}
@media (max-width:680px){.g4,.g3,.g2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.12s!important}
  .reveal{opacity:1!important;transform:none!important}}

/* The primary CTA hard-codes near-black text over --grad-life, which works on the
   dark theme. Light theme darkens --em to #0a7d57, dropping that label to ~3.75:1
   over the green half of the gradient. Light mode therefore gets white text on a
   deliberately darker gradient instead. */
:root[data-theme="light"] .btn.primary{color:#fff;background:linear-gradient(120deg,var(--em),#0a6f8c)}
</style>
<style id="page-css">
/* 6-Lens lessons — scoped page styles (uses shared tokens only) */
.les-listhead{padding-bottom:0}
.les-card{display:block;--lc:var(--em)}
.les-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lc);opacity:.7}
.les-dom{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.les-lensrow{display:flex;gap:6px;margin-top:16px}
.les-lensdot{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-family:var(--mono);
  font-size:11px;font-weight:600;color:var(--dc);border:1px solid color-mix(in srgb,var(--dc) 40%,transparent);
  background:color-mix(in srgb,var(--dc) 12%,transparent)}

/* lesson view */
.les-lesson{--lc:var(--em)}
.les-back{display:inline-flex;font-size:13.5px;color:var(--dim);font-weight:600;margin-bottom:22px;transition:color .2s}
.les-back:hover{color:var(--ink)}
.les-head{max-width:760px}
.les-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.les-intu{max-width:720px}

/* the A–F lens rail */
.les-rail{display:flex;gap:8px;margin:30px 0 22px;flex-wrap:wrap;position:sticky;top:70px;z-index:5;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(8px);padding:8px 0}
.les-tab{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;color:var(--dim);transition:color .2s,border-color .2s,background .2s,transform .12s var(--ease-out)}
.les-tab:hover{color:var(--ink)} .les-tab:active{transform:scale(.97)}
.les-tab .les-g{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--dc)}
.les-tab .les-ic{font-size:13px;color:var(--dc)}
.les-tab .les-nm{font-size:13.5px;font-weight:600}
.les-tab.on{color:var(--ink);border-color:color-mix(in srgb,var(--dc) 50%,transparent);
  background:color-mix(in srgb,var(--dc) 12%,transparent)}
@media (max-width:680px){.les-tab .les-nm{display:none}.les-rail{gap:6px}}

/* lens stage */
.les-stage{min-height:340px}
.les-lens{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:clamp(22px,3vw,34px);
  animation:lensIn .4s var(--ease-out)}
@keyframes lensIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.les-lenshd{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.les-lg{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-family:var(--mono);
  font-weight:700;font-size:17px;color:#04120c;flex:none}
.les-ln{font-weight:700;font-size:17px;letter-spacing:-.01em}
.les-lsub{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.les-blurb{color:var(--dim);font-size:15.5px;line-height:1.65;max-width:680px;margin-bottom:18px}

/* interactive mounts */
.les-mount{margin-top:8px}
.les-canvas{width:100%;border-radius:14px;border:1px solid var(--line);background:var(--bg-2);display:block}
.les-ctls{display:flex;flex-wrap:wrap;gap:14px 26px;margin-top:16px}
.les-ctl{display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1}
.les-ctl label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.les-ctl input[type=range]{width:100%;accent-color:var(--em)}
.les-ctl output{font-size:13px;color:var(--ink);font-weight:600;font-family:var(--mono)}
.les-read{margin-top:14px;font-size:14px;color:var(--dim);font-family:var(--mono);
  background:color-mix(in srgb,var(--ink) 4%,transparent);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.les-read b{color:var(--ink)}
/* push-buttons that sit in an interactive's control row (oxygen, restart, stimulate).
   Shaped like .les-tab so every control on the page reads as one family; --dc is set
   on the enclosing .les-lens, so each button picks up its own lens colour. */
.cell-tab{align-self:center;padding:9px 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;color:var(--dim);font-size:13.5px;font-weight:600;
  transition:color .2s,border-color .2s,background .2s,transform .12s var(--ease-out)}
.cell-tab:hover{color:var(--ink)}
.cell-tab:active{transform:scale(.97)}
.cell-tab.on{color:var(--ink);border-color:color-mix(in srgb,var(--dc,var(--em)) 50%,transparent);
  background:color-mix(in srgb,var(--dc,var(--em)) 12%,transparent)}
.les-fickbar{height:12px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:18px}
.les-fickbar i{display:block;height:100%;width:0;background:var(--grad-life);transition:width .3s var(--ease-out)}

/* predict */
.les-q{font-size:18px;font-weight:600;line-height:1.4;margin-bottom:18px;max-width:640px}
.les-opts{display:grid;gap:10px;max-width:560px}
.les-opt{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;font-size:14.5px;color:var(--dim);transition:border-color .2s,color .2s,background .2s}
.les-opt:hover:not(:disabled){border-color:var(--hair);color:var(--ink)}
.les-opt.right{border-color:var(--em);background:color-mix(in srgb,var(--em) 14%,transparent);color:var(--ink)}
.les-opt.wrong{border-color:var(--rose);background:color-mix(in srgb,var(--rose) 12%,transparent);color:var(--ink)}
.les-opt.muted{opacity:.5}
.les-why{max-height:0;overflow:hidden;opacity:0;transition:max-height .5s var(--ease-out),opacity .4s;margin-top:0}
.les-why.show{max-height:320px;opacity:1;margin-top:18px}
.les-verdict{font-weight:700;font-size:15px;margin-bottom:8px}
.les-verdict.ok{color:var(--em)} .les-verdict.no{color:var(--rose)}
.les-why p{color:var(--dim);font-size:15px;line-height:1.65;max-width:640px}

/* visual */
.les-vis{list-style:none;display:flex;flex-direction:column;gap:12px;max-width:680px}
.les-vis li{position:relative;padding-left:20px;color:var(--dim);font-size:15px;line-height:1.6}
.les-vis li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:2px;background:var(--cy)}

/* frontier */
.les-fr{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line-2)}
.les-fr:last-child{border:none}
.les-frtag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#f472b6;
  border:1px solid color-mix(in srgb,#f472b6 30%,transparent);border-radius:6px;padding:4px 8px;flex:none;margin-top:2px}
.les-fr.open .les-frtag{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 30%,transparent)}
.les-fr p{color:var(--dim);font-size:15px;line-height:1.6}

/* footer sections */
.les-foot{margin-top:34px;display:grid;gap:22px}
.les-sec h4{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:12px}
.les-sec ul{list-style:none;display:flex;flex-direction:column;gap:9px}
.les-sec li{position:relative;padding-left:18px;color:var(--dim);font-size:14.5px;line-height:1.55}
.les-sec li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--em)}
.les-exam{border-left:2px solid var(--amber);padding-left:16px}
.les-exam h4{color:var(--amber)} .les-exam p{color:var(--dim);font-size:14.5px;line-height:1.6;max-width:720px}
.les-conn{display:flex;flex-wrap:wrap;gap:8px}

/* shared shell behaviour — nav scroll state, theme, mobile menu, scroll-reveal.
   Pillar-specific JS goes in <script id="page-js"> AFTER this block. */
(function(){
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const root=document.documentElement;
  // theme
  function setTheme(t){root.setAttribute("data-theme",t);try{localStorage.setItem("bioq_theme",t);}catch(e){}
    $("#themeBtn").setAttribute("aria-pressed",t==="light"?"true":"false");
    $("#themeIcon").innerHTML=t==="light"
      ?'<circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
      :'<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>';}
  try{setTheme(localStorage.getItem("bioq_theme")||"dark");}catch(e){setTheme("dark");}
  $("#themeBtn").addEventListener("click",()=>setTheme(root.getAttribute("data-theme")==="light"?"dark":"light"));
  // nav scroll state
  const nav=$("#nav"); addEventListener("scroll",()=>nav.classList.toggle("scrolled",scrollY>16),{passive:true});
  nav.classList.toggle("scrolled",scrollY>16);
  // mobile menu
  const mm=$("#mobileMenu"),nt=$("#navToggle");
  nt.addEventListener("click",()=>{const o=mm.classList.toggle("open");nt.setAttribute("aria-expanded",o?"true":"false");});
  // active nav link (set data-page on <body> in each pillar, e.g. <body data-page="learn">)
  const page=document.body.dataset.page; if(page){const a=document.querySelector('.nav-links a[data-nav="'+page+'"]'); if(a)a.classList.add("active");}
  // scroll reveal
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12,rootMargin:"0px 0px -6% 0px"});
  function observe(){$$(".reveal:not(.in)").forEach(el=>io.observe(el));}
  observe(); window.__observeReveals=observe;
  // card glow
  addEventListener("pointermove",e=>{const c=e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect();
    c.style.setProperty("--mx",((e.clientX-r.left)/r.width*100)+"%");},{passive:true});
})();

<script id="page-js">
/* ============================================================================
   Biology Entelloq — the 6-LENS lesson system.
   The signature scaffold, translated from Physics Entelloq: every concept is
   seen through six lenses — A Experience · B Predict · C Visual · D Math ·

   ========================================================================== */
(function () {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // The six lenses — glyphs/colours echo the reference's A–F rail.
  const LENSES = [
    { k: "experience", n: "Experience", g: "A", c: "var(--em)", ic: "●" },
    { k: "predict", n: "Predict", g: "B", c: "#7dd3fc", ic: "Ψ" },
    { k: "visual", n: "Visual", g: "C", c: "var(--cy)", ic: "◳" },
    { k: "math", n: "Math", g: "D", c: "var(--indigo)", ic: "∑" },
    { k: "frontier", n: "Frontier", g: "E", c: "#f472b6", ic: "◆" },
    { k: "realworld", n: "Real World", g: "F", c: "var(--amber)", ic: "⊕" },
  ];

  // ── content ────────────────────────────────────────────────────────────────
  const LESSONS = [
    {
      id: "diffusion", domain: "Cell Biology", color: "#34d399", diff: "Foundation",
      title: "Diffusion & Osmosis", chips: ["Passive transport", "Concentration gradient", "Equilibrium"],
      intuition: "Molecules are in ceaseless random motion. With no energy spent, that jiggling alone spreads them from where they are crowded to where they are sparse — until, statistically, both sides are even. Osmosis is just this, for water across a membrane.",
      lenses: {
        experience: { mount: "diffusion", blurb: "Watch random motion alone even out a difference. Every particle wanders blindly — yet the crowd flows from full to empty. Turn up the temperature and the same equilibrium arrives faster." },
        predict: { q: "You drop a red blood cell into a beaker of pure (distilled) water. What happens?", o: ["Nothing — the membrane blocks water", "Water rushes IN; the cell swells and can burst", "Water rushes OUT; the cell shrivels", "Salt leaves the cell to balance"], a: 1, why: "Pure water is hypotonic to the cell's salty interior, so water moves IN down its own concentration gradient (osmosis). With no cell wall to resist, the cell swells and can lyse. In salt water the opposite — crenation — happens." },
        visual: { title: "A selectively permeable barrier", pts: ["The phospholipid bilayer lets small, non-polar molecules (O₂, CO₂) slip through freely.", "Water crosses slowly through the bilayer — and fast through protein channels called aquaporins.", "Net movement is always high → low concentration, until the gradient is gone.", "'Selectively permeable' = some things pass, others don't. That selectivity is what makes a cell a cell."] },
        math: { mount: "fick", equation: "Rate ∝ (Area × ΔConcentration) / Distance", blurb: "Fick's Law. The rate of diffusion rises with more surface area and a steeper gradient, and falls as the distance to cross grows — which is exactly why lungs and gut are folded into vast thin sheets." },
        frontier: { experiment: "In 1992 Peter Agre isolated the first water channel, aquaporin — proving water doesn't just seep through the bilayer but has dedicated pores (Nobel 2003).", research: "Engineers now build artificial aquaporin membranes for ultra-efficient desalination.", question: "How does a cell dial its water permeability up and down in seconds — and could we borrow that control for medicine?" },
        realworld: { title: "Why your IV drip is salty", blurb: "A hospital drip must be isotonic — the same concentration as blood — or osmosis would burst or shrivel your cells. Kidney dialysis runs your blood past a membrane so wastes diffuse out while blood cells stay in. Diffusion is quietly keeping you alive right now, in every alveolus of your lungs." },
      },
      facts: ["Diffusion needs no ATP — it is powered entirely by the molecules' own thermal motion.", "Surface-area-to-volume ratio is why cells stay small: too big, and the centre starves before diffusion can reach it.", "Osmosis is the diffusion of WATER specifically, across a selectively permeable membrane."],
      exam: "Define isotonic, hypotonic and hypertonic from the SOLUTION's point of view, and state what happens to an animal cell in each. A classic NEET/CBSE trap is mixing up the direction of water movement.",
      connections: ["Cell Membrane", "Active Transport", "Kidney Function", "Gas Exchange"],

  // ── shell chrome ────────────────────────────────────────────────────────────
  const app = document.getElementById("lessonApp");
  let animStop = null;              // cancel fn for the active lens animation
  function clearAnim() { if (animStop) { try { animStop(); } catch (e) {} animStop = null; } }

  // hash router: #<lessonId> opens a lesson; empty shows the list
  function route() {
    const id = location.hash.replace(/^#/, "");
    const lesson = LESSONS.find((l) => l.id === id);
    clearAnim();
    if (lesson) renderLesson(lesson); else renderList();
    scrollTo({ top: 0, behavior: reduced ? "auto" : "smooth" });
    if (window.__observeReveals) window.__observeReveals();
  }
  addEventListener("hashchange", route);

  // ── list view ────────────────────────────────────────────────────────────────
  function renderList() {
    app.innerHTML = "";
    const head = el("div", "wrap band les-listhead reveal", `
      <div class="eyebrow">The 6-Lens lessons</div>
      <h1 class="h1" style="margin:16px 0 16px">See every concept from<br><span class="grad">story to frontier.</span></h1>
      <p class="lead" style="max-width:640px">Every idea, through six lenses — felt, tested, drawn, quantified, pushed to the research edge, and grounded in your life. Pick one and step in.</p>`);
    app.appendChild(head);
    const grid = el("div", "wrap"); const g = el("div", "grid g3"); grid.appendChild(g);
    LESSONS.forEach((l, i) => {
      const card = el("a", "card lift les-card reveal d" + ((i % 3) + 1));
      card.href = "#" + l.id;
      card.style.setProperty("--lc", l.color);
      card.innerHTML = `<div class="glow"></div>
        <div class="les-dom" style="color:${l.color}">${l.domain} · ${l.diff}</div>
        <h3 class="h3" style="margin:6px 0 10px">${l.title}</h3>
        <p>${l.intuition}</p>
        <div class="les-lensrow">${LENSES.map((x) => `<span class="les-lensdot" style="--dc:${x.c}" title="${x.n}">${x.g}</span>`).join("")}</div>`;
      g.appendChild(card);
    });
    app.appendChild(grid);
  }

  // ── lesson view ──────────────────────────────────────────────────────────────
  function renderLesson(l) {
    app.innerHTML = "";

  // ── interactive builders (each returns a cancel fn) ──────────────────────────

  const BUILD = {
    diffusion(host) {

    enzyme(host) {

      function activity() { const opt = 37; return Math.max(0, temp > 55 ? 0 : 1 - Math.abs(temp - opt) / 30); }

    },

    michaelis(host) {

      control(ctrls, "Kₘ", 5, 60, 20, 1, null, (v) => { Km = v; draw(); });
      control(ctrls, "[Substrate]", 0, 120, 30, 1, null, (v) => { S = v; draw(); });

        const { ctx, W, H } = cv; ctx.clearRect(0, 0, W, H); const pad = 34;

        ctx.stroke();
        const v = Vmax * S / (Km + S); const mx = pad + (S / 120) * (W - 8 - pad); const my = 8 + (1 - v / 100) * (H - pad - 8);
        ctx.fillStyle = "#f6c667"; ctx.beginPath(); ctx.arc(mx, my, 5, 0, 6.28); ctx.fill();
        read.innerHTML = `At [S] = <b>${S}</b>, rate v = <b>${v.toFixed(1)}</b> (of Vₘₐₓ ${Vmax}). Half-max at [S] = Kₘ = <b>${Km}</b>.`;
      }

    },

    fick(host) {

      control(ctrls, "Δ Concentration", 1, 10, 6, 1, null, (v) => { dC = v; upd(); });
      control(ctrls, "Distance to cross", 1, 10, 3, 1, null, (v) => { dist = v; upd(); });

      function upd() { const rate = (A * dC) / dist; const pct = Math.min(100, rate / 10 * 100); bar.querySelector("i").style.width = pct + "%"; read.innerHTML = `Diffusion rate ∝ (${A} × ${dC}) / ${dist} = <b>${rate.toFixed(1)}</b> — ${rate > 12 ? "fast (big thin surface, steep gradient)" : rate < 3 ? "slow (small area or long path)" : "moderate"}`; }

    },

    logistic(host) {
      const cv = canvasHost(host, 0.52); let r = 0.5, K = 80, N0 = 5, raf, t0 = 0, playing = true;

    /* ---- PHOTOSYNTHESIS: limiting factors ------------------------------- */
    photo(host) {
      const cv = canvasHost(host, 0.5);
      let light = 50, co2 = 50, temp = 25;
      // `read` MUST exist before the sliders: control() fires its callback straight
      // away to show the starting value, and those callbacks call draw(), which
      // writes into read — declaring it afterwards is a temporal-dead-zone crash.
      const read = el("div", "les-read");
      // rate is capped by the scarcest input; temperature acts as an enzyme bell
      // curve. These are FUNCTION DECLARATIONS on purpose: they are hoisted, so the
      // sliders below can fire draw() immediately without hitting a dead zone.
      function tempF(t) { return Math.exp(-Math.pow(t - 30, 2) / 210) * (t > 45 ? 0.15 : 1); }
      function rate(l, c, t) { return Math.min(l * 1.35, c * 1.35, 100) * tempF(t) / 100 * 100; }

        const { ctx, W, H } = cv; ctx.clearRect(0, 0, W, H);

        ctx.fillStyle = "#63757f"; ctx.font = "600 10.5px ui-monospace,monospace";
        ctx.textAlign = "center"; ctx.fillText("light intensity →", W / 2, H - 10);
        // the curve of rate against light, at the CURRENT co2 + temperature
        ctx.strokeStyle = "#34d399"; ctx.lineWidth = 2.6; ctx.beginPath();
        for (let l = 0; l <= 100; l++) {
          const v = rate(l, co2, temp);
          const x = pad + (l / 100) * gw, y = H - pad - (v / 100) * gh;
          l ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.stroke();
        // where the plateau begins = the limiting factor kicks in
        const capV = rate(100, co2, temp);
        const plateauL = Math.min(100, (co2 * 1.35) / 1.35);
        if (plateauL < 99) {
          const px = pad + (plateauL / 100) * gw;
          ctx.strokeStyle = "rgba(246,198,103,.5)"; ctx.setLineDash([4, 5]);

        // Temperature has to be measured the same way as the other two, not merely
        // checked at the hot end: near freezing the enzymes are just as throttled as
        // they are when denaturing, and the old hot-only test blamed light or CO₂ for
        // a rate that cold was setting. Ties fall to the earlier entry, so light is
        // still named first when light and CO₂ are matched.
        const tLabel = temp > 42 ? "temperature (enzymes denaturing)"
          : temp < 20 ? "temperature (too cold for the enzymes)" : "temperature";
        const caps = [
          [Math.min(light * 1.35, 100) / 100, "light"],
          [Math.min(co2 * 1.35, 100) / 100, "CO₂"],
          [tempF(temp), tLabel],
        ];
        const worst = caps.reduce((a, b) => (b[0] < a[0] ? b : a));
        const lim = worst[0] > 0.995 ? "none — all three are at their ceiling" : worst[1];

      }

    /* ---- RESPIRATION: three stages, ATP tally, O2 toggle ---------------- */
    resp(host) {

          const x = 20 + i * (bw + 10);
          ctx.fillStyle = on ? "rgba(255,255,255,.05)" : "rgba(232,115,94,.07)";
          ctx.strokeStyle = on ? s.col : "rgba(232,115,94,.4)"; ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.roundRect(x, by, bw, bh, 12); ctx.fill(); ctx.stroke();
          ctx.fillStyle = on ? "#eaf2f5" : "#8a6a66";
          ctx.font = "600 12.5px Inter,sans-serif"; ctx.textAlign = "center";
          ctx.fillText(s.n, x + bw / 2, by + 24);
          ctx.fillStyle = "#63757f"; ctx.font = "500 10.5px ui-monospace,monospace";
          ctx.fillText(s.where, x + bw / 2, by + 42);
          ctx.fillStyle = on ? s.col : "#8a6a66"; ctx.font = "700 20px Inter,sans-serif";
          ctx.fillText(on ? "+" + s.atp : "stalled", x + bw / 2, by + bh / 2 + 16);
          ctx.fillStyle = "#63757f"; ctx.font = "500 10px ui-monospace,monospace";
          if (on) ctx.fillText("ATP", x + bw / 2, by + bh / 2 + 32);
          if (on) total += s.atp;
          // electrons flowing between stages
          if (on && i < 2 && !reduced) {
            const p = (t * 0.5 + i * 0.3) % 1;
            ctx.beginPath(); ctx.arc(x + bw + 5, by + bh / 2 + Math.sin(p * 6.28) * 6, 3, 0, 6.28);
            ctx.fillStyle = s.col; ctx.fill();
          }
        });
        ctx.fillStyle = "#eaf2f5"; ctx.font = "700 15px Inter,sans-serif"; ctx.textAlign = "center";
        ctx.fillText(`Net yield: ${total} ATP per glucose`, W / 2, H - 22);
        read.innerHTML = oxygen
          ? `Aerobic — all three stages run. <b>~${total} ATP</b> per glucose.`
          : `Anaerobic — the chain has no final electron acceptor, so Krebs and ETC stall. Only glycolysis runs: <b>${total} ATP</b>, and pyruvate becomes lactate.`;
        raf = requestAnimationFrame(draw);
      }
      draw(); return () => { cancelAnimationFrame(raf); cv.off(); };
    },

    /* ---- DNA REPLICATION: a running fork -------------------------------- */
    fork(host) {
      const cv = canvasHost(host, 0.52);
      let speed = 50, raf, t = 0;
      const ctrls = el("div", "les-ctls"); host.appendChild(ctrls);
      control(ctrls, "Fork speed", 10, 100, 50, 1, (v) => v + "%", (v) => { speed = v; });
      const read = el("div", "les-read"); host.appendChild(read);
      function draw() {
        t += reduced ? 0.004 : 0.016 * (speed / 50);
        const { ctx, W, H } = cv; ctx.clearRect(0, 0, W, H);
        const cy = H / 2, forkX = 60 + ((t * 40) % (W - 140));
        // parent duplex, still zipped, ahead of the fork
        ctx.strokeStyle = "#9fb2bc"; ctx.lineWidth = 2.4;
        for (const s of [-1, 1]) {
          ctx.beginPath();
          for (let x = forkX; x <= W - 16; x += 4) {
            const y = cy + s * (10 + Math.sin(x * 0.09 + t) * 6);
            x === forkX ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        // base pairs in the unopened duplex
        ctx.strokeStyle = "rgba(159,178,188,.4)"; ctx.lineWidth = 1.2;
        for (let x = forkX + 6; x < W - 16; x += 12) {
          ctx.beginPath();
          ctx.moveTo(x, cy - (10 + Math.sin(x * 0.09 + t) * 6));
          ctx.lineTo(x, cy + (10 + Math.sin(x * 0.09 + t) * 6));
          ctx.stroke();
        }
        // the two separated templates behind the fork
        for (const s of [-1, 1]) {
          ctx.strokeStyle = "#9fb2bc"; ctx.lineWidth = 2.4; ctx.beginPath();
          for (let x = 16; x <= forkX; x += 4) {
            const spread = (forkX - x) * 0.30;
            ctx.lineTo(x, cy + s * (10 + spread));
          }
          ctx.stroke();
        }
        // LEADING strand — one continuous new strand
        ctx.strokeStyle = "#34d399"; ctx.lineWidth = 3; ctx.beginPath();
        for (let x = 16; x <= forkX - 4; x += 4) {
          const spread = (forkX - x) * 0.30;
          ctx.lineTo(x, cy - (10 + spread) + 5);
        }
        ctx.stroke();
        // LAGGING strand — discrete Okazaki fragments with visible gaps
        ctx.strokeStyle = "#38e0d8"; ctx.lineWidth = 3;
        const FRAG = 46;
        for (let f = 0; f * FRAG < forkX - 30; f++) {
          const x0 = 16 + f * FRAG, x1 = Math.min(forkX - 10, x0 + FRAG - 12);
          if (x1 <= x0) continue;
          ctx.beginPath();
          for (let x = x0; x <= x1; x += 4) {
            const spread = (forkX - x) * 0.30;
            ctx.lineTo(x, cy + (10 + spread) - 5);
          }
          ctx.stroke();
        }
        // helicase at the fork
        ctx.fillStyle = "#f6c667";
        ctx.beginPath(); ctx.arc(forkX, cy, 9, 0, 6.28); ctx.fill();
        ctx.fillStyle = "#04120c"; ctx.font = "700 9px ui-monospace,monospace"; ctx.textAlign = "center";
        ctx.fillText("H", forkX, cy + 3);
        ctx.fillStyle = "#34d399"; ctx.font = "600 11px ui-monospace,monospace"; ctx.textAlign = "left";
        ctx.fillText("leading — continuous", 18, cy - 52);
        ctx.fillStyle = "#38e0d8";
        ctx.fillText("lagging — Okazaki fragments", 18, H - 14);
        read.innerHTML = `Helicase unzips at the fork. The <b>leading</b> strand is built in one piece; the <b>lagging</b> strand is built backwards in fragments, later sealed by <b>ligase</b>.`;
        raf = requestAnimationFrame(draw);
      }
      draw(); return () => { cancelAnimationFrame(raf); cv.off(); };
    },

    /* ---- NATURAL SELECTION: allele frequency over generations ----------- */
    selection(host) {
      const cv = canvasHost(host, 0.5);
      let pressure = 50, dark = 0.5, gen = 0, hist = [0.5], raf, acc = 0;
      const ctrls = el("div", "les-ctls"); host.appendChild(ctrls);
      control(ctrls, "Predation pressure", 0, 100, 50, 1,
        (v) => (v < 20 ? "weak" : v < 60 ? "moderate" : "strong"), (v) => { pressure = v; });
      const reset = el("button", "cell-tab", "Restart population");
      reset.addEventListener("click", () => { dark = 0.5; gen = 0; hist = [0.5]; });
      ctrls.appendChild(reset);
      const read = el("div", "les-read"); host.appendChild(read);
      function step() {
        // dark morph favoured on a dark background: Δp ∝ s·p(1−p)
        const s = pressure / 100 * 0.55;
        dark = Math.max(0.001, Math.min(0.999, dark + s * dark * (1 - dark)));
        gen++; hist.push(dark); if (hist.length > 120) hist.shift();
      }
      function draw() {
        acc += reduced ? 1 : 0.55;
        if (acc >= 1) { acc = 0; if (gen < 400) step(); }
        const { ctx, W, H } = cv; ctx.clearRect(0, 0, W, H);
        const half = W * 0.42, pad = 30;
        // left: the population itself, visibly shifting colour
        ctx.fillStyle = "rgba(40,50,45,.5)"; ctx.fillRect(0, 0, half, H);
        for (let i = 0; i < 60; i++) {
          const isDark = (i / 60) < dark;
          const x = 16 + (i % 10) * (half - 32) / 9, y = 22 + Math.floor(i / 10) * (H - 44) / 5;
          ctx.fillStyle = isDark ? "#2b2f36" : "#d8cfae";
          ctx.beginPath(); ctx.ellipse(x, y, 7, 5, 0, 0, 6.28); ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.lineWidth = 0.8; ctx.stroke();
        }
        ctx.fillStyle = "#9fb2bc"; ctx.font = "600 10.5px ui-monospace,monospace"; ctx.textAlign = "left";
        ctx.fillText("population on a dark background", 14, H - 8);
        // right: allele frequency curve
        const gx = half + pad, gw = W - gx - 14, gh = H - pad * 2;
        ctx.strokeStyle = "rgba(255,255,255,.10)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(gx, pad); ctx.lineTo(gx, H - pad); ctx.lineTo(W - 10, H - pad); ctx.stroke();
        ctx.strokeStyle = "#fb7185"; ctx.lineWidth = 2.4; ctx.beginPath();
        hist.forEach((p, i) => {
          const x = gx + (i / 120) * gw, y = H - pad - p * gh;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.stroke();
        ctx.fillStyle = "#63757f"; ctx.font = "600 10px ui-monospace,monospace"; ctx.textAlign = "left";
        ctx.fillText("dark allele frequency", gx + 4, pad - 6);
        read.innerHTML = `Generation <b>${gen}</b> · dark allele <b>${(dark * 100).toFixed(0)}%</b>` +
          (pressure < 8 ? " — almost no selection, so frequency barely moves." :
            dark > 0.95 ? " — near fixation; change slows because p(1−p) is tiny." : "");
        raf = requestAnimationFrame(draw);
      }
      draw(); return () => { cancelAnimationFrame(raf); cv.off(); };
    },

    /* ---- ACTION POTENTIAL: all-or-nothing spike ------------------------- */
    spike(host) {
      const cv = canvasHost(host, 0.52);
      let strength = 60, raf, t = 0;
      const trace = []; const DUR = 260;
      let firedAt = -999, lastFire = -999;
      const ctrls = el("div", "les-ctls"); host.appendChild(ctrls);
      control(ctrls, "Stimulus strength", 0, 100, 60, 1,
        (v) => v + "%" + (v >= 45 ? " (above threshold)" : " (sub-threshold)"), (v) => { strength = v; });
      const fire = el("button", "cell-tab on", "Stimulate ⚡");
      fire.addEventListener("click", () => {
        const refractory = (t - lastFire) < 42;
        if (strength < 45) { msg = "Sub-threshold — the membrane depolarised a little and leaked straight back. No spike."; return; }
        if (refractory) { msg = "Refractory period — sodium channels are still inactivated. It cannot fire again yet."; return; }
        firedAt = t; lastFire = t; msg = "Threshold crossed — a full-height action potential, identical every time.";
      });
      ctrls.appendChild(fire);
      const read = el("div", "les-read"); host.appendChild(read);
      let msg = "Press Stimulate. Below about 45% nothing happens; above it you always get the same spike.";
      // the canonical waveform, in mV, as a function of ms since firing
      function mv(dt) {
        if (dt < 0) return -70;
        if (dt < 8) return -70 + (dt / 8) * 15;           // slow rise to threshold
        if (dt < 20) return -55 + ((dt - 8) / 12) * 95;   // depolarisation to +40
        if (dt < 40) return 40 - ((dt - 20) / 20) * 105;  // repolarisation
        if (dt < 62) return -65 - Math.sin((dt - 40) / 22 * Math.PI) * 12;  // hyperpolarisation
        return -70;
      }
      function draw() {
        t += reduced ? 4 : 1.6;
        trace.push(mv(t - firedAt)); if (trace.length > DUR) trace.shift();
        const { ctx, W, H } = cv; ctx.clearRect(0, 0, W, H);
        const pad = 40, gw = W - pad - 14, gh = H - pad * 2;
        const toY = (v) => pad + gh - ((v + 90) / 140) * gh;
        // reference lines
        [[-70, "rest −70", "rgba(159,178,188,.35)"], [-55, "threshold −55", "rgba(246,198,103,.5)"], [0, "0 mV", "rgba(255,255,255,.10)"]]
          .forEach(([v, label, col]) => {
            ctx.strokeStyle = col; ctx.setLineDash([4, 5]); ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(pad, toY(v)); ctx.lineTo(W - 14, toY(v)); ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = "#63757f"; ctx.font = "500 9.5px ui-monospace,monospace"; ctx.textAlign = "left";
            ctx.fillText(label, pad + 2, toY(v) - 3);
          });
        ctx.strokeStyle = "rgba(255,255,255,.12)";
        ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad); ctx.stroke();
        // the trace
        ctx.strokeStyle = "#7c8cf8"; ctx.lineWidth = 2.6; ctx.beginPath();
        trace.forEach((v, i) => {
          const x = pad + (i / DUR) * gw, y = toY(v);
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        });
        ctx.stroke();
        ctx.fillStyle = "#63757f"; ctx.font = "600 10px ui-monospace,monospace"; ctx.textAlign = "left";
        ctx.fillText("membrane potential (mV) vs time", pad + 2, pad - 10);
        const refr = (t - lastFire) < 42 && lastFire > -900;
        read.innerHTML = msg + (refr ? " <b>Refractory.</b>" : "");
        raf = requestAnimationFrame(draw);
      }
      draw(); return () => { cancelAnimationFrame(raf); cv.off(); };
    },

    /* ---- CARDIAC CYCLE: pressures + valves ------------------------------ */
    cardiac(host) {
      const cv = canvasHost(host, 0.52);
      let hr = 70, raf, t = 0;
      const ctrls = el("div", "les-ctls"); host.appendChild(ctrls);
      control(ctrls, "Heart rate", 40, 180, 70, 1, (v) => v + " bpm", (v) => { hr = v; });
      const read = el("div", "les-read"); host.appendChild(read);
      // pressures in mmHg across one normalised beat (0..1)
      function ventricle(p) {
        if (p < 0.06) return 8 + p / 0.06 * 4;
        if (p < 0.34) return 12 + Math.sin((p - 0.06) / 0.28 * Math.PI) * 108;   // systole
        // The sine has already carried the pressure back down to 12 by p = 0.34, so
        // relaxation has to CONTINUE from 12. The old branch restarted at 40, which
        // made the trace leap back up in the middle of relaxing. Ends at 4, where
        // passive filling picks it up.
        if (p < 0.46) return 12 - (p - 0.34) / 0.12 * 8;
        // Passive filling ends at 8, NOT 12 — because the first branch above is
        // atrial systole, which is what lifts the ventricle the rest of the way to
        // 12. Ending filling at 12 made the beat wrap discontinuously (12 at p=1
        // against 8 at p=0), so the trace jumped every time the marker crossed the
        // right edge of the plot.
        return 4 + (p - 0.46) / 0.54 * 4;                                        // filling
      }
      // Aortic pressure. This curve is NOT drawn independently of the ventricle —
      // it is built from it, because that is where its shape actually comes from:
      //   · before EJ0 the aortic valve is shut and the aorta is still bleeding
      //     down from the previous beat;
      //   · from EJ0 to the peak the valve is open, so the aorta simply IS the
      //     ventricle minus the small gradient across the open valve;
      //   · after the peak the elastic aorta holds its own pressure and runs off —
      //     the Windkessel effect. This is why the two traces separate at the
      //     dicrotic notch instead of the aorta following the ventricle down.
      // The runoff is a fast term (the incisura, as the valve snaps shut and blood
      // rebounds) plus a slow one (diastolic runoff through the arterioles).
      // EJ0 is chosen as the point where the ventricle crosses ~82 mmHg, so the
      // aorta joins continuously; the constants below land the notch at ~100 mmHg
      // and bring the runoff back to ~80 exactly where the next beat picks it up.
      const AO_EJ0 = 0.123, AO_PK = 0.20, AO_FLOOR = 78, AO_AMP = 38;
      function aoRunoff(q) {
        return AO_FLOOR + AO_AMP * (0.72 * Math.exp(-q * 11) + 0.28 * Math.exp(-q * 1.4));
      }
      function aorta(p) {
        // where the runoff has got to by the end of the beat — the value this
        // curve must start the NEXT beat from, or the trace jumps at the wrap
        const wrap = aoRunoff(1);
        if (p < AO_EJ0) return wrap + (AO_FLOOR - wrap) * (p / AO_EJ0);
        if (p < AO_PK) return ventricle(p) - 4;              // valve open
        return aoRunoff((p - AO_PK) / (1 - AO_PK));
      }
      // Atrial pressure. The valve states below are read off the pressure crossings,
      // so this curve is what decides them — and the invariant it has to respect is
      // that once the AV valves open, atrium and ventricle are ONE connected space:
      // the atrium rides just above the ventricle for the rest of the beat. An
      // independent line here gets overtaken by the filling ventricle within a few
      // percent of the beat and reads out as "AV valves shut" through nearly all of
      // diastole, when in life they are open for nearly all of it.
      const AV_GRAD = 1.2;   // mmHg the atrium leads the ventricle by — the gradient that drives filling
      const AV_SHUT = 0.06;  // atrial systole ends and isovolumetric contraction slams the AV valves
      // While the valve is OPEN the atrium is not an independent curve at all — it is
      // the ventricle plus the filling gradient, because the two are one connected
      // space. The a-wave is therefore a BUMP on top of that, not a free-standing
      // arch: written as a free arch it started at 8 while the previous beat had left
      // the atrium at 13.2, and handed over to the v-wave with a 4.6 mmHg step.
      // Vanishing at both ends is what makes the wrap and the handoff seamless.
      function aWave(p) { return Math.sin(p / AV_SHUT * Math.PI) * 4.2; }
      // Valve shut: the x-descent as the emptied atrium is pulled down by the
      // descending base, then the v-wave as venous return refills it against a
      // closed door. Starts exactly where the open phase left off.
      const AV_X = 6.5, AV_V = 13.5;
      function atriumShut(p) {
        const q = (p - AV_SHUT) / (0.46 - AV_SHUT);
        const start = ventricle(AV_SHUT) + AV_GRAD + aWave(AV_SHUT);
        if (q < 0.35) return start + (AV_X - start) * (q / 0.35);
        return AV_X + (AV_V - AV_X) * ((q - 0.35) / 0.65);
      }
      // The instant the falling ventricle drops back below the atrium and the valves
      // reopen. Scanned rather than hard-coded so it stays correct if either curve is
      // retuned — and because the scan finds the CROSSING, the two branches meet
      // there by construction.
      const AV_OPEN = (() => {
        for (let i = 68; i <= 200; i++) { const p = i / 200; if (ventricle(p) + AV_GRAD < atriumShut(p)) return p; }
        return 0.46;
      })();
      function atrium(p) {
        if (p < AV_SHUT) return ventricle(p) + AV_GRAD + aWave(p);   // atrial systole, valve still open
        if (p < AV_OPEN) return atriumShut(p);                        // valve shut: x-descent, then the v-wave
        return ventricle(p) + AV_GRAD;                                // valve open — the two run together
      }
      function draw() {
        t += reduced ? 0.02 : 0.0042 * (hr / 70);
        if (t > 1) t -= 1;
        const { ctx, W, H } = cv; ctx.clearRect(0, 0, W, H);
        const pad = 38, gw = W - pad - 14, gh = H - pad * 2;
        const toY = (v) => pad + gh - (v / 130) * gh;
        ctx.strokeStyle = "rgba(255,255,255,.10)"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad); ctx.lineTo(W - 14, H - pad); ctx.stroke();
        const series = [[ventricle, "#e8735e", "ventricle"], [aorta, "#f6c667", "aorta"], [atrium, "#38e0d8", "atrium"]];
        series.forEach(([fn, col]) => {
          ctx.strokeStyle = col; ctx.lineWidth = 2.4; ctx.beginPath();
          for (let i = 0; i <= 200; i++) {
            const p = i / 200, x = pad + p * gw, y = toY(fn(p));
            i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
          }
          ctx.stroke();
        });
        // the moving "now" marker
        const nx = pad + t * gw;
        ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(nx, pad); ctx.lineTo(nx, H - pad); ctx.stroke();
        series.forEach(([fn, col]) => {
          ctx.fillStyle = col; ctx.beginPath(); ctx.arc(nx, toY(fn(t)), 4.5, 0, 6.28); ctx.fill();
        });
        // legend
        ctx.font = "600 10px ui-monospace,monospace"; ctx.textAlign = "left";
        series.forEach(([, col, label], i) => {
          ctx.fillStyle = col; ctx.fillText(label, pad + 4 + i * 70, pad - 8);
        });
        // valve state, derived from the pressure crossings themselves
        const v = ventricle(t), a = aorta(t), at = atrium(t);
        const avOpen = at > v, semiOpen = v > a;
        const phase = semiOpen ? "Ventricular systole — ejection"
          : (v > 14 && !semiOpen) ? "Isovolumetric contraction / relaxation"
          : avOpen ? "Diastole — ventricular filling" : "Diastole";
        read.innerHTML = `<b>${phase}</b> · AV valves <b>${avOpen ? "open" : "shut"}</b> · semilunar <b>${semiOpen ? "open" : "shut"}</b>` +
          ` · output ≈ <b>${(hr * 70 / 1000).toFixed(1)} L/min</b>` +
          (hr > 150 ? " — diastole is now so short that filling suffers." : "");
        raf = requestAnimationFrame(draw);
      }
      draw(); return () => { cancelAnimationFrame(raf); cv.off(); };
    },
  };

  // ── go ────────────────────────────────────────────────────────────────────────
  route();
})();

<script id="atmo-js">
/* ============================================================================
   BIOLOGY ENTELLOQ — THE LIVING FIELD.

   Physics Entelloq puts a sheet of spacetime behind the product and bends it
   around the cursor. This is the biological answer to that, and it is not the
   same idea in different colours: matter is passive and gets curved, whereas
   tissue is ALIVE and reaches toward what it wants. So the field here is a thick
   section of living tissue seen down a microscope, and the cursor is a nutrient
   source. Cells near it swell, their membranes brighten, and the capillary
   network grows toward it — chemotaxis, the oldest behaviour there is.

   Four things are happening at once in the shader:
     · a Worley cell field (membranes are the F2-F1 ridge — the real thing under
       phase contrast) in two parallax layers, so the section has thickness
     · a domain warp driven by slow fbm, because no real tissue is on a grid
     · ridged fbm capillaries that bias their flow toward the cursor
     · a breath — everything respires at about 7 cycles a minute, which is why
       it reads as alive rather than as a screensaver on a loop

   SELF-INSTALLING. Dropping this one <script> onto a page is the whole install:
   it makes its own canvas, injects its own CSS, picks its colour from
   <body data-page>, and follows the light/dark toggle. It never needs markup.
   ========================================================================== */
(function () {
  "use strict";
  if (window.BIOQ_ATMO) return;                       // idempotent: safe to double-inject

  // Inside the unified app shell each section loads in an iframe with ?embed=1.
  // The shell already has a field; a second one per iframe would mean two WebGL
  // contexts fighting for the GPU and a visible seam where the two tissues meet.
  // So the embedded page renders none of its own and goes transparent instead,
  // letting the shell's single continuous field show through — which is also why
  // navigating between sections never interrupts it.
  try {
    if (new URLSearchParams(location.search).get("embed")) {
      var t = document.createElement("style");
      t.id = "atmo-embed";
      t.textContent = "html,body{background:transparent!important}.bg-veil{display:none!important}";
      (document.head || document.documentElement).appendChild(t);
      window.BIOQ_ATMO = { theme: function () {}, setSection: function () {}, mouse: null, mode: "embedded" };
      return;
    }
  } catch (e) {}

  /* --- where the colour comes from -------------------------------------- */
  // Each pillar gets its own biology, and the hues deliberately match the `tc`
  // accent the app shell already assigns that view — so the field is the same
  // colour as the section you are standing in rather than a second, competing
  // palette. Intensity is how ALIVE the field looks: the Lab runs hot, Me runs quiet.
  var SECTIONS = {
    home:     ["#34d399", 0.44],   // em     — chlorophyll
    learn:    ["#34d399", 0.52],   // em
    lessons:  ["#38e0d8", 0.50],   // cy
    reason:   ["#8b5cf6", 0.48],   // violet — the colour of thinking
    labs:     ["#f6c667", 0.52],   // amber  — a bench lamp
    solve:    ["#7c8cf8", 0.48],   // indigo
    explore:  ["#38e0d8", 0.58],   // cy     — open water
    me:       ["#c9a86a", 0.34],   // quiet, warm, low
    about:    ["#34d399", 0.46],   // em
    lab:      ["#fb7185", 0.64],   // rose   — an opened body, and the field runs hot
    universe: ["#38e0d8", 0.60]    // cy
  };

  var reduced = false;
  try { reduced = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  var STILL = reduced || /[?&#](still|print)=?1?/.test(location.search + location.hash);

  /* --- install ----------------------------------------------------------- */
  var css = document.createElement("style");
  css.id = "atmo-css";
  css.textContent =
    // z-index:-1, NOT 0. A positioned element at z-index:0 paints ABOVE ordinary
    // in-flow block content, so the field would cover the page. Negative z puts it
    // between the root background and everything else, which means not one existing
    // element needs its position or stacking touched — and the product's fixed nav
    // (position:fixed;z-index:60) keeps working exactly as before.
    "#atmo{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;" +
      "opacity:0;transition:opacity 1.2s cubic-bezier(.22,1,.36,1);display:block}" +
    "#atmo.lit{opacity:.78}" +
    // In light mode the same field reads as a stained section on a white slide, so
    // it stays — but fainter, because ink on paper is a quieter medium.
    "html[data-theme=\"light\"] #atmo.lit{opacity:.42}" +
    // The pages paint --bg on BOTH html and body; body's copy would hide a
    // negative-z child, so hand the background to the root alone. --bg is a themed
    // custom property, so this keeps following the light/dark toggle for free.
    "html{background:var(--bg,#04070a)}body{background:transparent!important}";

  var cv = document.createElement("canvas");
  cv.id = "atmo";

  // NOTE: attach() is *declared* here but deliberately not *called* until the very
  // bottom of this module. It reaches into cur/tgt/M/FS/VS, all of which are `var`
  // bindings that are hoisted but still undefined at this point in the file —
  // calling it here would throw on the first property write and silently leave the
  // page with no field at all.
  function attach() {
    if (!document.body) return setTimeout(attach, 16);
    document.body.insertBefore(cv, document.body.firstChild);
    // The class is what fades the field in, and it must land on a LATER frame than
    // the insert or the CSS transition has nothing to transition from. rAF is the
    // usual way to get that, but rAF does not run at all in a background tab — so a
    // page that loads hidden would sit at opacity 0. The timer is the backstop;
    // adding the class twice costs nothing.
    function lit() { cv.classList.add("lit"); }
    requestAnimationFrame(lit);
    setTimeout(lit, 80);
    boot();
  }

  /* --- state ------------------------------------------------------------- */
  function hexRGB(h) {
    h = String(h).replace("#", "");
    return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
  }
  var cur = { r: 0.20, g: 0.83, b: 0.60, in: 0.44, lt: 0 };
  var tgt = { r: 0.20, g: 0.83, b: 0.60, in: 0.44, lt: 0 };
  var M = { x: innerWidth / 2, y: innerHeight / 2, tx: innerWidth / 2, ty: innerHeight / 2, live: 0, tlive: 0 };

  addEventListener("pointermove", function (e) {
    M.tx = e.clientX; M.ty = e.clientY; M.tlive = 1;
  }, { passive: true });
  // A pointer that has left should stop feeding the tissue, or the glow sits there
  // forever on a page nobody is touching. pointerleave does not bubble, so it has
  // to be bound to the root element rather than to window; mouseout with a null
  // relatedTarget is the belt-and-braces case for leaving through the chrome.
  document.documentElement.addEventListener("pointerleave", function () { M.tlive = 0; }, { passive: true });
  addEventListener("mouseout", function (e) { if (!e.relatedTarget) M.tlive = 0; }, { passive: true });
  addEventListener("blur", function () { M.tlive = 0; });
  // Touch has no hover: without this the glow would stay wherever the last tap
  // landed, permanently, on every phone.
  addEventListener("pointerup", function (e) {
    if (e.pointerType !== "mouse") M.tlive = 0;
  }, { passive: true });

  function theme(rgb, intensity) {
    tgt.r = rgb[0]; tgt.g = rgb[1]; tgt.b = rgb[2];
    if (typeof intensity === "number") tgt.in = intensity;
  }
  function setSection(key) {
    var s = SECTIONS[key] || SECTIONS.home;
    theme(hexRGB(s[0]), s[1]);
    nudge();                             // navigating must restain the field even in STILL mode
  }
  // repaint is filled in by whichever renderer boots. In STILL mode (reduced
  // motion, or ?still=1) exactly one frame is ever drawn, so without this a reader
  // who switches to light mode would be left looking at the dark field forever.
  var repaint = null;
  function nudge() {
    if (!STILL || !repaint) return;      // the animated path picks the change up on its own
    for (var i = 0; i < 60; i++) ease(); // settle the eased colour, then draw the one frame
    repaint(0);
  }
  function readTheme() {
    var next = (document.documentElement.getAttribute("data-theme") === "light") ? 1 : 0;
    if (next === tgt.lt) return;
    tgt.lt = next;
    nudge();
  }

  function ease() {
    cur.r += (tgt.r - cur.r) * 0.035; cur.g += (tgt.g - cur.g) * 0.035;
    cur.b += (tgt.b - cur.b) * 0.035; cur.in += (tgt.in - cur.in) * 0.035;
    cur.lt += (tgt.lt - cur.lt) * 0.08;
    M.x += (M.tx - M.x) * 0.075; M.y += (M.ty - M.y) * 0.075;
    M.live += (M.tlive - M.live) * 0.04;
  }

  /* --- the field --------------------------------------------------------- */
  var FS = [
    "precision mediump float;",
    "uniform vec2 uRes;uniform float uT;uniform vec2 uM;uniform vec3 uC;uniform float uIn;uniform float uLive;uniform float uLight;",

    "float h1(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}",
    "vec2 h2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}",
    "float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);",
    " float a=h1(i),b=h1(i+vec2(1,0)),c=h1(i+vec2(0,1)),d=h1(i+vec2(1,1));",
    " return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}",
    "float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*vn(p);p*=2.07;a*=.5;}return v;}",
    // Ridged noise gives threads instead of blobs — this is what makes a capillary
    // look like a vessel and not like a cloud.
    "float ridge(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*(1.-abs(vn(p)*2.-1.));p*=2.11;a*=.5;}return v;}",

    // Worley. Returns (F1, F2-F1, cell id). Every nucleus orbits its own cell on a
    // slow private path, so no two cells ever pulse together.
    "vec3 cells(vec2 p,float t){vec2 n=floor(p),f=fract(p);",
    " float f1=8.,f2=8.;vec2 id=vec2(0.);",
    " for(int j=-1;j<=1;j++){for(int i=-1;i<=1;i++){",
    "  vec2 g=vec2(float(i),float(j));vec2 o=h2(n+g);",
    "  o=.5+.40*sin(t*.32+6.2831*o);",
    "  float d=length(g+o-f);",
    "  if(d<f1){f2=f1;f1=d;id=n+g;}else if(d<f2){f2=d;}",
    " }}",
    " return vec3(f1,f2-f1,h1(id));}",

    "void main(){",
    " vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;",
    " vec2 m=(uM-.5*uRes)/uRes.y;m.y*=-1.;",
    " float t=uT;",
    // ~7 breaths a minute. Slow enough that you feel it rather than watch it.
    " float breath=.5+.5*sin(t*.72);",

    // Chemotaxis. Everything below is stronger the closer it is to the cursor,
    // and uLive fades the whole effect out when the pointer leaves.
    " float rm=length(uv-m);",
    // Tight. A wide gradient turns the whole page into a lamp; the point is a
    // local response in the tissue the pointer is actually over, so the falloff
    // is effectively gone by a third of the screen height.
    " float food=exp(-rm*rm*7.5)*uLive;",

    // Domain warp — the reason this reads as tissue and not as a tiling.
    " vec2 w=uv+vec2(fbm(uv*1.5+t*.05),fbm(uv*1.5-t*.04+11.3))*.34;",
    // Tissue swells toward the food source: cells near the cursor get physically
    // bigger by shrinking the sampling scale there.
    " float swell=1.-food*.30;",

    // Two layers at different depths. The far one drifts slower and sits dimmer,
    // which is what gives a flat quad the thickness of a real section.
    " vec3 c1=cells(w*3.4*swell+vec2(t*.020,-t*.014),t);",
    " vec3 c2=cells(w*6.9*swell+vec2(-t*.030,t*.023)+31.7,t*1.25);",

    // Membrane = the F2-F1 ridge. This is the single most biological line there is.
    " float mem1=1.-smoothstep(.0,.085,c1.y);",
    " float mem2=1.-smoothstep(.0,.060,c2.y);",
    // Cytoplasm: each cell tinted by its own id, so the field has variation
    // rather than one flat wash.
    " float cyto=(.35+.65*c1.z)*(1.-smoothstep(.15,.85,c1.x));",
    // Nuclei, breathing slightly out of phase per cell.
    " float nuc=smoothstep(.135+.02*sin(t*.6+c1.z*31.),.0,c1.x)*(.55+.45*c1.z);",

    // Capillaries, warped again so they wander, and pulled toward the cursor so
    // the network visibly grows in that direction.
    " vec2 vp=w*2.3+vec2(t*.035,-t*.028)-normalize(uv-m+1e-4)*food*.55;",
    " float vas=ridge(vp);",
    " vas=pow(max(vas-.62,0.)*2.6,2.0);",

    // Motes — organelles and spores adrift in the medium, the counterpart to the
    // stars in the physics field. They rise, because everything in a fluid does.
    " vec2 sp=w*17.0+vec2(0.,-t*.10);vec2 si=floor(sp);vec2 sf=fract(sp)-.5;",
    " float sv=h1(si);",
    " float mote=step(.972,sv)*smoothstep(.055,0.,length(sf-(h2(si)-.5)*.6))*(.55+.45*sin(t*2.1+sv*44.));",

    // --- compose ---
    " float lum=(.030+.055*breath)*(.55+uIn);",
    " vec3 col=vec3(.012,.026,.034)*(1.-uLight);",
    " col+=uC*cyto*lum*1.35;",
    " col+=uC*mem1*(.055+uIn*.13)*(.75+.25*breath);",
    " col+=mix(uC,vec3(1.),.35)*mem2*(.022+uIn*.055);",
    " col+=mix(uC,vec3(1.),.55)*nuc*(.020+uIn*.048);",
    " col+=mix(uC,vec3(1.,.55,.52),.30)*vas*(.055+uIn*.14);",
    " col+=vec3(.85,.95,1.)*mote*.55;",
    // The food source itself: a soft bloom, plus a brightening of whatever tissue
    // is under it, so the cursor lights the section rather than floating over it.
    " col+=uC*food*(.085+uIn*.15);",
    " col*=1.+food*.34;",
    // Depth: the section is thickest and best-lit in the middle of the field.
    " col*=1.-.38*smoothstep(.55,1.35,length(uv));",

    // Light mode: invert the physics, not the palette. On a slide the stain
    // ABSORBS — so a green stain removes red and blue and leaves green, which
    // means the structures subtract (1-uC), not uC. Subtracting uC would print
    // the complement and give a magenta negative of the tissue.
    " float dens=cyto*.30+mem1*1.05+mem2*.42+nuc*.62+vas*.95;",
    " dens=min(dens*(.46+uIn*.60)*(1.+food*.45),1.25);",
    " vec3 ink=vec3(1.)-(vec3(1.)-uC)*dens*.80-vec3(.05)*dens;",
    // Illumination falls off toward the edge of the coverslip.
    " ink=mix(ink,vec3(1.),.22*smoothstep(.55,1.4,length(uv)));",
    " col=mix(col,ink,uLight);",

  var VS = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";

  function boot() {
    readTheme();

    try {
      new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    } catch (e) {}

    setSection((document.body && document.body.getAttribute("data-page")) || "home");
    for (var i = 0; i < 40; i++) ease();     // start already at the right colour, no fade-in from green

    var gl = null;
    try {
      gl = cv.getContext("webgl", { alpha: true, antialias: false, depth: false, stencil: false, powerPreference: "low-power" })
        || cv.getContext("experimental-webgl", { alpha: true, antialias: false, depth: false });
    } catch (e) {}

    function sh(ty, src) {
      var o = gl.createShader(ty); gl.shaderSource(o, src); gl.compileShader(o);
      if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o) || "compile");
      return o;
    }
    var prog;
    try {
      prog = gl.createProgram();
      gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog) || "link");
    } catch (e) { return fallback(); }

    gl.useProgram(prog);
    var buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    var lp = gl.getAttribLocation(prog, "p");
    gl.enableVertexAttribArray(lp);
    gl.vertexAttribPointer(lp, 2, gl.FLOAT, false, 0, 0);

    var uRes = gl.getUniformLocation(prog, "uRes"), uT = gl.getUniformLocation(prog, "uT"),
        uM = gl.getUniformLocation(prog, "uM"), uC = gl.getUniformLocation(prog, "uC"),
        uIn = gl.getUniformLocation(prog, "uIn"), uLive = gl.getUniformLocation(prog, "uLive"),
        uLight = gl.getUniformLocation(prog, "uLight");

    // A full-screen procedural field is fill-rate bound, so resolution is the one
    // dial that matters. 1.25x is enough for the membranes to stay crisp and cheap
    // enough that an integrated GPU never notices.
    var dpr = Math.min(devicePixelRatio || 1, 1.25);
    // A page can boot while its tab is hidden or its pane is not compositing, and
    // then innerWidth is 0 — sizing to that leaves a 1x1 canvas which never
    // recovers, because becoming visible does not fire a resize event. Fall back
    // through the layout box to a sane default so the field is always drawable.
    function vw() { return innerWidth || document.documentElement.clientWidth || cv.clientWidth || 1280; }
    function vh() { return innerHeight || document.documentElement.clientHeight || cv.clientHeight || 800; }
    function size() {
      var w = Math.max(1, Math.round(vw() * dpr)), h = Math.max(1, Math.round(vh() * dpr));
      if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; gl.viewport(0, 0, w, h); }
    }
    addEventListener("resize", size); size();

    var raf = null, t0 = 0;
    // draw() is the whole render and nothing else; frame() is draw() plus the
    // scheduling. Keeping them apart is what lets _tick() below render on demand
    // without quietly queueing a second rAF alongside the running loop.
    function draw(ms) {
      ease(); size();
      if (!t0) t0 = ms || 0;
      gl.uniform2f(uRes, cv.width, cv.height);
      gl.uniform1f(uT, ((ms || 0) - t0) * 0.001);
      var s = cv.width / vw();
      gl.uniform2f(uM, M.x * s, (vh() - M.y) * s);
      gl.uniform3f(uC, cur.r, cur.g, cur.b);
      gl.uniform1f(uIn, cur.in);
      gl.uniform1f(uLive, M.live);
      gl.uniform1f(uLight, cur.lt);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    function frame(ms) {
      raf = null;
      draw(ms);
      if (!STILL) raf = requestAnimationFrame(frame);
    }
    repaint = draw;
    if (STILL) draw(0); else raf = requestAnimationFrame(frame);

    // A field nobody can see must not cost a frame.
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = null; } }
      // Coming back from hidden also re-measures, because the viewport may have
      // been 0 the whole time the tab was in the background.
      else if (!raf && !STILL) { size(); raf = requestAnimationFrame(frame); }
    });

    // _tick renders exactly one frame on demand. rAF is throttled to nothing in a
    // hidden tab, so this is the only way to prove the field actually draws when
    // the page is not on screen — which is precisely when it needs proving.
    window.BIOQ_ATMO = { theme: theme, setSection: setSection, mouse: M, mode: "webgl", _tick: draw };
  }

  /* --- fallback ---------------------------------------------------------- */
  // No WebGL. Draw the same idea in 2D: drifting cells with membranes and nuclei,
  // and a nutrient glow at the cursor. Fewer cells, no capillaries, same product.
  function fallback() {
    var ctx = cv.getContext("2d");
    if (!ctx) { window.BIOQ_ATMO = { theme: theme, setSection: setSection, mouse: M, mode: "none" }; return; }
    var dpr = Math.min(devicePixelRatio || 1, 1.5), W = 0, H = 0, pop = [];
    function size() {
      W = innerWidth; H = innerHeight;
      cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.max(10, Math.min(30, Math.round(W * H / 46000)));
      pop = [];
      for (var i = 0; i < n; i++) pop.push({
        x: Math.random() * W, y: Math.random() * H, r: 42 + Math.random() * 78,
        vx: (Math.random() - 0.5) * 0.13, vy: (Math.random() - 0.5) * 0.13, ph: Math.random() * 6.283
      });
    }
    size(); addEventListener("resize", size);

    var raf = null, t = 0;
    function rgba(a) { return "rgba(" + (cur.r * 255 | 0) + "," + (cur.g * 255 | 0) + "," + (cur.b * 255 | 0) + "," + a + ")"; }
    function frame() {
      raf = null; ease(); t += 0.016;
      var light = cur.lt > 0.5;
      ctx.clearRect(0, 0, W, H);
      var glow = ctx.createRadialGradient(M.x, M.y, 0, M.x, M.y, 340);
      glow.addColorStop(0, rgba((light ? 0.10 : 0.13) * M.live)); glow.addColorStop(1, rgba(0));
      ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
      for (var i = 0; i < pop.length; i++) {
        var c = pop[i];
        c.x += c.vx; c.y += c.vy;
        if (c.x < -140) c.x = W + 140; if (c.x > W + 140) c.x = -140;
        if (c.y < -140) c.y = H + 140; if (c.y > H + 140) c.y = -140;
        // Chemotaxis, cheaply: a cell near the cursor swells.
        var d = Math.hypot(c.x - M.x, c.y - M.y);
        var food = Math.exp(-(d * d) / 260000) * M.live;
        var r = c.r * (1 + Math.sin(t * 0.62 + c.ph) * 0.05 + food * 0.20);
        var g = ctx.createRadialGradient(c.x, c.y, r * 0.2, c.x, c.y, r);
        g.addColorStop(0, rgba((light ? 0.030 : 0.052) * (0.6 + cur.in) * (1 + food))); g.addColorStop(1, rgba(0));
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, 6.283); ctx.fill();
        ctx.strokeStyle = rgba((light ? 0.055 : 0.085) * (1 + food * 1.4)); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, 6.283); ctx.stroke();
        ctx.fillStyle = rgba((light ? 0.045 : 0.062) * (1 + food));
        ctx.beginPath(); ctx.arc(c.x + r * 0.11, c.y - r * 0.07, r * 0.24, 0, 6.283); ctx.fill();
      }
      if (!STILL) raf = requestAnimationFrame(frame);
    }
    repaint = frame;
    if (STILL) { for (var k = 0; k < 40; k++) ease(); frame(); } else raf = requestAnimationFrame(frame);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) { if (raf) { cancelAnimationFrame(raf); raf = null; } }
      else if (!raf && !STILL) raf = requestAnimationFrame(frame);
    });

    window.BIOQ_ATMO = { theme: theme, setSection: setSection, mouse: M, mode: "2d" };
  }

  /* --- go ---------------------------------------------------------------- */
  // Last line on purpose: everything above is now assigned, so boot() can read it.
  attach();
})();

</script>
<script id="auth-js">

   than the feature does: an account that looks like it is backing your work up,
   and isn't, is worse than no account at all.

  function user() {

  }

  var subs = [];
  function emit() { var u = user(); subs.forEach(function (f) { try { f(u); } catch (e) {} }); render(); }
  function save(u) { ls(K_USER, JSON.stringify(u)); emit(); }

  /* --- the token ---------------------------------------------------------- */
  // A Google ID token is a JWT: header.payload.signature. Only the payload is
  // read, and only for a display name and picture. It is NEVER sent anywhere —
  // there is no server to send it to — so it is not stored either.
  function decode(tok) {
    try {
      var p = tok.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
      return JSON.parse(decodeURIComponent(escape(atob(p))));
    } catch (e) { return null; }
  }

    var p = resp && resp.credential ? decode(resp.credential) : null;
    if (!p || !p.email) return;
    save({ n: p.name || p.email.split("@")[0], e: p.email, pic: p.picture || "", at: Date.now() });
    close();
  }

  var ready = false, loading = false, pending = [];
  function load(cb) {
    if (!cid() || FILE) return;
    if (ready) { if (cb) cb(); return; }
    if (cb) pending.push(cb);
    if (loading) return;
    loading = true;
    var s = document.createElement("script");
    s.src = GIS; s.async = true; s.defer = true;
    s.onload = function () {
      try {
        google.accounts.id.initialize({
          client_id: cid(), callback: onCred,
          auto_select: false, cancel_on_tap_outside: true,
        });
        ready = true;
        pending.splice(0).forEach(function (f) { try { f(); } catch (e) {} });
      } catch (e) { loading = false; }
    };
    s.onerror = function () { loading = false; note("Could not reach Google. Check the connection and try again."); };
    document.head.appendChild(s);
  }

  function signOut() {
    try { if (ready && window.google) google.accounts.id.disableAutoSelect(); } catch (e) {}
    ls(K_USER, null);
    emit();
  }

  /* --- styles ------------------------------------------------------------- */
  var css = document.createElement("style");
  css.id = "auth-css";
  css.textContent =
    ".bq-acct{position:relative;display:flex}" +
    ".bq-acct>button{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:11px;" +
      "border:1px solid var(--line,rgba(255,255,255,.08));color:var(--dim,#9fb2bc);cursor:pointer;" +
      "font:inherit;font-size:13px;transition:color .2s,border-color .2s,background .2s;text-align:left}" +
    ".bq-acct>button:hover{color:var(--ink,#eaf2f5);border-color:var(--hair,rgba(255,255,255,.12))}" +
    ".bq-avatar{width:22px;height:22px;border-radius:50%;flex:none;object-fit:cover;" +
      "background:color-mix(in srgb,var(--em,#34d399) 22%,transparent);display:grid;place-items:center;" +
      "font-size:10px;font-weight:700;color:var(--em,#34d399)}" +
    ".bq-acct .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}" +
    // Anchored to the RIGHT edge, not the left. This control lives at the right end
    // of a top bar on some pages and full-width in a sidebar on others; left:0 sent
    // the panel straight off the side of a phone (measured: 126px of horizontal

    // it stays inside on both, and the width is clamped to the viewport rather than
    // to a vw fraction so the gutters survive at any size.

      "width:min(300px,calc(100vw - 28px));max-width:calc(100vw - 28px);z-index:400;" +
      "border:1px solid var(--line,rgba(255,255,255,.1));border-radius:15px;padding:15px;" +
      "background:var(--panel,#0b1117);box-shadow:0 22px 60px -18px rgba(0,0,0,.7);" +
      "opacity:0;transform:translateY(6px) scale(.97);pointer-events:none;" +
      "transition:opacity .18s,transform .18s cubic-bezier(.22,1,.36,1)}" +
    ".bq-pop{visibility:hidden}" +
    ".bq-pop.on{opacity:1;transform:none;pointer-events:auto;visibility:visible}" +
    // visibility cannot animate, but it CAN be delayed — so the closing fade still
    // plays, and the panel only leaves the tab order once it is actually gone.
    ".bq-pop{transition:opacity .18s,transform .18s cubic-bezier(.22,1,.36,1),visibility 0s .18s}" +
    ".bq-pop.on{transition:opacity .18s,transform .18s cubic-bezier(.22,1,.36,1),visibility 0s}" +
    ".bq-pop h4{font-size:14px;font-weight:700;margin:0 0 4px;color:var(--ink,#eaf2f5)}" +
    ".bq-pop p{font-size:12.5px;line-height:1.55;color:var(--dim,#9fb2bc);margin:0 0 12px}" +

    ".bq-act{display:block;width:100%;padding:9px;border-radius:10px;border:1px solid var(--line,rgba(255,255,255,.1));" +
