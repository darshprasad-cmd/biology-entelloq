      });

      renderLanes();
      renderSamples();
      syncSliders();
      tell("Load a well, set the field, and run. Then click a band — the ladder becomes a ruler and the unknowns get a size.");

      var tick = ticker(function (dt) {
        if (G.running) {
          G.prog = clamp(G.prog + dt / 3.4, 0, 1);
          G.dirty = true;
          if (G.prog >= 1) finishRun();
        }
        if (G.dirty) { draw(); G.dirty = false; }
      });

      return {
        dispose: function () {
          tick.dispose();
          canvas.cv.removeEventListener("click", hit);
          canvas.dispose();
          pal.dispose();
          css.dispose();
          host.innerHTML = "";
        }
      };
    }
  });

  /* ======================================================================
     LAB 3 — PCR THERMOCYCLER
     ====================================================================== */

  var PCR = {
    TM: 61,          /* primer pair melting temperature, °C */
    TOPT: 57,        /* rule of thumb: anneal 3–5 °C below the lower Tm */
    AMPLICON: 1000,  /* bp */
    N0: 1e4,         /* starting template copies */
    NMAX: 1.2e12,    /* dNTP/primer-limited ceiling for a 50 µL reaction */
    T_DEN: 30, T_ANN: 30, T_EXT: 30  /* seconds per segment */
  };

  /* ---- the efficiency model (each term is a real, separate failure mode) ---- */
  function effDenature(Td) {          /* incomplete strand separation below ~92 °C */
    return 1 / (1 + Math.exp(-(Td - 91.5) / 1.0));
  }
  function effAnneal(Ta) {            /* above Tm the primers simply do not bind */
    var dev = Ta - PCR.TOPT;
    if (dev > 0) return Math.exp(-Math.pow(dev / 3.4, 2));
    return Math.exp(-Math.pow(dev / 16, 2));
  }
  function specificity(Ta) {          /* below optimum, primers bind partial matches too */
    var dev = Ta - PCR.TOPT;
    if (dev >= 0) return 0.98;
    return clamp(Math.exp(-Math.pow(dev / 8.5, 2)), 0.02, 0.98);
  }
  function taqRate(Te) {              /* nucleotides per second */
    var r = 65 * Math.exp(-Math.pow((Te - 74) / 10, 2));
    if (Te > 78) r *= Math.exp(-Math.pow((Te - 78) / 6, 2));
    return r;
  }
  function effExtend(Te) {            /* did it finish 1000 nt in 30 s? */
    return clamp(taqRate(Te) * PCR.T_EXT / PCR.AMPLICON, 0, 1);
  }
  function taqHalfLife(Td) {          /* minutes — ~40 min at 95 °C, minutes at 98 °C */
    return 40 * Math.pow(2, -(Td - 95) / 1.35);
  }

  function simulate(Td, Ta, Te, cycles) {
    var eD = effDenature(Td), eA = effAnneal(Ta), eE = effExtend(Te), sp = specificity(Ta);
    var spec = PCR.N0;
    var ns = PCR.N0 * (1 - sp) * 0.6;      /* mispriming seeds a competing product */
    var act = 1;
    var hist = [{ c: 0, spec: spec, ns: ns, eff: 0 }];
    for (var c = 1; c <= cycles; c++) {
      act *= Math.pow(0.5, (PCR.T_DEN / 60) / taqHalfLife(Td));
      var total = spec + ns;
      var plateau = clamp(1 - total / PCR.NMAX, 0, 1);
      var base = 0.97 * eD * eA * eE * act * plateau;
      var eSpec = base * sp;
      var eNs = base * (1 - 0.35 * sp);
      spec = spec * (1 + eSpec);
      ns = ns * (1 + eNs);
      hist.push({ c: c, spec: spec, ns: ns, eff: eSpec });
    }
    return {
      hist: hist, spec: spec, ns: ns,
      eD: eD, eA: eA, eE: eE, sp: sp, act: act,
      meanEff: Math.pow(spec / PCR.N0, 1 / Math.max(1, cycles)) - 1
    };
  }
  function massNg(copies, bp) {
    return copies / 6.02214076e23 * (bp * 650) * 1e9;
  }

  LABS.register("pcr", {
    title: "PCR — the thermocycler",
    tag: "Molecular bench",
    color: "#f6c667",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M3 16h3l2-9 3 13 2.5-8 2 4h5.5"/><path d="M4 20h16"/></svg>',
    blurb: "Set the three temperatures and the cycle count, then run it. Copies double every cycle until the reagents " +
           "run out — and an annealing temperature just five degrees too high costs you almost the entire product.",

    build: function (host) {
      var css = styleTag("mlx-pcr-css",
        ".mlxp .mlx-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}" +
        ".mlxp .mlx-cell{border:1px solid var(--line);border-radius:11px;padding:10px 12px}" +
        ".mlxp .mlx-cell .k{font-family:" + MONO + ";font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}" +
        ".mlxp .mlx-cell .v{font-family:" + MONO + ";font-size:16px;font-weight:700;color:var(--ink);margin-top:3px}" +
        ".mlxp .mlx-cell .s{font-size:11px;color:var(--dim);margin-top:2px}" +
        ".mlxp .mlx-hint{font-size:11.5px;color:var(--faint);font-family:" + MONO + "}" +
        ".mlxp .mlx-hint.warn{color:var(--amber)}"
      );

      host.innerHTML =
        '<div class="bx mlxp">' +
          '<div class="bx-view" id="mlxpView"></div>' +
          '<div class="bx-side">' +
            '<div class="bx-grp"><label>Denature <span class="bx-val" id="mlxpDv"></span></label>' +
              '<input class="bx-slider" id="mlxpD" type="range" min="86" max="99" step="0.5" value="95" aria-label="Denaturation temperature">' +
              '<div class="mlx-hint" id="mlxpDh"></div></div>' +
            '<div class="bx-grp"><label>Anneal <span class="bx-val" id="mlxpAv"></span></label>' +
              '<input class="bx-slider" id="mlxpA" type="range" min="42" max="72" step="0.5" value="57" aria-label="Annealing temperature">' +
              '<div class="mlx-hint" id="mlxpAh"></div></div>' +
            '<div class="bx-grp"><label>Extend <span class="bx-val" id="mlxpEv"></span></label>' +
              '<input class="bx-slider" id="mlxpE" type="range" min="55" max="84" step="0.5" value="72" aria-label="Extension temperature">' +
              '<div class="mlx-hint" id="mlxpEh"></div></div>' +
            '<div class="bx-grp"><label>Cycles <span class="bx-val" id="mlxpCv"></span></label>' +
              '<input class="bx-slider" id="mlxpC" type="range" min="5" max="45" step="1" value="30" aria-label="Number of cycles"></div>' +
            '<div class="bx-grp"><label>Speed</label><div id="mlxpSpeed"></div></div>' +
            '<div class="bx-chips">' +
              '<button type="button" class="bx-btn pri" id="mlxpRun">Run program</button>' +
              '<button type="button" class="bx-btn" id="mlxpStd">Standard program</button></div>' +
            '<div class="bx-read" id="mlxpRead"></div>' +
            '<div class="mlx-grid" id="mlxpOut"></div>' +
          '</div>' +
        '</div>' +
        '<div class="bx-verdict" id="mlxpSay"></div>' +
        '<p class="bx-note" style="margin-top:14px"><b>What this shows.</b> PCR is a chain reaction: every product strand is a ' +
        'template next cycle, so copies go as 2ⁿ and thirty cycles is a billion-fold in theory. Real reactions never reach ' +
        'that. Each cycle multiplies by (1 + E) where E depends on all three temperatures and on how much Taq is left alive, ' +
        'and the curve flattens the moment primers and dNTPs run short. Push the annealing temperature above the primers’ ' +
        'melting point and E collapses to nothing; drop it far below and the primers start binding sequences they were never ' +
        'meant to — you still get a tube full of DNA, just not the DNA you wanted.</p>';

      var view = host.querySelector("#mlxpView");
      var sD = host.querySelector("#mlxpD"), sA = host.querySelector("#mlxpA"),
          sE = host.querySelector("#mlxpE"), sC = host.querySelector("#mlxpC");
      var vD = host.querySelector("#mlxpDv"), vA = host.querySelector("#mlxpAv"),
          vE = host.querySelector("#mlxpEv"), vC = host.querySelector("#mlxpCv");
      var hD = host.querySelector("#mlxpDh"), hA = host.querySelector("#mlxpAh"), hE = host.querySelector("#mlxpEh");
      var elRead = host.querySelector("#mlxpRead"), elOut = host.querySelector("#mlxpOut"),
          elSay = host.querySelector("#mlxpSay"), elSpeed = host.querySelector("#mlxpSpeed");

      var P = {
        Td: 95, Ta: 57, Te: 72, cycles: 30,
        speed: "1",
        running: false,
        cyc: 0,           /* cycles completed */
        phase: 0,         /* 0 denature, 1 anneal, 2 extend */
        phaseT: 0,        /* 0..1 within the phase */
        sim: null,
        done: false,
        dirty: true
      };
      var SPEEDS = { "1": 0.36, "3": 0.12, "i": 0 };  /* seconds of wall clock per cycle */

      function segTemp() {
        return P.phase === 0 ? P.Td : P.phase === 1 ? P.Ta : P.Te;
      }
      function blockTemp() {
        /* ramp between segments so the trace looks like a real block (~3 °C/s) */
        var prev = P.phase === 0 ? P.Te : P.phase === 1 ? P.Td : P.Ta;
        var ramp = clamp(P.phaseT / 0.28, 0, 1);
        return lerp(prev, segTemp(), ease(ramp));
      }

      function hints() {
        var dev = P.Ta - PCR.TM;
        hA.textContent = "primer pair Tm " + PCR.TM + " °C · " +
          (P.Ta > PCR.TM ? "you are " + (P.Ta - PCR.TM).toFixed(1) + " °C ABOVE Tm"
            : P.Ta > PCR.TOPT - 4 ? "in the sweet spot (Tm − 3 to − 5)"
            : (PCR.TOPT - P.Ta).toFixed(1) + " °C below optimum — mispriming risk");
        hA.className = "mlx-hint" + (P.Ta > PCR.TM - 1 || P.Ta < PCR.TOPT - 6 ? " warn" : "");
        hD.textContent = "strand separation " + Math.round(effDenature(P.Td) * 100) + "% · Taq half-life " +
          taqHalfLife(P.Td).toFixed(0) + " min at this temperature";
        hD.className = "mlx-hint" + (P.Td < 93 || P.Td > 96.5 ? " warn" : "");
        hE.textContent = "Taq extends " + taqRate(P.Te).toFixed(0) + " nt/s here — needs " + PCR.AMPLICON +
          " nt in " + PCR.T_EXT + " s (" + Math.round(effExtend(P.Te) * 100) + "% complete)";
        hE.className = "mlx-hint" + (effExtend(P.Te) < 0.95 ? " warn" : "");
      }

      function readout() {
        var secs = P.cycles * (PCR.T_DEN + PCR.T_ANN + PCR.T_EXT) + P.cycles * 22 + 180;
        var rows = [];
        rows.push("<b>Program</b>");
        rows.push("95 °C 3 min initial → [ " + P.Td.toFixed(1) + " °C " + PCR.T_DEN + "s / " +
          P.Ta.toFixed(1) + " °C " + PCR.T_ANN + "s / " + P.Te.toFixed(1) + " °C " + PCR.T_EXT + "s ] × " + P.cycles);
        rows.push("amplicon <b>" + PCR.AMPLICON + " bp</b> · template <b>" + sci(PCR.N0, 0) + " copies</b>");
        rows.push("block time ≈ <b>" + Math.floor(secs / 60) + " min " + (secs % 60) + " s</b>");
        elRead.innerHTML = rows.join("<br>");
      }

      function outputs() {
        if (!P.sim) { elOut.innerHTML = ""; return; }
        var s = P.sim;
        var shown = P.running ? s.hist[Math.min(P.cyc, s.hist.length - 1)] : s.hist[s.hist.length - 1];
        var theo = PCR.N0 * Math.pow(2, shown.c);
        var frac = shown.spec / theo * 100;
        var pct = shown.spec / (shown.spec + shown.ns) * 100;
        elOut.innerHTML =
          '<div class="mlx-cell"><div class="k">Specific product</div><div class="v">' + sci(shown.spec) +
            '</div><div class="s">' + massNg(shown.spec, PCR.AMPLICON).toFixed(0) + " ng in 50 µL</div></div>" +
          '<div class="mlx-cell"><div class="k">Theoretical 2' + sup(shown.c) + '</div><div class="v">' + sci(theo) +
            '</div><div class="s">' + (frac < 0.01 ? "<0.01" : frac.toFixed(frac < 1 ? 3 : 1)) + "% achieved</div></div>" +
          '<div class="mlx-cell"><div class="k">Mean efficiency</div><div class="v">' +
            Math.round((Math.pow(shown.spec / PCR.N0, 1 / Math.max(1, shown.c)) - 1) * 100) + "%</div>" +
            '<div class="s">per cycle, over ' + shown.c + " cycles</div></div>" +
          '<div class="mlx-cell"><div class="k">Purity</div><div class="v">' + pct.toFixed(pct > 99 ? 1 : 0) + "%</div>" +
            '<div class="s">' + (100 - pct).toFixed(0) + "% non-specific</div></div>";
      }

      function verdict() {
        var s = P.sim;
        if (!s) return;
        var out = [];
        var final = s.hist[s.hist.length - 1];
        var theo = PCR.N0 * Math.pow(2, P.cycles);
        var frac = final.spec / theo;
        var purity = final.spec / (final.spec + final.ns);
        var ng = massNg(final.spec, PCR.AMPLICON);

        if (P.Ta > PCR.TM) {
          out.push("<b>Annealing temperature is above the primer Tm.</b> At " + P.Ta.toFixed(1) + " °C the primers are " +
            (P.Ta - PCR.TM).toFixed(1) + " °C past their melting point, so a primer that does land is thermodynamically " +
            "unstable and falls off before Taq can start. Per-cycle efficiency is " + (s.eA * 100).toFixed(1) +
            "% of optimal — that is why the tube looks empty.");
        } else if (P.Ta > PCR.TOPT + 2) {
          out.push("<b>Annealing a little hot.</b> " + P.Ta.toFixed(1) + " °C leaves only " +
            Math.round(s.eA * 100) + "% of the primers stably bound each cycle. Very clean, very low yield — " +
            "the classic 'specific but nothing there' result.");
        } else if (purity < 0.75) {
          out.push("<b>Annealing too cool — you amplified the wrong things.</b> At " + P.Ta.toFixed(1) +
            " °C primers tolerate mismatches, so they prime at sites that are only partly complementary. Only " +
            Math.round(purity * 100) + "% of the product is your amplicon; the rest is a ladder of non-specific bands and " +
            "primer dimer competing for the same dNTPs. Raise the anneal toward " + PCR.TOPT + " °C.");
        }
        if (effDenature(P.Td) < 0.7) {
          out.push("<b>Denaturation is incomplete.</b> At " + P.Td.toFixed(1) + " °C only " +
            Math.round(effDenature(P.Td) * 100) + "% of the duplex separates — GC-rich stretches stay paired, so most " +
            "templates are never available for priming.");
        }
        if (P.Td > 96.5) {
          out.push("<b>Denaturing too hot.</b> Taq's half-life at " + P.Td.toFixed(1) + " °C is only " +
            taqHalfLife(P.Td).toFixed(0) + " min, so after " + P.cycles + " cycles just " +
            Math.round(s.act * 100) + "% of the polymerase is still active. Late cycles barely amplify.");
        }
        if (effExtend(P.Te) < 0.9) {
          out.push("<b>Extension is truncated.</b> Taq runs at " + taqRate(P.Te).toFixed(0) + " nt/s at " +
            P.Te.toFixed(1) + " °C, so in " + PCR.T_EXT + " s it only gets through " +
            Math.round(effExtend(P.Te) * PCR.AMPLICON) + " of the " + PCR.AMPLICON +
            " nt. Incomplete strands are not templates for the next cycle.");
        }
        if (final.spec > PCR.NMAX * 0.55) {
          var plateauAt = 0;
          for (var i = 1; i < s.hist.length; i++) {
            if (s.hist[i].spec + s.hist[i].ns > PCR.NMAX * 0.5) { plateauAt = s.hist[i].c; break; }
          }
          out.push("<b>The reaction plateaued around cycle " + plateauAt + ".</b> Doubling stops when the primers and dNTPs " +
            "run out, not when you stop cycling — which is why extra cycles past the plateau buy you nothing but more " +
            "non-specific product. This ceiling (≈" + sci(PCR.NMAX, 1) + " copies, about " +
            massNg(PCR.NMAX, PCR.AMPLICON).toFixed(1) + " ng of a " + PCR.AMPLICON + " bp amplicon) is set by the dNTPs in the tube.");
        }
        if (!out.length) {
          out.push("<b>Clean amplification.</b> " + P.cycles + " cycles at " + Math.round(s.meanEff * 100) +
            "% mean efficiency turned " + sci(PCR.N0, 0) + " templates into " + sci(final.spec) + " copies — " +
            ng.toFixed(0) + " ng of a " + PCR.AMPLICON + " bp product, " + Math.round(purity * 100) +
            "% specific. Theory says 2" + sup(P.cycles) + "; you got " + (frac * 100).toFixed(1) +
            "% of that, which is what a real, well-behaved reaction looks like.");
        }
        elSay.innerHTML = out.join(" ");
        elSay.style.borderLeftColor = out.length && effDenature(P.Td) < 0.7 || P.Ta > PCR.TM ? "var(--amber)" : "";
      }

      function run() {
        P.sim = simulate(P.Td, P.Ta, P.Te, P.cycles);
        P.cyc = 0; P.phase = 0; P.phaseT = 0; P.done = false;
        if (P.speed === "i" || reduced()) {
          P.cyc = P.cycles; P.running = false; P.done = true;
          outputs(); verdict();
        } else {
          P.running = true;
          elSay.innerHTML = "<b>Cycling.</b> Watch the block step through denature → anneal → extend, and the copy " +
            "count climb by a constant factor each cycle — a straight line on a log axis, until the reagents give out.";
          elSay.style.borderLeftColor = "";
        }
        P.dirty = true;
      }

      /* ---------------- drawing ---------------- */
      var pal = palette(function () { P.dirty = true; });
      var canvas = mountCanvas(view, function (w) { return clamp(w * 0.80, 360, 500); }, function () { P.dirty = true; }, "Thermocycler");

      function draw() {
        var ctx = canvas.ctx, C = pal.c, W = canvas.st.w, H = canvas.st.h;
        ctx.clearRect(0, 0, W, H);

        var padL = 46, padR = 14;
        var thermH = Math.max(108, H * 0.34);
        var gapY = 20;

        /* ---------- thermal profile ---------- */
        var tx0 = padL, tx1 = W - padR, ty0 = 26, ty1 = ty0 + thermH - 30;
        var tMin = 45, tMax = 100;
        function tY(t) { return ty1 - (t - tMin) / (tMax - tMin) * (ty1 - ty0); }

        roundRect(ctx, tx0 - 6, ty0 - 12, (tx1 - tx0) + 12, (ty1 - ty0) + 30, 10);
        ctx.fillStyle = alpha(C.ink, 0.025);
        ctx.fill();

        [50, 60, 70, 80, 90, 100].forEach(function (t) {
          var y = tY(t);
          ctx.strokeStyle = alpha(C.ink, 0.07);
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(tx0, y); ctx.lineTo(tx1, y); ctx.stroke();
          label(ctx, t + "°", tx0 - 8, y, alpha(C.faint, 1), 9.5, "right");
        });

        /* three cycles of the programmed square wave */
        var showC = 3, cw = (tx1 - tx0) / showC;
        var segs = [
          { f: 0, w: PCR.T_DEN, t: P.Td, col: C.rose, n: "denature" },
          { f: 1, w: PCR.T_ANN, t: P.Ta, col: C.indigo, n: "anneal" },
          { f: 2, w: PCR.T_EXT, t: P.Te, col: C.amber, n: "extend" }
        ];
        var totalW = PCR.T_DEN + PCR.T_ANN + PCR.T_EXT;
        for (var c = 0; c < showC; c++) {
          var ox = tx0 + c * cw, acc = 0;
          for (var si = 0; si < 3; si++) {
            var sg = segs[si];
            var x0 = ox + acc / totalW * cw;
            var x1 = ox + (acc + sg.w) / totalW * cw;
            acc += sg.w;
            var y = tY(sg.t);
            ctx.fillStyle = alpha(sg.col, 0.10);
            ctx.fillRect(x0, y, x1 - x0, ty1 - y);
            ctx.strokeStyle = alpha(sg.col, 0.85);
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
            if (c === 0 && cw > 120) {
              label(ctx, sg.n + " " + sg.t.toFixed(0) + "°", (x0 + x1) / 2, y - 9, alpha(sg.col, 1), 9.5, "center", 600);
            }
            /* ramps */
            if (si > 0) {
              var py = tY(segs[si - 1].t);
              ctx.strokeStyle = alpha(sg.col, 0.4);
              ctx.beginPath(); ctx.moveTo(x0, py); ctx.lineTo(x0, y); ctx.stroke();
            }
          }
          ctx.strokeStyle = alpha(C.ink, 0.06);
          ctx.beginPath(); ctx.moveTo(ox, ty0); ctx.lineTo(ox, ty1); ctx.stroke();
        }

        /* playhead + live block temperature */
        if (P.sim) {
          var within = (P.phase === 0 ? 0 : P.phase === 1 ? PCR.T_DEN : PCR.T_DEN + PCR.T_ANN) +
                       P.phaseT * (P.phase === 0 ? PCR.T_DEN : P.phase === 1 ? PCR.T_ANN : PCR.T_EXT);
          var slot = P.running ? (P.cyc % showC) : (showC - 1);
          var frac = P.running ? within / totalW : 1;
          var px = tx0 + (slot + frac) * cw;
          ctx.strokeStyle = alpha(C.ink, 0.55);
          ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.moveTo(px, ty0 - 6); ctx.lineTo(px, ty1 + 4); ctx.stroke();
          var bt = P.running ? blockTemp() : P.Te;
          ctx.beginPath();
          ctx.arc(px, tY(bt), 4.5, 0, 6.2832);
          ctx.fillStyle = segs[P.phase].col;
          ctx.fill();
          label(ctx, bt.toFixed(1) + " °C", tx1, ty0 - 2, alpha(C.ink, 1), 13, "right", 700);
          label(ctx, P.running ? "cycle " + (P.cyc + 1) + " / " + P.cycles + " · " + segs[P.phase].n
                               : (P.done ? "program complete" : "idle"),
                tx0, ty0 - 2, alpha(C.faint, 1), 10, "left");
        } else {
          label(ctx, "program loaded — press Run", tx0, ty0 - 2, alpha(C.faint, 1), 10, "left");
        }

        /* ---------- amplification chart ---------- */
        var gx0 = padL, gx1 = W - padR, gy0 = ty1 + gapY + 22, gy1 = H - 30;
        var loD = 3, hiD = 13;
        function gY(n) {
          var l = Math.log10(Math.max(n, 1));
          return gy1 - clamp((l - loD) / (hiD - loD), 0, 1) * (gy1 - gy0);
        }
        function gX(c) { return gx0 + c / Math.max(1, P.cycles) * (gx1 - gx0); }

        label(ctx, "copies per 50 µL reaction", gx0, gy0 - 14, alpha(C.faint, 1), 10, "left", 500);

        for (var d = loD; d <= hiD; d++) {
          var y2 = gY(Math.pow(10, d));
          ctx.strokeStyle = alpha(C.ink, d % 3 === 0 ? 0.10 : 0.05);
          ctx.beginPath(); ctx.moveTo(gx0, y2); ctx.lineTo(gx1, y2); ctx.stroke();
          if (d % 2 === 1 || d === hiD) label(ctx, "10" + sup(d), gx0 - 8, y2, alpha(C.faint, 1), 9.5, "right");
        }
        /* cycle axis */
        var stepC = P.cycles > 30 ? 10 : 5;
        for (var cc = 0; cc <= P.cycles; cc += stepC) {
          var x2 = gX(cc);
          ctx.strokeStyle = alpha(C.ink, 0.06);
          ctx.beginPath(); ctx.moveTo(x2, gy0); ctx.lineTo(x2, gy1); ctx.stroke();
          label(ctx, String(cc), x2, gy1 + 12, alpha(C.faint, 1), 9.5, "center");
        }
        label(ctx, "cycle", (gx0 + gx1) / 2, gy1 + 24, alpha(C.faint, 1), 9.5, "center");

        /* plateau ceiling */
        var yCap = gY(PCR.NMAX);
        ctx.strokeStyle = alpha(C.faint, 0.7);
        ctx.setLineDash([2, 4]);
        ctx.beginPath(); ctx.moveTo(gx0, yCap); ctx.lineTo(gx1, yCap); ctx.stroke();
        ctx.setLineDash([]);
        label(ctx, "reagent ceiling", gx1 - 3, yCap - 8, alpha(C.faint, 1), 9, "right");

        /* theoretical 2^n */
        ctx.strokeStyle = alpha(C.ink, 0.28);
        ctx.setLineDash([4, 4]);
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        for (var t3 = 0; t3 <= P.cycles; t3++) {
          var yv = gY(PCR.N0 * Math.pow(2, t3));
          if (!t3) ctx.moveTo(gX(t3), yv); else ctx.lineTo(gX(t3), yv);
        }
        ctx.stroke();
        ctx.setLineDash([]);
        label(ctx, "perfect 2ⁿ", gX(P.cycles) - 4, gY(PCR.N0 * Math.pow(2, P.cycles)) - 10, alpha(C.ink, 0.45), 9.5, "right");

        if (P.sim) {
          var upto = P.running ? P.cyc : P.cycles;
          var hist = P.sim.hist;
          /* non-specific */
          if (P.sim.ns > PCR.N0 * 2) {
            ctx.strokeStyle = alpha(C.rose, 0.75);
            ctx.setLineDash([3, 3]);
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            for (var k2 = 0; k2 <= upto; k2++) {
              var yn = gY(hist[k2].ns);
              if (!k2) ctx.moveTo(gX(k2), yn); else ctx.lineTo(gX(k2), yn);
            }
            ctx.stroke();
            ctx.setLineDash([]);
          }
          /* specific product, filled */
          ctx.beginPath();
          for (var k = 0; k <= upto; k++) {
            var ys = gY(hist[k].spec);
            if (!k) ctx.moveTo(gX(k), ys); else ctx.lineTo(gX(k), ys);
          }
          ctx.lineTo(gX(upto), gy1);
          ctx.lineTo(gX(0), gy1);
          ctx.closePath();
          var gg = ctx.createLinearGradient(0, gy0, 0, gy1);
          gg.addColorStop(0, alpha(C.em, 0.22));
          gg.addColorStop(1, alpha(C.em, 0.02));
          ctx.fillStyle = gg;
          ctx.fill();

          ctx.strokeStyle = C.em;
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (var k3 = 0; k3 <= upto; k3++) {
            var y3 = gY(hist[k3].spec);
            if (!k3) ctx.moveTo(gX(k3), y3); else ctx.lineTo(gX(k3), y3);
          }
          ctx.stroke();

          var lastX = gX(upto), lastY = gY(hist[upto].spec);
          ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, 6.2832);
          ctx.fillStyle = C.em; ctx.fill();
          var tag = sci(hist[upto].spec) + " copies";
          ctx.font = "600 11px " + MONO;
          var tw = ctx.measureText(tag).width;
          var tagX = Math.min(lastX + 8, gx1 - tw - 6);
          label(ctx, tag, tagX, lastY - 12, alpha(C.ink, 1), 11, "left", 600);

          /* legend */
          var lgY = gy0 + 2;
          label(ctx, "● specific product", gx0 + 6, lgY, alpha(C.em, 1), 9.5, "left", 600);
          if (P.sim.ns > PCR.N0 * 2) label(ctx, "● non-specific", gx0 + 118, lgY, alpha(C.rose, 1), 9.5, "left", 600);
        }

        canvas.say("Thermocycler. " + (P.running ? "Cycle " + (P.cyc + 1) + " of " + P.cycles :
          P.sim ? "Program complete." : "Idle.") + " Denature " + P.Td + ", anneal " + P.Ta + ", extend " + P.Te + " degrees.");
      }

      /* ---------------- wiring ---------------- */
      function sync() {
        P.Td = parseFloat(sD.value); P.Ta = parseFloat(sA.value);
        P.Te = parseFloat(sE.value); P.cycles = parseInt(sC.value, 10);
        vD.textContent = P.Td.toFixed(1) + " °C";
        vA.textContent = P.Ta.toFixed(1) + " °C";
        vE.textContent = P.Te.toFixed(1) + " °C";
        vC.textContent = P.cycles + "×";
        hints(); readout();
        P.dirty = true;
      }
      [sD, sA, sE, sC].forEach(function (s) {
        s.addEventListener("input", function () {
          sync();
          if (P.sim && !P.running) {
            P.sim = null; P.done = false; elOut.innerHTML = "";
            elSay.innerHTML = "Program changed — press <b>Run program</b> to cycle it.";
            elSay.style.borderLeftColor = "";
          }
          if (P.running) { P.running = false; P.sim = null; elOut.innerHTML = ""; }
        });
      });

      function renderSpeed() {
        elSpeed.innerHTML = chipRow([
          { v: "1", t: "1×" }, { v: "3", t: "3×" }, { v: "i", t: "Instant" }
        ], P.speed, null, "mlxp-sp");
        Array.prototype.forEach.call(elSpeed.querySelectorAll("button"), function (b) {
          b.addEventListener("click", function () {
            P.speed = b.getAttribute("data-v");
            syncChips(elSpeed, "button", P.speed);
            if (P.running && P.speed === "i") { P.cyc = P.cycles; P.running = false; P.done = true; outputs(); verdict(); P.dirty = true; }
          });
        });
      }

      host.querySelector("#mlxpRun").addEventListener("click", run);
      host.querySelector("#mlxpStd").addEventListener("click", function () {
        sD.value = 95; sA.value = 57; sE.value = 72; sC.value = 30;
        sync();
        P.sim = null; elOut.innerHTML = "";
        elSay.innerHTML = "<b>Standard program loaded.</b> 95 °C denature, 57 °C anneal (Tm − 4), 72 °C extend, " +
          "30 cycles. Run it, then change one temperature at a time and watch which failure you cause.";
        elSay.style.borderLeftColor = "";
        P.dirty = true;
      });

      renderSpeed();
      sync();
      elSay.innerHTML = "Primer pair Tm is <b>61 °C</b> and the amplicon is <b>1000 bp</b>. Set the block and press " +
        "<b>Run program</b>. Then try annealing at 66 °C, and at 47 °C — two completely different kinds of failure.";

      var tick = ticker(function (dt) {
        if (P.running && P.sim) {
          var per = SPEEDS[P.speed] || 0.36;
          var segFrac = P.phase === 0 ? PCR.T_DEN : P.phase === 1 ? PCR.T_ANN : PCR.T_EXT;
          var segSecs = per * (segFrac / (PCR.T_DEN + PCR.T_ANN + PCR.T_EXT));
          P.phaseT += dt / Math.max(0.001, segSecs);
          while (P.phaseT >= 1) {
            P.phaseT -= 1;
            P.phase++;
            if (P.phase > 2) {
              P.phase = 0;
              P.cyc++;
              outputs();
              if (P.cyc >= P.cycles) {
                P.cyc = P.cycles; P.running = false; P.done = true;
                outputs(); verdict();
                break;
              }
            }
          }
          P.dirty = true;
        }
        if (P.dirty) { draw(); P.dirty = false; }
      });

      return {
        dispose: function () {
          tick.dispose();
          canvas.dispose();
          pal.dispose();
          css.dispose();
          host.innerHTML = "";
        }
      };
    }
  });

})();

/* ============================================================================
   Biology Entelloq — PHYSIOLOGY BENCHES
   Two real, runnable benches registered into the LABS shell:
     · enzyme-kinetics — temperature / pH / [S] against reaction rate, with
       Michaelis–Menten saturation and IRREVERSIBLE thermal denaturation.
     · heart-rate — an ECG bench where autonomic drive sets HR, SV and CO.
   Plain browser JS. No imports, no build step, no assets, no network.
   ========================================================================== */
(function () {

  var clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };

  var ENZYMES = [

  LABS.register("enzyme-kinetics", {
    title: "The enzyme rate bench",
    tag: "Physiology · Enzymes",
    color: "#f6c667",
    icon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3v6.2L4.9 17.1A2.4 2.4 0 0 0 7 20.7h10a2.4 2.4 0 0 0 2.1-3.6L14.5 9.2V3"/><path d="M8 3h8"/><path d="M7.1 14.6h9.8"/><circle cx="10.6" cy="17" r="1"/><circle cx="13.9" cy="18.2" r="1"/></svg>',
    blurb: "Set temperature, pH and substrate concentration and watch a real rate equation answer. Push past 55 °C and the enzyme is destroyed for good — no amount of cooling brings it back.",

    build: function (host) {

      host.appendChild(root);

      /* ── state ─────────────────────────────────────────────────────────── */
      var st = {
        e: ENZYMES[1],
        T: 37, pH: 7.0, S: 20,
        denat: 0,          // irreversible: only ever increases
        product: 0,        // µmol per mg enzyme, accumulated
        elapsed: 0,
        axis: "T"

      var motion = !reducedMotion();

      var AXES = {
        T: { label: "Temperature (°C)", min: 0, max: 90, ticks: [0, 15, 30, 45, 60, 75, 90], dp: 0 },
        pH: { label: "pH", min: 0, max: 14, ticks: [0, 2, 4, 6, 8, 10, 12, 14], dp: 1 },
        S: { label: "[Substrate]  (mmol L⁻¹)", min: 0, max: 100, ticks: [0, 20, 40, 60, 80, 100], dp: 0 }
      };

      /* ── markup ────────────────────────────────────────────────────────── */
      root.innerHTML =
        '<div class="bx">' +
          '<div class="bx-view enz-view">' +
            '<div class="enz-tube" id="ezTube"></div>' +
            '<div class="enz-cap">' +
              '<span><span class="enz-dot" style="background:var(--amber)"></span><span id="ezNsub">40</span> substrate</span>' +
              '<span><span class="enz-dot" style="background:var(--em)"></span><span id="ezNprod">0</span> product</span>' +
              '<span id="ezTurn">turnover 0.0 %/s</span>' +
            '</div>' +
            '<div class="enz-alarm" id="ezAlarm" hidden role="status"></div>' +
            '<div class="enz-chart" id="ezChart"></div>' +
          '</div>' +

          '<div class="bx-side">' +
            '<div class="bx-grp">' +
              '<span class="bx-lbl" id="ezEnzLbl">Enzyme</span>' +
              '<div class="bx-chips" role="group" aria-labelledby="ezEnzLbl" id="ezEnz"></div>' +
              '<div class="enz-meta" id="ezMeta"></div>' +
            '</div>' +

            '<div class="bx-grp">' +
              '<label for="ezT">Temperature</label>' +
              '<div class="bx-row">' +
                '<input class="bx-slider" type="range" id="ezT" min="0" max="90" step="1" value="37">' +
                '<span class="bx-val" id="ezTv">37 °C</span>' +
              '</div>' +
            '</div>' +

            '<div class="bx-grp">' +
              '<label for="ezP">pH</label>' +
              '<div class="bx-row">' +
                '<input class="bx-slider" type="range" id="ezP" min="0" max="14" step="0.1" value="7">' +
                '<span class="bx-val" id="ezPv">7.0</span>' +
              '</div>' +
            '</div>' +

            '<div class="bx-grp">' +
              '<label for="ezS">Substrate concentration</label>' +
              '<div class="bx-row">' +
                '<input class="bx-slider" type="range" id="ezS" min="0" max="100" step="0.5" value="20">' +
                '<span class="bx-val" id="ezSv">20 mM</span>' +
              '</div>' +
            '</div>' +

            '<div class="bx-grp">' +
              '<span class="bx-lbl" id="ezAxLbl">Plot rate against</span>' +
              '<div class="bx-chips" role="group" aria-labelledby="ezAxLbl" id="ezAxis">' +
                '<button class="bx-btn on" type="button" data-ax="T">Temperature</button>' +
                '<button class="bx-btn" type="button" data-ax="pH">pH</button>' +
                '<button class="bx-btn" type="button" data-ax="S">[S]</button>' +
              '</div>' +
            '</div>' +

            '<div class="enz-grid">' +
              '<div class="enz-cell"><div class="k">Reaction rate</div><div class="v" id="ezRate">0.0<small>µmol min⁻¹ mg⁻¹</small></div></div>' +
              '<div class="enz-cell"><div class="k">Of this enzyme\'s Vmax</div><div class="v" id="ezPct">0<small>%</small></div></div>' +
              '<div class="enz-cell"><div class="k">Product formed</div><div class="v" id="ezProd">0.0<small>µmol mg⁻¹</small></div></div>' +
              '<div class="enz-cell"><div class="k">Enzyme destroyed</div><div class="v" id="ezDen">0<small>%</small></div></div>' +
            '</div>' +

            '<div class="enz-bars" aria-hidden="true">' +
              '<div class="enz-bar"><span>temperature</span><span class="t"><span class="f" id="ezBT"></span></span><span class="n" id="ezNT">0</span></div>' +
              '<div class="enz-bar"><span>pH</span><span class="t"><span class="f" id="ezBP"></span></span><span class="n" id="ezNP">0</span></div>' +
              '<div class="enz-bar"><span>saturation</span><span class="t"><span class="f" id="ezBS"></span></span><span class="n" id="ezNS">0</span></div>' +
              '<div class="enz-bar"><span>intact enzyme</span><span class="t"><span class="f" id="ezBD"></span></span><span class="n" id="ezND">0</span></div>' +
            '</div>' +

            '<div class="bx-read" id="ezEq"></div>' +
            '<div class="bx-chips">' +
              '<button class="bx-btn pri" type="button" id="ezReset">Fresh enzyme (reset)</button>' +
              '<button class="bx-btn" type="button" id="ezOpt">Set to optimum</button>' +
            '</div>' +
            '<div class="bx-verdict" id="ezVerdict" role="status"></div>' +
            '<p class="bx-note"><b>What this shows.</b> Rate is set by four independent things multiplied together: how fast molecules collide (temperature), how well the active site holds its shape and charge (pH), how often the active site is occupied (substrate), and how much enzyme is still intact. Warming speeds collisions until roughly 40 °C; beyond that the protein starts to unfold and the fall is far steeper than the rise. Above 55 °C the unfolding becomes permanent — hydrogen and ionic bonds break, the chain tangles, and cooling it down does nothing. That asymmetry is why enzymes have a "danger side".</p>' +
          '</div>' +
        '</div>';

      var q = function (id) { return root.querySelector("#" + id); };
      var tubeBox = q("ezTube"), chartBox = q("ezChart"), alarm = q("ezAlarm");
      var sT = q("ezT"), sP = q("ezP"), sS = q("ezS");
      var vT = q("ezTv"), vP = q("ezPv"), vS = q("ezSv");
      var enzBox = q("ezEnz"), axBox = q("ezAxis"), metaBox = q("ezMeta");

      /* ── enzyme chips ──────────────────────────────────────────────────── */
      ENZYMES.forEach(function (e) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "bx-btn" + (e === st.e ? " on" : "");
        b.textContent = e.short;
        b.setAttribute("aria-pressed", e === st.e ? "true" : "false");
        b.addEventListener("click", function () {
          st.e = e;
          Array.prototype.forEach.call(enzBox.children, function (c, i) {
            var on = ENZYMES[i] === st.e;
            c.classList.toggle("on", on);
            c.setAttribute("aria-pressed", on ? "true" : "false");
          });
          st.product = 0; st.elapsed = 0;
          drawMeta(); chartDirty = true; sync(true);
        });
        enzBox.appendChild(b);
      });

      function drawMeta() {
        metaBox.innerHTML = st.e.name + " — " + st.e.does + ". " + st.e.where +
          ". <b style=\"color:var(--ink)\">Optimum pH " + fmt(st.e.pHopt, 1) + "</b>, K<sub>m</sub> " +
          fmt(st.e.Km, 1) + " mmol L⁻¹, V<sub>max</sub> " + st.e.Vmax + " µmol min⁻¹ mg⁻¹.";
      }
      drawMeta();

      /* ── axis chips ────────────────────────────────────────────────────── */
      Array.prototype.forEach.call(axBox.children, function (b) {
        b.setAttribute("aria-pressed", b.classList.contains("on") ? "true" : "false");
        b.addEventListener("click", function () {
          st.axis = b.getAttribute("data-ax");
          Array.prototype.forEach.call(axBox.children, function (c) {
            var on = c === b;
            c.classList.toggle("on", on);
            c.setAttribute("aria-pressed", on ? "true" : "false");
          });
          chartDirty = true;
        });
      });

      /* ── the reaction vessel ───────────────────────────────────────────── */
      var TUBE_W = 640, TUBE_H = 76, N_MOL = 40, N_ENZ = 5;
      var mols = [], enzGlyphs = [];
      var tubeSvg = null;

      function buildTube() {
        var parts = ['<svg viewBox="0 0 ' + TUBE_W + ' ' + TUBE_H + '" role="img" aria-label="Reaction vessel: substrate molecules converting to product">'];
        parts.push('<rect x="1" y="1" width="' + (TUBE_W - 2) + '" height="' + (TUBE_H - 2) +
          '" rx="16" style="fill:var(--panel);stroke:var(--line);stroke-width:1"/>');
        parts.push('<g id="ezEnzG"></g><g id="ezMolG"></g>');
        parts.push("</svg>");
        tubeBox.innerHTML = parts.join("");
        tubeSvg = tubeBox.querySelector("svg");
        var mg = tubeBox.querySelector("#ezMolG"), eg = tubeBox.querySelector("#ezEnzG");
        mols.length = 0; enzGlyphs.length = 0;
        var i, c;
        for (i = 0; i < N_ENZ; i++) {
          var ex = 60 + i * ((TUBE_W - 120) / (N_ENZ - 1));
          var ey = 20 + (i % 2) * 34;
          var g = document.createElementNS("http://www.w3.org/2000/svg", "path");
          /* a small open "active site" wedge */
          g.setAttribute("d", "M" + (ex - 11) + "," + (ey - 9) + " a11,11 0 1,0 0,18 l6,-5 a6,6 0 1,1 0,-8 z");
          g.setAttribute("class", "enz-enzyme");
          eg.appendChild(g);
          enzGlyphs.push(g);
        }
        for (i = 0; i < N_MOL; i++) {
          c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
          c.setAttribute("r", "3.4");
          c.setAttribute("class", "enz-sub");
          mg.appendChild(c);
          mols.push({
            el: c,
            x: 16 + Math.random() * (TUBE_W - 32),
            y: 12 + Math.random() * (TUBE_H - 24),
            vx: (Math.random() * 2 - 1) * 26,
            vy: (Math.random() * 2 - 1) * 20,
            done: false
          });
        }
        placeMols();
      }
      function placeMols() {
        for (var i = 0; i < mols.length; i++) {
          var m = mols[i];
          m.el.setAttribute("cx", m.x.toFixed(1));
          m.el.setAttribute("cy", m.y.toFixed(1));
        }
      }
      buildTube();

      /* ── the chart ─────────────────────────────────────────────────────── */
      var VB_W = 660, VB_H = 320, PL = 60, PR = 18, PT = 16, PB = 42;
      var PW = VB_W - PL - PR, PH = VB_H - PT - PB;

      function curveValue(ax, x, ideal) {
        var e = st.e;
        var T = ax === "T" ? x : (ideal ? 40 : st.T);
        var pH = ax === "pH" ? x : (ideal ? e.pHopt : st.pH);
        var S = ax === "S" ? x : (ideal ? 100 : st.S);
        if (ideal) {
          if (ax === "T") { pH = e.pHopt; S = 100; }
          if (ax === "pH") { T = 40; S = 100; }
          if (ax === "S") { T = 40; pH = e.pHopt; }
        }
        return rateOf(e, T, pH, S, ideal ? 0 : st.denat);
      }

      function drawChart() {
        var e = st.e, ax = AXES[st.axis], k = st.axis;
        var ymax = e.Vmax;
        var X = function (v) { return PL + (v - ax.min) / (ax.max - ax.min) * PW; };
        var Y = function (r) { return PT + (1 - clamp(r / ymax, 0, 1)) * PH; };

        var s = ['<svg viewBox="0 0 ' + VB_W + ' ' + VB_H + '" role="img" aria-label="Reaction rate against ' +
          ax.label + ' for ' + e.name + '">'];

        /* danger band (temperature only) */
        if (k === "T") {
          s.push('<rect x="' + X(55).toFixed(1) + '" y="' + PT + '" width="' + (X(90) - X(55)).toFixed(1) +
            '" height="' + PH + '" style="fill:var(--rose);opacity:.10"/>');
          s.push('<text x="' + (X(55) + 7).toFixed(1) + '" y="' + (PT + 15) +
            '" style="fill:var(--rose);font-size:10.5px;letter-spacing:.1em;font-family:var(--mono)">DENATURING ZONE</text>');
        }

        /* horizontal gridlines + y ticks */
        var i, gy;
        for (i = 0; i <= 4; i++) {
          gy = PT + (i / 4) * PH;
          s.push('<line x1="' + PL + '" y1="' + gy.toFixed(1) + '" x2="' + (PL + PW) + '" y2="' + gy.toFixed(1) +
            '" style="stroke:var(--line);stroke-width:1"/>');
          s.push('<text x="' + (PL - 9) + '" y="' + (gy + 4).toFixed(1) +
            '" text-anchor="end" style="fill:var(--faint);font-size:11px;font-family:var(--mono)">' +
            Math.round(ymax * (1 - i / 4)) + "</text>");
        }
        /* x ticks */
        ax.ticks.forEach(function (t) {
          s.push('<line x1="' + X(t).toFixed(1) + '" y1="' + (PT + PH) + '" x2="' + X(t).toFixed(1) + '" y2="' + (PT + PH + 5) +
            '" style="stroke:var(--line);stroke-width:1"/>');
          s.push('<text x="' + X(t).toFixed(1) + '" y="' + (PT + PH + 19) +
            '" text-anchor="middle" style="fill:var(--faint);font-size:11px;font-family:var(--mono)">' + t + "</text>");
        });
        s.push('<line x1="' + PL + '" y1="' + (PT + PH) + '" x2="' + (PL + PW) + '" y2="' + (PT + PH) +
          '" style="stroke:var(--line);stroke-width:1.2"/>');
        s.push('<text x="' + (PL + PW / 2) + '" y="' + (VB_H - 8) +
          '" text-anchor="middle" style="fill:var(--dim);font-size:12px">' + ax.label + "</text>");
        s.push('<text transform="translate(15,' + (PT + PH / 2) + ') rotate(-90)" text-anchor="middle" ' +
          'style="fill:var(--dim);font-size:12px">Rate  (µmol min⁻¹ mg⁻¹)</text>');

        /* sampled curves */
        var N = 180, dIdeal = "", dNow = "", fill = "", t, xv, rv;
        for (i = 0; i <= N; i++) {
          xv = ax.min + (i / N) * (ax.max - ax.min);
          rv = curveValue(k, xv, true);
          dIdeal += (i ? "L" : "M") + X(xv).toFixed(1) + "," + Y(rv).toFixed(1) + " ";
        }
        for (i = 0; i <= N; i++) {
          xv = ax.min + (i / N) * (ax.max - ax.min);
          rv = curveValue(k, xv, false);
          dNow += (i ? "L" : "M") + X(xv).toFixed(1) + "," + Y(rv).toFixed(1) + " ";
        }
        fill = dNow + "L" + X(ax.max).toFixed(1) + "," + (PT + PH) + " L" + X(ax.min).toFixed(1) + "," + (PT + PH) + " Z";

        s.push('<path d="' + dIdeal + '" style="fill:none;stroke:var(--dim);stroke-width:1.3;opacity:.42;stroke-dasharray:5 5"/>');
        s.push('<path d="' + fill + '" style="fill:var(--acc);opacity:.12"/>');
        s.push('<path d="' + dNow + '" style="fill:none;stroke:var(--acc);stroke-width:2.4;stroke-linejoin:round"/>');

        /* Michaelis–Menten annotations on the [S] axis */
        if (k === "S") {
          var vmaxEff = e.Vmax * fT(st.T) * fPH(st.pH, e) * (1 - st.denat);
          var halfY = Y(vmaxEff / 2);
          s.push('<line x1="' + PL + '" y1="' + halfY.toFixed(1) + '" x2="' + X(e.Km).toFixed(1) + '" y2="' + halfY.toFixed(1) +
            '" style="stroke:var(--cy);stroke-width:1.2;stroke-dasharray:3 4;opacity:.85"/>');
          s.push('<line x1="' + X(e.Km).toFixed(1) + '" y1="' + halfY.toFixed(1) + '" x2="' + X(e.Km).toFixed(1) + '" y2="' + (PT + PH) +
            '" style="stroke:var(--cy);stroke-width:1.2;stroke-dasharray:3 4;opacity:.85"/>');
          s.push('<text x="' + (X(e.Km) + 8).toFixed(1) + '" y="' + (halfY - 7).toFixed(1) +
            '" style="fill:var(--cy);font-size:11px;font-family:var(--mono)">½V_max at [S] = K_m = ' + fmt(e.Km, 1) + " mM</text>");
        }
        if (k === "pH") {
          s.push('<line x1="' + X(e.pHopt).toFixed(1) + '" y1="' + PT + '" x2="' + X(e.pHopt).toFixed(1) + '" y2="' + (PT + PH) +
            '" style="stroke:var(--cy);stroke-width:1.2;stroke-dasharray:3 4;opacity:.8"/>');
          s.push('<text x="' + (X(e.pHopt) + 7).toFixed(1) + '" y="' + (PT + 14) +
            '" style="fill:var(--cy);font-size:11px;font-family:var(--mono)">optimum pH ' + fmt(e.pHopt, 1) + "</text>");
        }
        if (k === "T") {
          s.push('<line x1="' + X(40).toFixed(1) + '" y1="' + PT + '" x2="' + X(40).toFixed(1) + '" y2="' + (PT + PH) +
            '" style="stroke:var(--cy);stroke-width:1.2;stroke-dasharray:3 4;opacity:.7"/>');
          s.push('<text x="' + (X(40) + 7).toFixed(1) + '" y="' + (PT + PH - 8).toFixed(1) +
            '" style="fill:var(--cy);font-size:11px;font-family:var(--mono)">optimum ≈ 40 °C</text>');
        }

        /* live marker */
        var cx = k === "T" ? st.T : k === "pH" ? st.pH : st.S;
        var cy = rateOf(e, st.T, st.pH, st.S, st.denat);
        var mx = X(cx), my = Y(cy);
        s.push('<line x1="' + PL + '" y1="' + my.toFixed(1) + '" x2="' + mx.toFixed(1) + '" y2="' + my.toFixed(1) +
          '" style="stroke:var(--acc);stroke-width:1;stroke-dasharray:2 4;opacity:.65"/>');
        s.push('<line x1="' + mx.toFixed(1) + '" y1="' + my.toFixed(1) + '" x2="' + mx.toFixed(1) + '" y2="' + (PT + PH) +
          '" style="stroke:var(--acc);stroke-width:1;stroke-dasharray:2 4;opacity:.65"/>');
        s.push('<circle cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="6.5" style="fill:var(--acc);opacity:.22"/>');
        s.push('<circle cx="' + mx.toFixed(1) + '" cy="' + my.toFixed(1) + '" r="3.6" style="fill:var(--acc)"/>');
        var lx = mx > PL + PW - 110 ? mx - 10 : mx + 10;
        var anchor = mx > PL + PW - 110 ? "end" : "start";
        s.push('<text x="' + lx.toFixed(1) + '" y="' + clamp(my - 11, PT + 12, PT + PH - 4).toFixed(1) + '" text-anchor="' + anchor +
          '" style="fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--mono)">' + fmt(cy, 1) + "</text>");

        s.push("</svg>");
        chartBox.innerHTML = s.join("");
      }

      /* ── controls ──────────────────────────────────────────────────────── */
      function readSliders() {
        st.T = parseFloat(sT.value);
        st.pH = parseFloat(sP.value);
        st.S = parseFloat(sS.value);
      }
      function onInput() { readSliders(); chartDirty = true; sync(true); }
      sT.addEventListener("input", onInput);
      sP.addEventListener("input", onInput);
      sS.addEventListener("input", onInput);

      var btnReset = q("ezReset"), btnOpt = q("ezOpt");
      btnReset.addEventListener("click", function () {
        st.denat = 0; st.product = 0; st.elapsed = 0;
        for (var i = 0; i < mols.length; i++) { mols[i].done = false; mols[i].el.setAttribute("class", "enz-sub"); }
        chartDirty = true; sync(true);
      });
      btnOpt.addEventListener("click", function () {
        sT.value = "37"; sP.value = String(st.e.pHopt); sS.value = "60";
        readSliders(); chartDirty = true; sync(true);
      });

      /* ── readouts ──────────────────────────────────────────────────────── */
      var oRate = q("ezRate"), oPct = q("ezPct"), oProd = q("ezProd"), oDen = q("ezDen");
      var bT = q("ezBT"), bP = q("ezBP"), bS = q("ezBS"), bD = q("ezBD");
      var nT = q("ezNT"), nP = q("ezNP"), nS = q("ezNS"), nD = q("ezND");
      var eqBox = q("ezEq"), verdict = q("ezVerdict");
      var nSub = q("ezNsub"), nProd = q("ezNprod"), oTurn = q("ezTurn");
      var lastVerdict = "";

      function sync(fromUser) {
        var e = st.e;
        var ft = fT(st.T), fp = fPH(st.pH, e), fs = fS(st.S, e), intact = 1 - st.denat;
        var v = e.Vmax * ft * fp * intact * fs;

        vT.textContent = fmt(st.T, 0) + " °C";
        vT.classList.toggle("enz-hot", st.T > 55);
        vP.textContent = fmt(st.pH, 1);
        vS.textContent = fmt(st.S, 1) + " mM";

        oRate.innerHTML = fmt(v, 1) + "<small>µmol min⁻¹ mg⁻¹</small>";
        oPct.innerHTML = fmt(v / e.Vmax * 100, 1) + "<small>%</small>";
        oProd.innerHTML = fmt(st.product, 1) + "<small>µmol mg⁻¹</small>";
        oDen.innerHTML = fmt(st.denat * 100, 0) + "<small>%</small>";
        oDen.style.color = st.denat > 0.005 ? "var(--rose)" : "";

        bT.style.width = (ft * 100).toFixed(1) + "%"; nT.textContent = fmt(ft, 2);
        bP.style.width = (fp * 100).toFixed(1) + "%"; nP.textContent = fmt(fp, 2);
        bS.style.width = (fs * 100).toFixed(1) + "%"; nS.textContent = fmt(fs, 2);
        bD.style.width = (intact * 100).toFixed(1) + "%"; nD.textContent = fmt(intact, 2);

        eqBox.innerHTML =
          "v = V<sub>max</sub> · f(T) · f(pH) · (1 − D) · [S]/(K<sub>m</sub>+[S])<br>" +
          "v = <b>" + e.Vmax + "</b> × <b>" + fmt(ft, 2) + "</b> × <b>" + fmt(fp, 2) + "</b> × <b>" + fmt(intact, 2) +
          "</b> × <b>" + fmt(fs, 2) + "</b> = <b>" + fmt(v, 1) + "</b> µmol min⁻¹ mg⁻¹";

        var done = 0;
        for (var i = 0; i < mols.length; i++) if (mols[i].done) done++;
        nSub.textContent = String(mols.length - done);
        nProd.textContent = String(done);
        oTurn.textContent = "turnover " + fmt(v / e.Vmax * 55, 1) + " %/s";

        alarm.hidden = st.denat < 0.005;
        if (!alarm.hidden) {
          alarm.innerHTML = st.denat >= 0.999
            ? "<b>Enzyme denatured.</b> The tertiary structure has collapsed and the active site no longer exists. Cooling the tube will not restore it — this is irreversible. Press “Fresh enzyme” to add new enzyme."
            : "<b>Denaturing — " + fmt(st.denat * 100, 0) + "% destroyed.</b> Every second above 55 °C permanently unfolds more protein. Cool it now to save what is left.";
        }
        for (i = 0; i < enzGlyphs.length; i++) {
          var dead = st.denat > (i + 0.5) / enzGlyphs.length;
          enzGlyphs[i].setAttribute("class", "enz-enzyme" + (dead ? " dead" : ""));
        }

        /* verdict — only recomputed on real change, so screen readers aren't spammed */
        var msg;
        if (st.denat >= 0.999) {
          msg = "<b>Dead.</b> No rate at any temperature or pH now. Denaturation is a one-way door: the hydrogen bonds, ionic bonds and hydrophobic packing that held the active site in shape have been broken and the chain has tangled. This is the difference between <i>slowing</i> an enzyme and <i>destroying</i> it.";
        } else if (st.denat > 0.005) {
          msg = "<b>Losing enzyme every second.</b> " + fmt(st.denat * 100, 0) + "% is already destroyed. The whole curve is being scaled down permanently.";
        } else {
          var worst = Math.min(ft, fp, fs);
          if (worst === fp && fp < 0.55) {
            msg = "<b>pH is the limit.</b> At pH " + fmt(st.pH, 1) + ", " + e.name + " keeps only " + fmt(fp * 100, 0) +
              "% of its activity — you are " + fmt(Math.abs(st.pH - e.pHopt), 1) + " units from its optimum of pH " + fmt(e.pHopt, 1) +
              ". Charged R-groups in the active site gain or lose protons, so the substrate no longer fits. " + e.fact;
          } else if (worst === ft && ft < 0.55) {
            msg = st.T < 30

            '<p class="bx-note"><b>What this shows.</b> The SA node fires on its own at about <b>100 bpm</b>. A resting rate near 70 exists only because the vagus nerve is constantly braking it with acetylcholine — block the vagus and the heart immediately jumps to its intrinsic rate. At the start of exercise the first thing that happens is <i>vagal withdrawal</i> (fast, within a beat), and only then does sympathetic noradrenaline take over (slow, over several seconds); circulating adrenaline from the adrenal medulla arrives slower still. Stroke volume rises for a different reason — more venous return stretches the ventricle, and by the Frank–Starling mechanism a stretched ventricle contracts harder. Multiply the two and you get cardiac output. At very high rates diastole becomes so short that filling starts to suffer, which is why CO eventually plateaus.</p>' +

          "CO = HR × SV = <b>" + shown + "</b> × <b>" + Math.round(m.sv) + " mL</b> = <b>" + fmt(m.co, 1) + " L min⁻¹</b>" +
          "  <span style=\"color:var(--faint)\">(rest ≈ 5.0)</span><br>" +
          "Cycle " + Math.round(m.T * 1000) + " ms = systole " + Math.round(m.sys * 1000) +
          " ms + diastole " + Math.round(m.dias * 1000) + " ms";

        var msg;
        if (!st.vagus && st.ex < 0.05 && st.adr < 0.05) {
          msg = "<b>Vagus blocked at rest.</b> Nothing is stimulating the heart — the rate has risen to the SA node's own intrinsic firing rate of about 100 bpm simply because the brake was removed. This is what atropine does, and it is why a transplanted (denervated) heart rests near 100.";
        } else if (!st.vagus) {
          msg = "<b>No vagal brake.</b> Every bpm above 100 here is sympathetic drive and adrenaline. Recovery after you drop the intensity will also be slow: the fast fall in heart rate after exercise is normally vagal re-engagement, and you have removed it.";
        } else if (st.ex < 0.05 && st.adr > 0.4) {
          msg = "<b>Adrenaline without exercise.</b> A fright raises rate and contractility (stroke volume and ejection fraction climb) while venous return has barely changed — so cardiac output rises mostly through rate. Notice it also builds and fades slowly: this is a hormone travelling in blood, not a nerve impulse.";
        } else if (st.ex > 0 && st.ex <= 0.35) {
          msg = "<b>Early exercise = vagal withdrawal.</b> Almost all of the rise so far comes from taking the brake off (vagal tone is down to " +
            fmt(sm.vagal, 0) + " bpm from 30). It happens within a beat or two because acetylcholine is cleared fast. Sympathetic drive is only just beginning.";
        } else if (st.ex > 0.35 && st.ex < 0.85) {
          msg = "<b>Sympathetic drive is now doing the work.</b> The vagus is almost fully withdrawn, so further rate rise is noradrenaline at the SA node — and it also raises contractility, which is why stroke volume is up to " +
            Math.round(m.sv) + " mL. Cardiac output is " + fmt(m.co / 5.0, 1) + "× resting.";
        } else if (st.ex >= 0.85) {
          msg = "<b>Near maximum.</b> Diastole has shrunk to " + Math.round(m.dias * 1000) +
            " ms, so filling time is the new limit — stroke volume has stopped climbing and cardiac output plateaus. Rate cannot rescue it: beyond here, faster means less filled.";
        } else {
          msg = "<b>Resting state.</b> The SA node would fire at 100 bpm on its own; continuous vagal tone holds it at about 70. Cardiac output is " +
            fmt(m.co, 1) + " L min⁻¹ — the whole blood volume, roughly once a minute.";
        }
        if (force || msg !== lastVerdict) { verdict.innerHTML = msg; lastVerdict = msg; }
      }

      /* ── controls ──────────────────────────────────────────────────────── */
      function sliderChange() {
        st.ex = parseInt(sEx.value, 10) / 100;
        st.adr = parseInt(sAd.value, 10) / 100;
        st.age = parseInt(sAge.value, 10);
        vEx.textContent = sEx.value + " %";
        vAd.textContent = sAd.value + " %";
        vAge.textContent = sAge.value + " yr";
        if (!motion) staticStrip();
      }
      sEx.addEventListener("input", sliderChange);
      sAd.addEventListener("input", sliderChange);
      sAge.addEventListener("input", sliderChange);

      function setVagus(on) {
        st.vagus = on;
        bVag.classList.toggle("on", on);
        bVag.setAttribute("aria-pressed", on ? "true" : "false");
        bVag.textContent = on ? "Vagus intact" : "Vagus blocked (atropine)";
        if (!motion) staticStrip();
      }
      bVag.addEventListener("click", function () { setVagus(!st.vagus); });

      function applyPreset(p) {
        sEx.value = String(Math.round(p.ex * 100));
        sAd.value = String(Math.round(p.adr * 100));
        sliderChange();
        setVagus(p.vagus);
      }
      var PRESETS = [
        { n: "Rest", ex: 0, adr: 0, vagus: true },
        { n: "Brisk walk", ex: 0.28, adr: 0.05, vagus: true },
        { n: "Hard run", ex: 0.85, adr: 0.55, vagus: true },
        { n: "Sudden fright", ex: 0, adr: 0.9, vagus: true },
        { n: "Atropine", ex: 0, adr: 0, vagus: false }
      ];
      PRESETS.forEach(function (p) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "bx-btn"; b.textContent = p.n;
        b.addEventListener("click", function () { applyPreset(p); });
        preBox.appendChild(b);
      });
      bRest.addEventListener("click", function () { applyPreset(PRESETS[0]); });

      /* ── loop ──────────────────────────────────────────────────────────── */
      var raf = 0, last = 0;
      function step(dts) {
        var t = targets();
        var kv = 1 - Math.exp(-dts / 0.8);                                   // vagal: fast, ~1 beat
        var ks = 1 - Math.exp(-dts / (t.symp > sm.symp ? 4.5 : 8.0));        // sympathetic: slow
        var ka = 1 - Math.exp(-dts / (t.adr > sm.adr ? 5.0 : 8.0));          // hormone: slower still
        sm.vagal += (t.vagal - sm.vagal) * kv;
        sm.symp += (t.symp - sm.symp) * ks;
        sm.adr += (t.adr - sm.adr) * ka;
        var ke = 1 - Math.exp(-dts / 6.0);
        sm.ex += (st.ex - sm.ex) * ke;                                       // venous return / Starling: slow
        sm.adrS += (st.adr - sm.adrS) * ka;
      }

      function frame(ts) {
        raf = requestAnimationFrame(frame);
        if (!last) last = ts;
        var dt = clamp((ts - last) / 1000, 0, 0.06);
        last = ts;
        if (!W) { resize(); return; }

        sampAcc += PX_PER_S * dt;
        var n = Math.min(400, Math.floor(sampAcc));
        sampAcc -= n;
        var dts = n > 0 ? dt / n : dt;

        for (var i = 0; i < n; i++) {
          step(dts);
          simT += dts;
          rsaPhase += dts;
          if (lastBeat < 0) { lastBeat = simT; prevP = curP; }
          if (simT - lastBeat >= curP) {
            lastBeat += curP;
            prevP = curP;
            var hrB = baseHR();
            /* respiratory sinus arrhythmia — only exists while the vagus works */
            var breathHz = 0.22 + 0.35 * sm.ex;
            var rsa = st.vagus ? 3.4 * Math.exp(-sm.ex / 0.4) * Math.sin(2 * Math.PI * breathHz * simT) : 0;
            curP = 60 / clamp(hrB + rsa, 25, 240);
          }
          var tau = simT - lastBeat;
          var wander = 0.018 * Math.sin(2 * Math.PI * (0.22 + 0.35 * sm.ex) * simT);
          pushSample(ecg(tau, curP) + ecg(tau + prevP, prevP) + wander);
        }

        var hr = 60 / curP, m = mechanics(hr);
        drawGrid(); drawTrace();

        /* heart glyph contracts in systole */
        var since = simT - lastBeat;
        var p = clamp(1 - since / 0.30, 0, 1);
        heartEl.style.transform = "scale(" + (1 + 0.16 * p * p) + ")";
        heartEl.style.opacity = String(0.72 + 0.28 * p);

        if (ts - lastRead > 80) { readouts(hr, m, false); lastRead = ts; }
      }
      var lastRead = 0;

      var ro = null;
      if (window.ResizeObserver) { ro = new ResizeObserver(function () { resize(); }); ro.observe(can); }
      var onWinResize = function () { resize(); };
      window.addEventListener("resize", onWinResize);
      var themeMo = onThemeChange(function () { pal.flush(); if (!motion) staticStrip(); });

      sliderChange();
      resize();
      if (motion) {
        raf = requestAnimationFrame(frame);
      } else {
        heartEl.style.transform = "";
        staticStrip();
      }

      return {
        dispose: function () {
          cancelAnimationFrame(raf);
          if (ro) ro.disconnect();
          window.removeEventListener("resize", onWinResize);
          themeMo.disconnect();
          sEx.removeEventListener("input", sliderChange);
          sAd.removeEventListener("input", sliderChange);
          sAge.removeEventListener("input", sliderChange);
          pal.destroy();
          buf = null;
          if (styleEl.parentNode) styleEl.parentNode.removeChild(styleEl);
          if (root.parentNode) root.parentNode.removeChild(root);
        }
      };
    }
  });
})();

</script>

<script id="atmo-js">
/* ============================================================================
   BIOLOGY ENTELLOQ — THE LIVING FIELD.

   Physics Entelloq puts a sheet of spacetime behind the product and bends it
   around the cursor. This is the biological answer to that, and it is not the
   same idea in different colours: matter is passive and gets curved, whereas
   tissue is ALIVE and reaches toward what it wants. So the field here is a thick
   section of living tissue seen down a microscope, and the cursor is a nutrient
   source. Cells near it swell, their membranes brighten, and the capillary
   network grows toward it — chemotaxis, the oldest behaviour there is.

   Four things are happening at once in the shader:
     · a Worley cell field (membranes are the F2-F1 ridge — the real thing under
       phase contrast) in two parallax layers, so the section has thickness
     · a domain warp driven by slow fbm, because no real tissue is on a grid
     · ridged fbm capillaries that bias their flow toward the cursor
     · a breath — everything respires at about 7 cycles a minute, which is why
       it reads as alive rather than as a screensaver on a loop

   SELF-INSTALLING. Dropping this one <script> onto a page is the whole install:
   it makes its own canvas, injects its own CSS, picks its colour from
   <body data-page>, and follows the light/dark toggle. It never needs markup.
   ========================================================================== */
(function () {
  "use strict";
  if (window.BIOQ_ATMO) return;                       // idempotent: safe to double-inject

  // Inside the unified app shell each section loads in an iframe with ?embed=1.
  // The shell already has a field; a second one per iframe would mean two WebGL
  // contexts fighting for the GPU and a visible seam where the two tissues meet.
  // So the embedded page renders none of its own and goes transparent instead,
  // letting the shell's single continuous field show through — which is also why
  // navigating between sections never interrupts it.
  try {
    if (new URLSearchParams(location.search).get("embed")) {
      var t = document.createElement("style");
      t.id = "atmo-embed";
      t.textContent = "html,body{background:transparent!important}.bg-veil{display:none!important}";
      (document.head || document.documentElement).appendChild(t);
      window.BIOQ_ATMO = { theme: function () {}, setSection: function () {}, mouse: null, mode: "embedded" };
      return;
    }
  } catch (e) {}

  /* --- where the colour comes from -------------------------------------- */
  // Each pillar gets its own biology, and the hues deliberately match the `tc`
  // accent the app shell already assigns that view — so the field is the same
  // colour as the section you are standing in rather than a second, competing
  // palette. Intensity is how ALIVE the field looks: the Lab runs hot, Me runs quiet.
  var SECTIONS = {
    home:     ["#34d399", 0.44],   // em     — chlorophyll
    learn:    ["#34d399", 0.52],   // em
    lessons:  ["#38e0d8", 0.50],   // cy
    reason:   ["#8b5cf6", 0.48],   // violet — the colour of thinking
    labs:     ["#f6c667", 0.52],   // amber  — a bench lamp
    solve:    ["#7c8cf8", 0.48],   // indigo
    explore:  ["#38e0d8", 0.58],   // cy     — open water
    me:       ["#c9a86a", 0.34],   // quiet, warm, low
    about:    ["#34d399", 0.46],   // em
    lab:      ["#fb7185", 0.64],   // rose   — an opened body, and the field runs hot
    universe: ["#38e0d8", 0.60]    // cy
  };

  var reduced = false;
  try { reduced = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
  var STILL = reduced || /[?&#](still|print)=?1?/.test(location.search + location.hash);

  /* --- install ----------------------------------------------------------- */
  var css = document.createElement("style");
  css.id = "atmo-css";
  css.textContent =
    // z-index:-1, NOT 0. A positioned element at z-index:0 paints ABOVE ordinary
    // in-flow block content, so the field would cover the page. Negative z puts it
    // between the root background and everything else, which means not one existing
    // element needs its position or stacking touched — and the product's fixed nav
    // (position:fixed;z-index:60) keeps working exactly as before.
    "#atmo{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;" +
      "opacity:0;transition:opacity 1.2s cubic-bezier(.22,1,.36,1);display:block}" +
    "#atmo.lit{opacity:.78}" +
    // In light mode the same field reads as a stained section on a white slide, so
    // it stays — but fainter, because ink on paper is a quieter medium.
    "html[data-theme=\"light\"] #atmo.lit{opacity:.42}" +
    // The pages paint --bg on BOTH html and body; body's copy would hide a
    // negative-z child, so hand the background to the root alone. --bg is a themed
    // custom property, so this keeps following the light/dark toggle for free.
    "html{background:var(--bg,#04070a)}body{background:transparent!important}";
  (document.head || document.documentElement).appendChild(css);

  var cv = document.createElement("canvas");
  cv.id = "atmo";
  cv.setAttribute("aria-hidden", "true");
  // NOTE: attach() is *declared* here but deliberately not *called* until the very
  // bottom of this module. It reaches into cur/tgt/M/FS/VS, all of which are `var`
  // bindings that are hoisted but still undefined at this point in the file —
  // calling it here would throw on the first property write and silently leave the
  // page with no field at all.
  function attach() {
    if (!document.body) return setTimeout(attach, 16);
    document.body.insertBefore(cv, document.body.firstChild);
    // The class is what fades the field in, and it must land on a LATER frame than
    // the insert or the CSS transition has nothing to transition from. rAF is the
    // usual way to get that, but rAF does not run at all in a background tab — so a
    // page that loads hidden would sit at opacity 0. The timer is the backstop;
    // adding the class twice costs nothing.
    function lit() { cv.classList.add("lit"); }
    requestAnimationFrame(lit);
    setTimeout(lit, 80);
    boot();
  }

  /* --- state ------------------------------------------------------------- */
  function hexRGB(h) {
    h = String(h).replace("#", "");
    return [parseInt(h.slice(0, 2), 16) / 255, parseInt(h.slice(2, 4), 16) / 255, parseInt(h.slice(4, 6), 16) / 255];
  }
  var cur = { r: 0.20, g: 0.83, b: 0.60, in: 0.44, lt: 0 };
  var tgt = { r: 0.20, g: 0.83, b: 0.60, in: 0.44, lt: 0 };
  var M = { x: innerWidth / 2, y: innerHeight / 2, tx: innerWidth / 2, ty: innerHeight / 2, live: 0, tlive: 0 };

  addEventListener("pointermove", function (e) {
    M.tx = e.clientX; M.ty = e.clientY; M.tlive = 1;
  }, { passive: true });
  // A pointer that has left should stop feeding the tissue, or the glow sits there
  // forever on a page nobody is touching. pointerleave does not bubble, so it has
  // to be bound to the root element rather than to window; mouseout with a null
  // relatedTarget is the belt-and-braces case for leaving through the chrome.
  document.documentElement.addEventListener("pointerleave", function () { M.tlive = 0; }, { passive: true });
  addEventListener("mouseout", function (e) { if (!e.relatedTarget) M.tlive = 0; }, { passive: true });
  addEventListener("blur", function () { M.tlive = 0; });
  // Touch has no hover: without this the glow would stay wherever the last tap
  // landed, permanently, on every phone.
  addEventListener("pointerup", function (e) {
    if (e.pointerType !== "mouse") M.tlive = 0;
  }, { passive: true });

  function theme(rgb, intensity) {
    tgt.r = rgb[0]; tgt.g = rgb[1]; tgt.b = rgb[2];
    if (typeof intensity === "number") tgt.in = intensity;
  }
  function setSection(key) {
    var s = SECTIONS[key] || SECTIONS.home;
    theme(hexRGB(s[0]), s[1]);
    nudge();                             // navigating must restain the field even in STILL mode
  }
  // repaint is filled in by whichever renderer boots. In STILL mode (reduced
  // motion, or ?still=1) exactly one frame is ever drawn, so without this a reader
  // who switches to light mode would be left looking at the dark field forever.
  var repaint = null;
  function nudge() {
    if (!STILL || !repaint) return;      // the animated path picks the change up on its own
    for (var i = 0; i < 60; i++) ease(); // settle the eased colour, then draw the one frame
    repaint(0);
  }
  function readTheme() {
    var next = (document.documentElement.getAttribute("data-theme") === "light") ? 1 : 0;
    if (next === tgt.lt) return;
    tgt.lt = next;
    nudge();
  }

  function ease() {
    cur.r += (tgt.r - cur.r) * 0.035; cur.g += (tgt.g - cur.g) * 0.035;
    cur.b += (tgt.b - cur.b) * 0.035; cur.in += (tgt.in - cur.in) * 0.035;
    cur.lt += (tgt.lt - cur.lt) * 0.08;
    M.x += (M.tx - M.x) * 0.075; M.y += (M.ty - M.y) * 0.075;
    M.live += (M.tlive - M.live) * 0.04;
  }

  /* --- the field --------------------------------------------------------- */
  var FS = [
    "precision mediump float;",
    "uniform vec2 uRes;uniform float uT;uniform vec2 uM;uniform vec3 uC;uniform float uIn;uniform float uLive;uniform float uLight;",

    "float h1(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}",
    "vec2 h2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}",
    "float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);",
    " float a=h1(i),b=h1(i+vec2(1,0)),c=h1(i+vec2(0,1)),d=h1(i+vec2(1,1));",
    " return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);}",
    "float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*vn(p);p*=2.07;a*=.5;}return v;}",
    // Ridged noise gives threads instead of blobs — this is what makes a capillary
    // look like a vessel and not like a cloud.
    "float ridge(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*(1.-abs(vn(p)*2.-1.));p*=2.11;a*=.5;}return v;}",

    // Worley. Returns (F1, F2-F1, cell id). Every nucleus orbits its own cell on a
    // slow private path, so no two cells ever pulse together.
    "vec3 cells(vec2 p,float t){vec2 n=floor(p),f=fract(p);",
    " float f1=8.,f2=8.;vec2 id=vec2(0.);",
    " for(int j=-1;j<=1;j++){for(int i=-1;i<=1;i++){",
    "  vec2 g=vec2(float(i),float(j));vec2 o=h2(n+g);",
    "  o=.5+.40*sin(t*.32+6.2831*o);",
    "  float d=length(g+o-f);",
    "  if(d<f1){f2=f1;f1=d;id=n+g;}else if(d<f2){f2=d;}",
    " }}",
    " return vec3(f1,f2-f1,h1(id));}",

    "void main(){",
    " vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;",
    " vec2 m=(uM-.5*uRes)/uRes.y;m.y*=-1.;",
    " float t=uT;",
    // ~7 breaths a minute. Slow enough that you feel it rather than watch it.
    " float breath=.5+.5*sin(t*.72);",

    // Chemotaxis. Everything below is stronger the closer it is to the cursor,
    // and uLive fades the whole effect out when the pointer leaves.
    " float rm=length(uv-m);",
    // Tight. A wide gradient turns the whole page into a lamp; the point is a
    // local response in the tissue the pointer is actually over, so the falloff
    // is effectively gone by a third of the screen height.
    " float food=exp(-rm*rm*7.5)*uLive;",

    // Domain warp — the reason this reads as tissue and not as a tiling.
    " vec2 w=uv+vec2(fbm(uv*1.5+t*.05),fbm(uv*1.5-t*.04+11.3))*.34;",
    // Tissue swells toward the food source: cells near the cursor get physically
    // bigger by shrinking the sampling scale there.
    " float swell=1.-food*.30;",

    // Two layers at different depths. The far one drifts slower and sits dimmer,
    // which is what gives a flat quad the thickness of a real section.
    " vec3 c1=cells(w*3.4*swell+vec2(t*.020,-t*.014),t);",
    " vec3 c2=cells(w*6.9*swell+vec2(-t*.030,t*.023)+31.7,t*1.25);",

    // Membrane = the F2-F1 ridge. This is the single most biological line there is.
    " float mem1=1.-smoothstep(.0,.085,c1.y);",
    " float mem2=1.-smoothstep(.0,.060,c2.y);",
    // Cytoplasm: each cell tinted by its own id, so the field has variation
    // rather than one flat wash.
    " float cyto=(.35+.65*c1.z)*(1.-smoothstep(.15,.85,c1.x));",
    // Nuclei, breathing slightly out of phase per cell.
    " float nuc=smoothstep(.135+.02*sin(t*.6+c1.z*31.),.0,c1.x)*(.55+.45*c1.z);",

    // Capillaries, warped again so they wander, and pulled toward the cursor so
    // the network visibly grows in that direction.
    " vec2 vp=w*2.3+vec2(t*.035,-t*.028)-normalize(uv-m+1e-4)*food*.55;",
    " float vas=ridge(vp);",
    " vas=pow(max(vas-.62,0.)*2.6,2.0);",

    // Motes — organelles and spores adrift in the medium, the counterpart to the
    // stars in the physics field. They rise, because everything in a fluid does.
    " vec2 sp=w*17.0+vec2(0.,-t*.10);vec2 si=floor(sp);vec2 sf=fract(sp)-.5;",
    " float sv=h1(si);",
    " float mote=step(.972,sv)*smoothstep(.055,0.,length(sf-(h2(si)-.5)*.6))*(.55+.45*sin(t*2.1+sv*44.));",

    // --- compose ---
    " float lum=(.030+.055*breath)*(.55+uIn);",
    " vec3 col=vec3(.012,.026,.034)*(1.-uLight);",
    " col+=uC*cyto*lum*1.35;",
    " col+=uC*mem1*(.055+uIn*.13)*(.75+.25*breath);",
    " col+=mix(uC,vec3(1.),.35)*mem2*(.022+uIn*.055);",
    " col+=mix(uC,vec3(1.),.55)*nuc*(.020+uIn*.048);",
    " col+=mix(uC,vec3(1.,.55,.52),.30)*vas*(.055+uIn*.14);",
    " col+=vec3(.85,.95,1.)*mote*.55;",
    // The food source itself: a soft bloom, plus a brightening of whatever tissue
    // is under it, so the cursor lights the section rather than floating over it.
    " col+=uC*food*(.085+uIn*.15);",
    " col*=1.+food*.34;",
    // Depth: the section is thickest and best-lit in the middle of the field.
    " col*=1.-.38*smoothstep(.55,1.35,length(uv));",

    // Light mode: invert the physics, not the palette. On a slide the stain
    // ABSORBS — so a green stain removes red and blue and leaves green, which
    // means the structures subtract (1-uC), not uC. Subtracting uC would print
    // the complement and give a magenta negative of the tissue.
    " float dens=cyto*.30+mem1*1.05+mem2*.42+nuc*.62+vas*.95;",
    " dens=min(dens*(.46+uIn*.60)*(1.+food*.45),1.25);",
    " vec3 ink=vec3(1.)-(vec3(1.)-uC)*dens*.80-vec3(.05)*dens;",
    // Illumination falls off toward the edge of the coverslip.
    " ink=mix(ink,vec3(1.),.22*smoothstep(.55,1.4,length(uv)));",
    " col=mix(col,ink,uLight);",

    " gl_FragColor=vec4(col,1.);}"
  ].join("\n");

  var VS = "attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";

  function boot() {
    readTheme();
    // Follow the product's own theme toggle without it having to know we exist.
    try {
      new MutationObserver(readTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    } catch (e) {}
    // Pick the colour from the page the shell already declares.
    setSection((document.body && document.body.getAttribute("data-page")) || "home");
    for (var i = 0; i < 40; i++) ease();     // start already at the right colour, no fade-in from green

    var gl = null;
    try {
      gl = cv.getContext("webgl", { alpha: true, antialias: false, depth: false, stencil: false, powerPreference: "low-power" })
        || cv.getContext("experimental-webgl", { alpha: true, antialias: false, depth: false });
    } catch (e) {}

      var o = gl.createShader(ty); gl.shaderSource(o, src); gl.compileShader(o);
      if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o) || "compile");

      prog = gl.createProgram();

      gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
      gl.linkProgram(prog);

    } catch (e) { return fallback(); }
